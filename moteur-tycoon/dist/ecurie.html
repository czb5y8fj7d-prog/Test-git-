<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="color-scheme" content="light dark"><meta name="theme-color" content="#f2f4f8" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#101822" media="(prefers-color-scheme: dark)">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ecurie</title>
<style>
/* TYCOON ENGINE — style.css : design system « studio moderne ».
   Cartes arrondies, ombres douces, navigation en dock flottant, mode sombre automatique. Le jeu surcharge accent / accent2 via def.theme. */
:root{
  --bg:#f2f4f8; --surface:#fff; --card:#fff; --ink:#0f1b2d; --muted:#667085; --line:#e5e8ee; --line2:#d2d8e1;
  --accent:#1f5f84; --accent2:#d9480f; --accent-t:var(--accent); --on-accent:#fff;
  --tint:color-mix(in srgb,var(--accent) 9%,transparent); --tint2:color-mix(in srgb,var(--accent) 14%,var(--surface));
  --good:#12805c; --warn:#b45309; --bad:#d92d20;
  --body:ui-sans-serif,system-ui,-apple-system,"Segoe UI","SF Pro Text",Roboto,"Helvetica Neue",sans-serif; --display:var(--body); --mono:var(--body);
  --r:18px; --r2:12px; --sh:0 1px 2px rgba(16,24,40,.05),0 6px 18px -8px rgba(16,24,40,.12); --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
  --hazard:var(--accent2); --prim:var(--accent); --prim-ink:#fff; --board:var(--surface); --flap:var(--ink); --board-dim:var(--muted);
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#090e15; --surface:#101822; --card:#131d29; --ink:#e8edf4; --muted:#8c9bb0; --line:#1f2b3a; --line2:#2b3a4d;
  --accent-t:color-mix(in srgb,var(--accent) 52%,#fff); --tint:color-mix(in srgb,var(--accent) 22%,transparent); --tint2:color-mix(in srgb,var(--accent) 24%,var(--surface));
  --good:#3ecf9a; --warn:#f5a623; --bad:#ff7b6e; --sh:0 1px 2px rgba(0,0,0,.4),0 8px 24px -10px rgba(0,0,0,.6);
}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent;touch-action:manipulation;overflow:hidden;-webkit-font-smoothing:antialiased}
button,select,input{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 55%,transparent);outline-offset:2px}
#app{height:100%;height:100dvh;display:flex;flex-direction:column}
.muted{color:var(--muted)}.pos{color:var(--good)}.neg{color:var(--bad)}.num{text-align:right;font-variant-numeric:tabular-nums}
b,.num,.tile b,.kv b,.flap b{font-variant-numeric:tabular-nums}
h2{font-size:27px;letter-spacing:-.025em;margin:0;line-height:1.1;font-weight:800}
h3{font-size:15px;letter-spacing:-.005em;color:var(--ink);margin:0 0 2px;font-weight:700}
p{margin:0}

/* ---------- en-tête ---------- */
#board{position:relative;z-index:3;background:color-mix(in srgb,var(--surface) 90%,transparent);-webkit-backdrop-filter:saturate(1.5) blur(16px);backdrop-filter:saturate(1.5) blur(16px);border-bottom:1px solid var(--line);display:grid;grid-template-columns:minmax(0,1fr) auto auto;grid-template-areas:"b s v" "f f f";align-items:center;gap:8px 10px;padding:calc(8px + var(--safe-t)) 14px 9px}
.brand{grid-area:b;font-weight:800;font-size:17px;letter-spacing:-.02em;display:flex;align-items:center;gap:9px;min-width:0}
.brand span:first-child{display:grid;place-items:center;width:32px;height:32px;border-radius:10px;background:var(--tint);font-size:17px;flex:none}
.brand span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#flaps{grid-area:f;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:1px 0}#flaps::-webkit-scrollbar{display:none}
.grow{flex:1}#board .grow{display:none}
.flap{display:flex;flex-direction:column;flex:none;min-width:0;background:var(--bg);border-radius:12px;padding:5px 12px 6px}
.flap small{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);line-height:1.25;font-weight:600}
.flap b{font-size:15px;white-space:nowrap;line-height:1.25;font-weight:700}.flap b.neg{color:var(--bad)}
.speed{grid-area:s;display:flex;background:var(--bg);border-radius:999px;padding:3px;gap:2px}
.speed button{background:none;border:0;color:var(--muted);height:34px;min-width:38px;padding:0 6px;font-size:11px;font-weight:800;border-radius:999px;letter-spacing:-.05em}
.speed button[aria-pressed="true"]{background:var(--accent);color:#fff;box-shadow:0 3px 10px -3px color-mix(in srgb,var(--accent) 80%,transparent)}
.hsave{grid-area:v;background:var(--bg);border:0;border-radius:999px;height:40px;width:40px;font-size:16px}

/* ---------- rubriques du hub (mobile) ---------- */
#subnav{position:relative;z-index:2;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:9px 12px 3px;background:var(--bg)}
#subnav::-webkit-scrollbar{display:none}
#subnav button{flex:0 0 auto;min-height:38px;border:1px solid var(--line2);background:var(--card);border-radius:999px;padding:0 15px;font-size:14px;font-weight:650;display:flex;align-items:center;gap:7px;white-space:nowrap}
#subnav button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* ---------- mise en page ---------- */
main{flex:1;min-height:0;display:flex;flex-direction:column}
#mapwrap{position:relative;background:#dfe9ee;flex:0 0 38%;min-height:0;overflow:hidden}
#map{position:absolute;inset:0;width:100%;height:100%;display:block}
#panel{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:14px 14px 96px;scrollbar-width:thin}
.flow{display:flex;flex-direction:column;gap:12px;min-width:0;max-width:1080px;margin:0 auto}
.fadein .flow>*{animation:pin .32s both}.fadein .flow>*:nth-child(2){animation-delay:.03s}.fadein .flow>*:nth-child(n+3){animation-delay:.06s}
@keyframes pin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* dock de navigation (mobile) : flottant, 5 pôles maximum */
#tabs{position:relative;z-index:4;display:flex;gap:2px;margin:0 10px calc(8px + var(--safe-b));padding:6px;background:color-mix(in srgb,var(--surface) 92%,transparent);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:26px;box-shadow:0 10px 30px -10px rgba(10,20,40,.35)}
#tabs .sidebrand{display:none}
#tabs .hub{flex:1 1 0;min-width:0;display:flex}
#tabs .subs{display:none}
#tabs .hubbtn{flex:1;min-width:0;height:56px;background:none;border:0;border-radius:20px;padding:4px 2px;font-size:11px;font-weight:650;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;position:relative;transition:background .2s,color .2s}
#tabs .hubbtn .ti{font-size:22px;line-height:1;transition:transform .2s}
#tabs .hubbtn .tl{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#tabs .hubbtn[aria-pressed="true"]{background:var(--tint2);color:var(--accent-t);font-weight:800}
#tabs .hubbtn[aria-pressed="true"] .ti{transform:translateY(-1px) scale(1.08)}
.bdg{display:inline-grid;place-items:center;min-width:17px;height:17px;padding:0 5px;border-radius:9px;background:var(--bad);color:#fff;font-size:10.5px;font-weight:800;font-style:normal;line-height:1}
.bdg.info{background:var(--accent)}.bdg.warn{background:var(--warn)}
.hubbtn .bdg{position:absolute;top:2px;right:calc(50% - 24px);box-shadow:0 0 0 2px var(--surface)}
#tabs.many{overflow-x:auto;scrollbar-width:none}#tabs.many::-webkit-scrollbar{display:none}#tabs.many .hub{flex:0 0 74px}

/* bouton d'action contextuel */
#fab{position:fixed;right:14px;bottom:calc(88px + var(--safe-b));z-index:9;display:flex;flex-direction:column;align-items:flex-end;gap:10px}
#fab .fabmain{min-height:54px;min-width:54px;border:0;border-radius:27px;padding:0 20px;background:var(--accent2);color:#fff;font-weight:800;font-size:15px;box-shadow:0 12px 24px -8px color-mix(in srgb,var(--accent2) 75%,#000),0 2px 4px rgba(0,0,0,.15);display:flex;align-items:center;gap:8px;transition:transform .15s}
#fab .fabmain:active{transform:scale(.96)}
#fab .fabmain.round{padding:0;width:54px;font-size:26px;justify-content:center;font-weight:500}
#fab .fablist{display:flex;flex-direction:column;align-items:flex-end;gap:8px;animation:up .18s}
#fab .fablist button{min-height:46px;border:1px solid var(--line);background:var(--card);border-radius:23px;padding:0 18px;font-weight:700;box-shadow:var(--sh);display:flex;align-items:center;gap:9px}
#fab .fabscrim{position:fixed;inset:0;background:rgba(8,14,22,.4);z-index:-1;animation:fade .18s}
@keyframes fade{from{opacity:0}to{opacity:1}}

@media (min-width:600px){th{padding:10px 14px}td{padding:11px 14px}}
@media (min-width:900px){
  body{font-size:15px}
  #app{display:grid;grid-template-columns:262px 1fr;grid-template-rows:auto 1fr}
  #board{grid-column:1/3;grid-template-columns:auto minmax(0,1fr) auto auto;grid-template-areas:"b f s v";gap:10px 28px;padding:12px 24px}
  .brand{font-size:19px}
  #flaps{gap:10px}.flap{padding:6px 14px 7px}.flap b{font-size:16px}
  #subnav{display:none!important}
  main{grid-column:2;grid-row:2;flex-direction:row}
  main.hasmap #mapwrap{flex:0 0 45%}
  #tabs{grid-column:1;grid-row:2;flex-direction:column;gap:2px;margin:0;border:0;border-right:1px solid var(--line);border-radius:0;box-shadow:none;background:var(--surface);padding:18px 14px;overflow-y:auto;-webkit-backdrop-filter:none;backdrop-filter:none}
  #tabs .sidebrand{display:flex;flex-direction:column;padding:2px 12px 16px}
  #tabs .sidebrand small{color:var(--muted);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
  #tabs .sidebrand b{font-size:20px;letter-spacing:-.02em;font-weight:800}
  #tabs.many{overflow-x:visible}
  #tabs .hub,#tabs.many .hub{flex:none;flex-direction:column;margin-bottom:6px}
  #tabs .hubbtn{flex:none;height:44px;flex-direction:row;justify-content:flex-start;gap:12px;padding:0 12px;border-radius:12px;font-size:14.5px;color:var(--ink);font-weight:650;text-align:left}
  #tabs .hubbtn:hover{background:var(--bg)}
  #tabs .hubbtn .ti{font-size:19px;width:24px;text-align:center}
  #tabs .hubbtn .bdg{position:static;margin-left:auto;box-shadow:none}
  #tabs .hub.multi .hubbtn{height:34px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:800;margin-top:8px;pointer-events:none}
  #tabs .hub.multi .hubbtn[aria-pressed="true"]{background:none;color:var(--accent-t)}
  #tabs .hub.multi .hubbtn .ti{font-size:14px}
  #tabs .hub.multi .subs{display:flex;flex-direction:column;gap:1px}
  #tabs .subs button{height:40px;border:0;background:none;border-radius:11px;padding:0 12px 0 14px;display:flex;align-items:center;gap:12px;font-size:14.5px;font-weight:600;color:var(--ink);text-align:left}
  #tabs .subs button:hover{background:var(--bg)}
  #tabs .subs button .ti{font-size:17px;width:24px;text-align:center}
  #tabs .subs button .bdg{margin-left:auto}
  #tabs .subs button[aria-pressed="true"]{background:var(--tint2);color:var(--accent-t);font-weight:800}
  #tabs .hub.single.on .hubbtn{background:var(--tint2);color:var(--accent-t);font-weight:800}
  #panel{padding:26px 32px 40px}
  .flow{gap:14px}
  #fab{bottom:28px;right:32px}
}
@media (min-width:1240px){
  main:not(.hasmap) #panel .flow{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));align-items:start;gap:14px 16px;max-width:1240px}
  main:not(.hasmap) #panel .flow>h2,main:not(.hasmap) #panel .flow>.row,main:not(.hasmap) #panel .flow>.tiles,main:not(.hasmap) #panel .flow>p,main:not(.hasmap) #panel .flow>.tbl,main:not(.hasmap) #panel .flow>.news,main:not(.hasmap) #panel .flow>.card.wide,main:not(.hasmap) #panel .flow>.fbar,main:not(.hasmap) #panel .flow>details,main:not(.hasmap) #panel .flow>.fsum,main:not(.hasmap) #panel .flow>.card.fbar,main:not(.hasmap) #panel .flow>.bento{grid-column:1/-1}
}

/* ---------- composants ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--sh);display:flex;flex-direction:column;gap:10px;min-width:0}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:560px){.tiles{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}}
.tile{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;min-width:0;box-shadow:var(--sh)}
.tile small{font-size:11.5px;letter-spacing:.03em;color:var(--muted);font-weight:600}
.tile b{font-size:20px;margin-top:3px;line-height:1.2;overflow-wrap:anywhere;font-weight:750;letter-spacing:-.01em}
.kv{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:0;align-items:baseline}
.kv>*{padding:7px 0;border-bottom:1px solid var(--line)}.kv>:nth-last-child(-n+2){border-bottom:0}
.kv span{color:var(--muted)}.kv b{font-weight:650;text-align:right;padding-left:16px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{min-height:44px;border:0;background:var(--tint2);color:var(--accent-t);border-radius:var(--r2);padding:0 18px;font-weight:700;transition:transform .08s,filter .15s,background .15s}
.btn:hover{filter:brightness(.97)}.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);color:#fff;box-shadow:0 8px 18px -8px color-mix(in srgb,var(--accent) 80%,transparent)}
.btn.small{min-height:38px;padding:0 14px;font-size:13.5px;border-radius:11px}.btn.sq{width:44px;min-height:44px;padding:0;text-align:center;font-size:20px;line-height:1}
.btn[aria-disabled="true"]{opacity:.42;box-shadow:none}
.xbtn{position:sticky;top:0;z-index:2;align-self:flex-end;margin-bottom:-44px;min-width:40px;width:40px;min-height:40px!important;padding:0!important;font-size:15px;border-radius:50%!important;background:var(--bg)!important;color:var(--ink)!important;box-shadow:none!important}
.pill{display:inline-block;border-radius:999px;padding:2px 9px;font-size:11.5px;font-weight:700;background:var(--bg);color:var(--muted);vertical-align:1px;white-space:nowrap}
.pill.good{background:color-mix(in srgb,var(--good) 15%,transparent);color:var(--good)}.pill.warn{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}.pill.bad{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}.pill.info{background:var(--tint);color:var(--accent-t)}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{min-height:38px;border:1px solid var(--line2);background:var(--card);border-radius:999px;padding:0 15px;font-size:13.5px;font-weight:650;white-space:nowrap;transition:background .15s,color .15s}
.chip:hover{border-color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
.fbar{display:flex;flex-direction:column;gap:11px}
.fl{display:flex;flex-direction:column;gap:5px;min-width:0}
.fl>small{font-size:11px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -2px;padding:2px}.chips.scroll::-webkit-scrollbar{display:none}
.fsum{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
details.filters{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:0 16px}
details.filters summary{list-style:none;cursor:pointer;min-height:50px;display:flex;align-items:center;gap:10px;font-weight:750}
details.filters summary::-webkit-details-marker{display:none}
details.filters summary::after{content:"";margin-left:auto;width:9px;height:9px;border-right:2.5px solid var(--muted);border-bottom:2.5px solid var(--muted);transform:rotate(45deg) translateY(-2px);transition:transform .2s}
details.filters[open] summary::after{transform:rotate(-135deg) translateY(-2px)}
details.filters .fbar{padding:2px 0 16px}
.seg{display:inline-flex;flex-wrap:wrap;background:var(--bg);border-radius:13px;padding:3px;gap:2px;max-width:100%}
.seg button{background:none;border:0;min-height:38px;padding:0 13px;font-size:13.5px;font-weight:650;border-radius:10px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(16,24,40,.18);font-weight:800}
.bar{height:9px;border-radius:999px;background:var(--bg);overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),color-mix(in srgb,var(--accent) 60%,#fff));border-radius:999px;transition:width .4s}.bar i.good{background:var(--good)}.bar i.bad{background:var(--bad)}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--card);box-shadow:var(--sh);-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);text-align:left;padding:10px 10px;background:var(--bg);font-weight:750;white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);background:var(--card)}tr:last-child td{border-bottom:0}
th.num{text-align:right}th.num,td.num{width:1%;white-space:nowrap;font-size:13.5px}
.tbl th:first-child,.tbl td:first-child{position:sticky;left:0;z-index:1}.tbl th:first-child{background:var(--bg)}
tr.me td{background:var(--tint)}tr.dead{opacity:.45}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:7px}
.amt{display:flex;flex-direction:column;gap:8px}.amt input[type=range]{flex:1;min-width:0;height:40px;accent-color:var(--accent)}.amtv{font-weight:700}
.chart{width:100%;height:auto}.spark{width:100%;height:50px}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--muted)}.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}
.gauge{display:flex;flex-direction:column;align-items:center;width:120px}.gauge small{font-size:11px;color:var(--muted)}
.news{display:flex;flex-direction:column;gap:8px}
.nw{display:grid;grid-template-columns:62px 1fr;gap:8px;padding:12px 14px;border-radius:14px;background:var(--card);border:1px solid var(--line);box-shadow:var(--sh);position:relative}
.nw::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:4px;border-radius:0 4px 4px 0;background:var(--line2)}
.nw small{color:var(--muted)}.nw.good::before{background:var(--good)}.nw.bad::before{background:var(--bad)}.nw.info::before{background:var(--accent)}
.slot{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
details.setup{border:1px solid var(--line);border-radius:14px;padding:0 14px;background:var(--card)}
details.setup summary{list-style:none;cursor:pointer;font-weight:700;font-size:14px;min-height:46px;display:flex;align-items:center}
details.setup summary::-webkit-details-marker{display:none}details.setup summary::before{content:"›";margin-right:10px;color:var(--accent-t);font-size:20px;line-height:1;transition:transform .2s;display:inline-block}details.setup[open] summary::before{transform:rotate(90deg)}
details.setup[open] summary{border-bottom:1px solid var(--line);margin-bottom:10px}

/* ---------- fenêtres ---------- */
#modal{position:fixed;inset:0;background:rgba(8,14,22,.5);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);display:flex;align-items:flex-end;justify-content:center;z-index:20;animation:fade .18s}
.sheet{position:relative;background:var(--bg);width:min(680px,100%);max-height:93vh;max-height:93dvh;overflow-y:auto;overscroll-behavior:contain;border-radius:26px 26px 0 0;padding:22px 16px calc(18px + var(--safe-b));display:flex;flex-direction:column;gap:12px;animation:up .25s cubic-bezier(.2,.8,.2,1)}
.sheet::before{content:"";position:sticky;top:-14px;align-self:center;flex:none;width:42px;height:5px;border-radius:3px;background:var(--line2);margin:-12px 0 -2px}
.sheet>.btn.primary:last-child{position:sticky;bottom:-2px;z-index:2;min-height:54px;font-size:16px;box-shadow:0 0 0 12px var(--bg),0 8px 18px -8px color-mix(in srgb,var(--accent) 80%,transparent)}
@keyframes up{from{transform:translateY(28px);opacity:0}to{transform:none;opacity:1}}

<body>
<script>
/* =============================================================================
   TYCOON ENGINE — core.js
   Noyau SANS DOM : utilitaires, aléatoire reproductible, calendrier, formats,
   état de partie, finances, marché, événements, rivales IA, objectifs, sauvegardes.
   Extrait de « Plan de Vol » : tout ce qui n'est pas propre à l'aérien.
   Un jeu = un objet de définition (voir ENGINE.md) passé à TE.define().
   ============================================================================= */
(function (root) {
'use strict';
const TE = root.TE = root.TE || {};
TE.GAMES = TE.GAMES || {};          // registre des jeux (pour les tests et les sélecteurs)

/* ---------- Utilitaires ---------- */
TE.clamp = (v, a, b) => Math.max(a, Math.min(b, v));
TE.sum = a => a.reduce((s, x) => s + x, 0);
TE.key = (a, b) => (a < b ? a + '-' + b : b + '-' + a);
TE.esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
TE.norm = s => String(s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
TE.nf = (n, d) => Number(n).toLocaleString('fr-FR', { minimumFractionDigits: d || 0, maximumFractionDigits: d || 0 });
TE.pct = (v, d) => TE.nf(v * 100, d == null ? 0 : d) + ' %';
TE.plur = (n, w) => n + ' ' + w + (n > 1 ? 's' : '');

/* Argent : « 12,5 M€ », « 340 k€ ». Le symbole se règle par jeu (def.currency). */
TE.money = function (n) {
  const cur = (TE.def && TE.def.currency) || '€', a = Math.abs(n), s = n < 0 ? '-' : '';
  if (a >= 1e9) return s + TE.nf(a / 1e9, 2) + ' G' + cur;
  if (a >= 1e6) return s + TE.nf(a / 1e6, a >= 1e8 ? 0 : 2) + ' M' + cur;
  if (a >= 1e3) return s + TE.nf(a / 1e3) + ' k' + cur;
  return s + TE.nf(a) + ' ' + cur;
};
TE.signed = n => (n > 0 ? '+' : '') + TE.money(n);
TE.cls = n => (n < 0 ? 'neg' : 'pos');

/* ---------- Aléatoire reproductible (mulberry32, graine stockée dans G.seed) ---------- */
TE.rng = function () {
  const G = TE.G;
  G.seed = (G.seed + 0x6D2B79F5) | 0;
  let t = G.seed;
  t = Math.imul(t ^ t >>> 15, t | 1);
  t ^= t + Math.imul(t ^ t >>> 7, t | 61);
  return ((t ^ t >>> 14) >>> 0) / 4294967296;
};
TE.rand = (a, b) => a + TE.rng() * (b - a);
TE.randInt = (a, b) => Math.floor(TE.rand(a, b + 1));
TE.pick = arr => arr[Math.floor(TE.rng() * arr.length)];
/* Tirage pondéré : items = [{w:2, ...}, ...] */
TE.pickW = function (items) {
  let tot = 0; for (const i of items) tot += i.w == null ? 1 : i.w;
  let x = TE.rng() * tot;
  for (const i of items) { x -= i.w == null ? 1 : i.w; if (x <= 0) return i; }
  return items[items.length - 1];
};

/* ---------- Calendrier ----------
   Le temps est un compteur de ticks (G.day). Par défaut 1 tick = 1 jour, 30 jours/mois, 12 mois/an. */
TE.cal = function () {
  const c = (TE.def && TE.def.calendar) || {};
  return Object.assign({
    ticksPerMonth: 30, monthsPerYear: 12, startYear: 2027,
    months: ['janv.', 'févr.', 'mars', 'avr.', 'mai', 'juin', 'juil.', 'août', 'sept.', 'oct.', 'nov.', 'déc.']
  }, c);
};
TE.dateParts = function (day) {
  const c = TE.cal(), tpy = c.ticksPerMonth * c.monthsPerYear;
  return { d: day % c.ticksPerMonth + 1, m: Math.floor(day / c.ticksPerMonth) % c.monthsPerYear, y: c.startYear + Math.floor(day / tpy), yi: Math.floor(day / tpy) };
};
TE.dateStr = function (day) { const p = TE.dateParts(day), c = TE.cal(); return p.d + ' ' + c.months[p.m] + ' ' + p.y; };
TE.shortDate = function (day) { const p = TE.dateParts(day), c = TE.cal(); return p.d + ' ' + c.months[p.m]; };
TE.monthStr = function (day) { const p = TE.dateParts(day), c = TE.cal(); return c.months[p.m] + ' ' + p.y; };

/* ---------- Définition d'un jeu ---------- */
TE.define = function (def) {
  TE.def = def;
  def.save = def.save || def.id || 'tycoon';
  def.version = def.version || 1;
  def.credit = Object.assign({ base: 0, earnMult: 6, assetsMult: 0.6, minLimit: 0, rates: [0.04, 0.05, 0.065, 0.085, 0.11], graceDays: 60, bankruptFloor: -8e6 }, def.credit || {});
  def.speeds = def.speeds || [0, 1 / 3, 1, 3];
  return def;
};

/* ---------- Registre d'acteurs ---------- */
TE.player = () => TE.G.actors[0];
TE.alive = () => TE.G.actors.filter(a => !a.bankrupt);
TE.rivals = () => TE.G.actors.filter(a => !a.player && !a.bankrupt);
TE.byId = id => TE.G.actors[id];

/* Un acteur = le joueur ou une rivale. Champs génériques ; le jeu ajoute les siens librement
   (tout doit rester sérialisable : nombres, chaînes, tableaux, objets simples). */
TE.newMonth = () => ({ in: {}, out: {}, vol: 0 });
TE.mkActor = function (o) {
  const G = TE.G;
  const a = Object.assign({
    id: G.actors.length, name: 'Acteur', color: '#2456a6', player: false, profile: null,
    cash: 0, debt: 0, rep: 50, bankrupt: false, negDays: 0,
    m: TE.newMonth(), last: null, hist: [], revH: [], cashH: [], shareH: [], share: 0, vol: 0
  }, o || {});
  G.actors.push(a);
  return a;
};

/* ---------- Grand livre mensuel ----------
   TE.earn(a,'billets',1200)  → encaisse (cash + recette de la catégorie)
   TE.spend(a,'salaires',800) → décaisse
   En fin de mois, a.last = ce grand livre ; l'UI standard affiche le compte de résultat. */
TE.earn = function (a, cat, v) { if (!v) return; a.cash += v; a.m.in[cat] = (a.m.in[cat] || 0) + v; };
TE.spend = function (a, cat, v) { if (!v) return; a.cash -= v; a.m.out[cat] = (a.m.out[cat] || 0) + v; };
TE.revenue = m => TE.sum(Object.values(m.in));
TE.costs = m => TE.sum(Object.values(m.out));
TE.profit = m => TE.revenue(m) - TE.costs(m);
/* Charge non cash (amortissement) : réduit le résultat sans toucher la trésorerie */
TE.accrue = function (a, cat, v) { if (!v) return; a.m.out[cat] = (a.m.out[cat] || 0) + v; a.m.noncash = (a.m.noncash || 0) + v; };

/* ---------- Crédit, notation, emprunts ---------- */
TE.assets = a => (TE.def.assets ? TE.def.assets(a) : 0);       // valeur des actifs (le jeu la fournit)
TE.annualProfit = function (a) { const h = a.hist.slice(-12); return h.length ? TE.sum(h) / h.length * 12 : 0; };
TE.creditLimit = function (a) {
  const C = TE.def.credit, earn = Math.max(0, TE.annualProfit(a)) * C.earnMult * 0.25;
  return Math.max(C.minLimit, C.base + TE.assets(a) * C.assetsMult + earn);
};
TE.RATINGS = ['AA', 'A', 'BBB', 'BB', 'B'];
TE.rating = function (a) {
  const L = a.debt / Math.max(1, TE.creditLimit(a)), h = a.hist.slice(-6);
  let i = L < 0.2 ? 0 : L < 0.4 ? 1 : L < 0.6 ? 2 : L < 0.8 ? 3 : 4;
  if (h.length >= 3 && h.slice(-3).every(x => x < 0)) i = Math.min(4, i + 1);
  return i;
};
TE.loanRate = a => TE.def.credit.rates[TE.rating(a)];
TE.borrow = function (a, x) {
  x = Math.max(0, Math.floor(x));
  if (!x || a.debt + x > TE.creditLimit(a) + 1e-6) return false;
  a.debt += x; a.cash += x; return true;
};
TE.repay = function (a, x) {
  x = Math.min(Math.round(x), a.debt, Math.max(0, a.cash));
  if (x <= 0) return false;
  a.debt -= x; a.cash -= x; return true;
};
TE.companyValue = function (a) { return a.cash - a.debt + TE.assets(a); };

/* ---------- Modificateurs de demande / de coûts ----------
   G.mods = [{tag, scope, mult, until, label}] — expirent tout seuls.
   TE.modFactor('demande', 'CMN') → produit des mult applicables (scope vide = global). */
TE.addMod = function (m) { TE.G.mods.push(Object.assign({ until: TE.G.day + 30, mult: 1, tag: 'demande' }, m)); TE.G.mut = (TE.G.mut || 0) + 1; };
TE.modFactor = function (tag, scope) {
  let f = 1;
  for (const m of TE.G.mods) if (m.tag === tag && (!m.scope || m.scope === scope || (Array.isArray(m.scope) && m.scope.includes(scope)))) f *= m.mult;
  return f;
};

/* ---------- Fil d'actualités ---------- */
TE.news = function (text, kind, ev) {
  const G = TE.G;
  G.news.unshift({ day: G.day, text, kind: kind || 'info', ev: ev || null });
  if (G.news.length > 40) G.news.pop();
};

/* ---------- Marché : répartition d'une demande entre offreurs ----------
   entries: [{id, price, quality, cap, ...}]  (cap = capacité max servable)
   opts: {priceSens:2.2, qualSens:1.6, refPrice}
   Retourne la même liste enrichie de .sold (volumes). Modèle logit + débordement :
   ce qu'un offreur ne peut pas servir (capacité) est redistribué aux autres.        */
TE.splitMarket = function (demand, entries, opts) {
  opts = opts || {};
  const ps = opts.priceSens == null ? 2.2 : opts.priceSens, qs = opts.qualSens == null ? 1.6 : opts.qualSens;
  const ref = opts.refPrice || (entries.length ? TE.sum(entries.map(e => e.price)) / entries.length : 1) || 1;
  for (const e of entries) {
    e.sold = 0;
    e.attr = Math.pow(Math.max(0.01, e.price / ref), -ps) * Math.pow(Math.max(0.05, e.quality == null ? 1 : e.quality), qs) * (e.weight == null ? 1 : e.weight);
  }
  let left = demand, open = entries.filter(e => e.cap > 0);
  for (let it = 0; it < 8 && left > 1e-6 && open.length; it++) {
    const W = TE.sum(open.map(e => e.attr));
    if (W <= 0) break;
    let used = 0;
    for (const e of open) {
      const want = left * e.attr / W, room = e.cap - e.sold, got = Math.min(want, room);
      e.sold += got; used += got;
    }
    left -= used;
    open = open.filter(e => e.cap - e.sold > 1e-6);
  }
  entries.unmet = left;
  return entries;
};

/* ---------- Effectif (personnel) générique ----------
   staff = { kind: {n, mo (moral 0-100), lv (niveau de salaire 0-4)} }  ; def.staff décrit les métiers. */
TE.SALLV = [0.85, 0.95, 1, 1.1, 1.2];
TE.staffCount = a => TE.sum(Object.values(a.staff || {}).map(s => s.n));
TE.wagesMonth = function (a) {
  let w = 0; const S = (TE.def.staff || {});
  for (const k in (a.staff || {})) w += a.staff[k].n * (S[k] ? S[k].sal : 0) * TE.SALLV[a.staff[k].lv == null ? 2 : a.staff[k].lv];
  return w;
};
TE.avgMorale = function (a) {
  let t = 0, n = 0; for (const k in (a.staff || {})) { t += a.staff[k].mo * a.staff[k].n; n += a.staff[k].n; }
  return n ? t / n : 60;
};
TE.staffInit = function (a, counts) {
  a.staff = a.staff || {};
  for (const k in (TE.def.staff || {})) a.staff[k] = { n: (counts && counts[k]) || 0, mo: 65, lv: 2 };
};
TE.hire = function (a, k, n) {
  const s = a.staff[k], S = TE.def.staff[k]; n = Math.max(-s.n, Math.round(n)); if (!n) return false;
  if (n > 0) { const c = n * (S.hire || 0); if (a.cash < c) return false; TE.spend(a, 'recrutement', c); }
  s.n += n; if (n > 0) s.mo = Math.max(40, s.mo - 2); return true;
};
/* Moral : tend vers une cible selon le niveau de salaire ; grève si trop bas (le jeu lit a.penalty). */
TE.staffTick = function (a) {
  for (const k in (a.staff || {})) {
    const s = a.staff[k], target = 50 + 12 * (s.lv - 2) + (a.rep - 50) * 0.2;
    s.mo += (target - s.mo) * 0.02;
  }
};

/* ---------- Objectifs ----------
   def.goals = { share:{label, value:(a)=>0..1+, fmt:(v)=>'..', unit:'%'}, value:{...} }
   G.cfg.goal = 'share' | 'none' ; G.cfg.gv = valeur cible (unités de l'objectif)   */
TE.goalInfo = function () {
  const G = TE.G, C = G.cfg || {}, goals = TE.def.goals || {};
  if (!C.goal || C.goal === 'none' || !goals[C.goal]) return null;
  const g = goals[C.goal], p = TE.player(), cur = g.value(p), tgt = C.gv != null ? C.gv : g.def;
  return { id: C.goal, label: g.label, cur, tgt, frac: tgt ? cur / tgt : 0, fmt: g.fmt || (v => TE.nf(v, 1)), met: cur >= tgt };
};

/* ---------- Création de partie ---------- */
TE.newGame = function (o) {
  const def = TE.def;
  const presets = def.presets || [{}];
  const cfg = Object.assign({ goal: 'none', rivals: 4, rich: 1, aggr: 1, entr: 1, safe: 0 }, presets[o.diff == null || o.diff >= presets.length ? Math.min(1, presets.length - 1) : o.diff], o.cfg || {});
  TE.G = {

  for (const a of G.actors) { if (a.bankrupt) continue; TE.staffTick(a); a.negDays = a.cash < 0 ? a.negDays + 1 : 0; }

  if (G.day % c.ticksPerMonth === 0) TE.monthStep();
  if (G.day % (c.ticksPerMonth * c.monthsPerYear) === 0 && def.onYear) def.onYear(G);

  const p = TE.player(), gi = TE.goalInfo();

/* Clôture mensuelle : le jeu calcule recettes/charges via onMonth(G, acteur) ; le moteur gère
   intérêts, historiques, faillites, part de marché, nouveaux entrants. */
TE.monthStep = function () {
  const G = TE.G, def = TE.def, C = def.credit;
  // le joueur passe en dernier (il encaisse ce que les rivales lui versent ce mois-ci)
  const order = G.actors.slice(1).concat([G.actors[0]]);
  let tot = 0;
  for (const a of order) {
    if (a.bankrupt) continue;
    if (def.onMonth) def.onMonth(G, a);
    const interest = a.debt * (a.player ? TE.loanRate(a) : 0.006) / 12;
    TE.spend(a, 'intérêts', interest);
    const w = TE.wagesMonth(a); TE.spend(a, 'salaires', w);
    const m = a.m; m.profit = TE.profit(m);
    a.last = m; a.hist.push(Math.round(m.profit)); if (a.hist.length > 36) a.hist.shift();
    const H = (k, v) => { a[k].push(Math.round(v)); if (a[k].length > 72) a[k].shift(); };
    H('revH', TE.revenue(m)); H('cashH', a.cash);
    tot += m.vol || 0;
    a.m = TE.newMonth();
  }
  for (const a of G.actors) {
    a.share = a.bankrupt || !tot ? 0 : (a.last ? (a.last.vol || 0) / tot : 0);
    a.shareH.push(Math.round(a.share * 1e4)); if (a.shareH.length > 72) a.shareH.shift();
    // faillite des rivales (le joueur : fin de partie, sauf mode « sans faillite »)
    if (!a.bankrupt && a.negDays >= C.graceDays && a.cash < C.bankruptFloor) {
      if (a.player) { if (!G.cfg.safe) { a.bankrupt = true; } else { a.cash = 0; a.negDays = 0; TE.news('Mode sans faillite : la banque efface ton découvert.', 'info'); } }
      else {
        a.bankrupt = true; G.mut = (G.mut || 0) + 1;
        if (def.onBankrupt) def.onBankrupt(G, a);
        TE.news(a.name + ' fait faillite et quitte le marché.', 'info', 'rivalbk');
      }
    }
  }
  // nouveaux entrants : quand une rivale disparaît, une jeune structure finit par la remplacer
  if (def.entrants && G.cfg.entr !== 0) {
    const alive = G.actors.filter(a => !a.bankrupt && !a.player).length, dead = G.actors.filter(a => a.bankrupt && !a.player).length;
    if (dead && alive < (def.maxRivals || 9) && G.day - (G.lastEntry || 0) > 150 && TE.rng() < 0.35) { G.lastEntry = G.day; TE.spawnEntrant(); }
  }
  if (def.afterMonth) def.afterMonth(G, tot);
};

TE.spawnEntrant = function () {
  const G = TE.G, def = TE.def, used = new Set(G.actors.map(a => a.name)), E = def.entrants.filter(e => !used.has(e.name));

/* ---------- Événements ----------
   def.events.random   = [{w, name, when?(G), run(G)}]  tirés avec probabilité def.events.rate par tick
   def.events.scheduled= [{id, name, from, to, lead, scope, mult, text?}] : annoncés `lead` ticks avant,
                         et appliqués comme modificateur pendant [from,to].                          */
TE.eventStep = function () {
  const G = TE.G, E = TE.def.events;
  if (!E) return;
  for (const S of E.scheduled || []) {
    const lead = S.lead == null ? 120 : S.lead;
    if (!G.evSeen[S.id] && G.day >= S.from - lead && G.day < S.from) {
      G.evSeen[S.id] = 1;
      TE.news(S.text || ('À venir : ' + S.name + ' (' + TE.shortDate(S.from) + ').'), 'info', S.art || 'boom');
    }
    if (G.evSeen[S.id] === 1 && G.day >= S.from) {
      G.evSeen[S.id] = 2;
      TE.addMod({ tag: S.tag || 'demande', scope: S.scope, mult: S.mult, until: S.to, label: S.name });
    }
  }
  if (E.random && TE.rng() < (E.rate == null ? 0.5 : E.rate)) {
    const ok = E.random.filter(e => !e.when || e.when(G));
    if (ok.length) TE.pickW(ok).run(G);
  }
};

  { name: 'Rossa Corsa', profile: 'usine', color: '#c62828', cash: 45e6, lv: 62 }, { name: 'Argent Racing', profile: 'usine', color: '#78909c', cash: 45e6, lv: 60 },
  { name: 'Taurus Speed', profile: 'usine', color: '#1a237e', cash: 40e6, lv: 58 }, { name: 'Oriel GP', profile: 'independante', color: '#2e7d32', cash: 28e6, lv: 52 },

const car = a => Object.keys(AREAS).reduce((s, k) => s + AREAS[k][1] * a.car[k], 0);
const carValue = a => (a.car.aero + a.car.engine + a.car.chassis + a.car.reli) * 0.25e6;
const rdEff = a => 0.6 + 0.8 * Math.min(1.5, a.staff.engineers.n / 80);
const driverOf = a => DRIVERS[a.driver];
const nextRaceIn = G => { let d = (RACE_DAY - (G.day % 30) + 30) % 30; return d === 0 ? 30 : d; };
const raceNo = G => Math.floor(G.day / 30) % 12;

function invest(a, area, cost) {
  if (a.cash < cost) return false;
  TE.spend(a, 'R&D', cost);
  a.car[area] = Math.min(100, a.car[area] + cost / 1e6 * 1.6 * Math.pow(1 - a.car[area] / 100, 1.3) * rdEff(a));
  return true;
}

function runRace(G) {
  const n = raceNo(G), rows = [];
  for (const a of G.actors) {
    if (a.bankrupt) continue;
    const reliB = (a.staff.mechanics.n / 120 - 1) * 5;
    const dnf = TE.rng() < clamp(0.22 - (a.car.reli + reliB) * 0.0018, 0.03, 0.25);
    const noise = (TE.rng() + TE.rng() + TE.rng() - 1.5) * 9;
    rows.push({ a, perf: 0.7 * car(a) + 0.3 * driverOf(a).skill + noise, dnf });
  }
  rows.sort((x, y) => (x.dnf - y.dnf) || (y.perf - x.perf));
  rows.forEach((r, i) => {
    const pts = r.dnf ? 0 : POINTS[i] || 0;
    r.pos = i + 1; r.pts = pts;
    r.a.pts += pts; r.a.ptsTotal += pts; r.a.m.vol += pts; if (i === 0 && !r.dnf) r.a.wins++;
    TE.earn(r.a, 'prize', PRIZE[i] || 0.3e6);
    r.a.rep = clamp(r.a.rep + ((rows.length + 1) / 2 - r.pos) * 0.5, 10, 100);
  });
  G.game.last = { circuit: CIRCUITS[n], no: n + 1, year: TE.dateParts(G.day).y, rows: rows.map(r => ({ id: r.a.id, pos: r.pos, pts: r.pts, dnf: r.dnf })) };
  const w = rows[0], me = rows.find(r => r.a.player);
  TE.news('GP de ' + CIRCUITS[n] + ' : victoire de ' + w.a.name + '. ' + (me ? (me.dnf ? 'Abandon pour toi.' : 'Tu termines ' + me.pos + 'e (' + me.pts + ' pts).') : ''), me && me.pos <= 3 ? 'good' : me && me.dnf ? 'bad' : 'info');
}

  ledger: { in: { sponsors: 'Sponsors', prize: 'Primes de course' }, out: { 'R&D': 'Développement', pilotes: 'Pilotes', logistique: 'Logistique & usine', salaires: 'Salaires', 'intérêts': 'Intérêts' } },
  assets: carValue,
  goals: {
    points: { label: 'Points cumulés', unit: 'pts', def: 500, value: a => a.ptsTotal, fmt: v => TE.nf(v) + ' pts' },
    titres: { label: 'Titres constructeurs', unit: 'titres', def: 2, value: a => a.titles, fmt: v => TE.nf(v) },
    value: { label: 'Valeur de l\'écurie', unit: 'M€', def: 150, value: a => TE.companyValue(a) / 1e6, fmt: v => TE.nf(v) + ' M€' }
  },

  init(G) { G.game = { last: null }; },
  initActor(G, a, R) {
    const lv = R ? R.lv : 42;
    a.car = { aero: lv + TE.rand(-6, 6), engine: lv + TE.rand(-6, 6), chassis: lv + TE.rand(-6, 6), reli: lv + TE.rand(-6, 6) };
    a.driver = R ? PROFILES[R.profile].driver : 0; a.pts = 0; a.ptsTotal = 0; a.wins = 0; a.titles = 0;
    a.staff.engineers.n = R ? 40 + Math.round(lv) : 60; a.staff.mechanics.n = R ? 60 + Math.round(lv) : 90;
    a.rep = R ? 30 + lv * 0.6 : 45;
  },
  welcome: () => 'Ton écurie est créée. Investis dans la voiture avant la première course.',

  /* Boucle : la course est le seul événement « jeu » du tick ; le reste est dans le moteur */
  onTick(G) { if (isRaceDay(G)) runRace(G); },
  onMonth(G, a) {
    TE.earn(a, 'sponsors', (1.2e6 + 0.05e6 * a.rep) * TE.modFactor('sponsor'));
    TE.spend(a, 'logistique', a.profile ? PROFILES[a.profile].logi : 1.8e6);
    TE.spend(a, 'pilotes', driverOf(a).sal);
    for (const k in a.car) a.car[k] = Math.max(20, a.car[k] * 0.995);      // obsolescence : il faut développer en continu
  },
  onYear(G) {
    const live = G.actors.filter(a => !a.bankrupt).sort((x, y) => y.pts - x.pts), champ = live[0];
    if (champ) { champ.titles++; TE.news('Saison terminée : ' + champ.name + ' est championne constructeurs (' + champ.pts + ' pts).', champ.player ? 'good' : 'info'); }
    for (const a of G.actors) a.pts = 0;
  },
  autoPause: G => isRaceDay(G) && TE.G.cfg.pauseRace !== 0,
  rankingSort: a => a.pts * 1e6 + a.ptsTotal,
  rankingTitle: 'Championnat constructeurs',
  rankingCols: [{ h: 'Pts', cls: 'num', get: a => a.pts }, { h: 'Total', cls: 'num', get: a => a.ptsTotal }, { h: 'Titres', cls: 'num', get: a => a.titles }, { h: 'Trésorerie', cls: 'num', get: a => money(a.cash) }],
  saveMeta: (G, p) => ({ pts: p.ptsTotal, titles: p.titles }),
  endText: (G, p, win) => win ? 'Ton écurie atteint son objectif : ' + p.ptsTotal + ' points et ' + p.titles + ' titre(s).' : 'Ton écurie n\'a plus les moyens de courir. Dernier bilan : ' + p.ptsTotal + ' points, ' + p.titles + ' titre(s).',

  ai: {
    week(G, a, P) {
      if (!TE.ai.willing(P)) return;
      if (P.driver > a.driver && TE.ai.canAfford(a, DRIVERS[P.driver].fee, P) && TE.rng() < 0.1) { TE.spend(a, 'pilotes', DRIVERS[P.driver].fee); a.driver = P.driver; return; }
      const area = Object.keys(a.car).sort((x, y) => a.car[x] - a.car[y])[0];       // renforce le point faible
      if (TE.ai.canAfford(a, P.spend, P)) invest(a, area, P.spend);
    }
  },

  events: {
    rate: 0.04,
    scheduled: [{ id: 'gala', name: 'Gala de la fédération', from: 150, to: 180, lead: 60, tag: 'sponsor', mult: 1.2, text: 'Un gala de la fédération approche : les sponsors seront généreux (+20 %).' }],
    random: [

      { w: 1.5, name: 'crise', run(G) { TE.addMod({ tag: 'sponsor', mult: 0.8, until: G.day + 120, label: 'Crise économique' }); TE.news('Crise économique : les budgets de sponsoring reculent de 20 % pendant 4 mois.', 'bad'); } },
      { w: 1, name: 'regl', when: G => G.day - (G.flags.reg || -999) > 300, run(G) { G.flags.reg = G.day; for (const a of G.actors) { a.car.aero *= 0.93; a.car.engine *= 0.96; } TE.news('Nouvelle réglementation technique : toutes les voitures perdent en aérodynamique et en moteur.', 'info'); } },
      { w: 1, name: 'espion', run(G) { const R = TE.rivals(); if (!R.length) return; const a = TE.pick(R); a.car.aero = Math.max(20, a.car.aero - 6); TE.news('Fuite technique chez ' + a.name + ' : elle perd du terrain en aérodynamique.', 'info'); } },
      { w: 1, name: 'transfert', run(G) { const R = TE.rivals().filter(a => a.driver < 2); if (!R.length) return; const a = TE.pick(R); a.driver++; TE.news(a.name + ' engage un meilleur pilote.', 'info'); } }
    ]
  },

  kpis: [
    { label: 'Date', get: (p, G) => TE.dateStr(G.day) },
    { label: 'Trésorerie', get: p => money(p.cash), cls: p => (p.cash < 0 ? 'neg' : '') },
    { label: 'Championnat', get: (p, G) => rankOf(G, p) + 'e · ' + p.pts + ' pts' },
    { label: 'Prochaine course', get: (p, G) => 'J-' + nextRaceIn(G) }
  ],

  tabs: [
    { id: 'course', label: 'Course', icon: '🏁', render: panelCourse },
    { id: 'voiture', label: 'Voiture', icon: '🔧', render: panelVoiture },
    { id: 'equipe', label: 'Équipe', icon: '👥', render: panelEquipe },
    { id: 'finances', label: 'Finances', icon: '💶', render: '@finance' },
    { id: 'classement', label: 'Classement', icon: '🏆', render: '@ranking' },
    { id: 'actus', label: 'Actus', icon: '📰', render: '@news' }
  ],

  actions: {
    rd(d, c) { const x = c.UI.amt[d.k]; if (!invest(c.p, d.area, x)) return c.toast('Trésorerie insuffisante.'); c.toast(AREAS[d.area][0] + ' : +' + TE.nf(x / 1e6 * 1.6 * Math.pow(1 - (c.p.car[d.area] / 100), 1.3) * rdEff(c.p), 1) + ' environ.'); },
    driver(d, c) { const t = +d.v, D = DRIVERS[t], p = c.p; if (p.driver === t) return; const fee = t > p.driver ? D.fee : 0; if (p.cash < fee) return c.toast('Trésorerie insuffisante pour la prime de signature.'); TE.spend(p, 'pilotes', fee); p.driver = t; c.toast(D.label + ' signé.'); },
    hire(d, c) { if (!TE.hire(c.p, d.k, +d.n)) c.toast('Impossible (trésorerie ou effectif).'); },
    wage(d, c) { c.p.staff[d.k].lv = +d.v; }
  }
};

function rankOf(G, p) { return G.actors.filter(a => !a.bankrupt).sort((x, y) => (y.pts - x.pts) || (y.ptsTotal - x.ptsTotal)).indexOf(p) + 1; }

function panelCourse(G, p) {
  const L = G.game.last, rows = G.actors.filter(a => !a.bankrupt).sort((x, y) => (y.pts - x.pts) || (y.ptsTotal - x.ptsTotal));
  let h = '<h2>Saison ' + TE.dateParts(G.day).y + '</h2>' + H.tiles([['Prochaine course', 'GP de ' + CIRCUITS[Math.floor((G.day + nextRaceIn(G)) / 30) % 12]], ['Dans', nextRaceIn(G) + ' j'], ['Championnat', rankOf(G, p) + 'e / ' + rows.length], ['Points', p.pts]]) + TE.panels.goal();
  if (L) h += H.card('Dernière course : GP de ' + L.circuit, H.table([{ h: 'Pos', cls: 'num', get: r => r.dnf ? 'Abd' : r.pos }, { h: 'Écurie', get: r => '<i class="dot" style="background:' + G.actors[r.id].color + '"></i>' + esc(G.actors[r.id].name) }, { h: 'Pts', cls: 'num', get: r => r.pts }],
    L.rows.slice(0, 10).map(r => Object.assign({ _cls: r.id === 0 ? 'me' : '' }, r))));
  h += H.card('Classement de la saison', H.table([{ h: '#', cls: 'num', get: r => r._rank }, { h: 'Écurie', get: a => '<i class="dot" style="background:' + a.color + '"></i>' + esc(a.name) }, { h: 'Pts', cls: 'num', get: a => a.pts }], rows.map((a, i) => Object.assign({ _cls: a.player ? 'me' : '', _rank: i + 1 }, a))));
  return h;
}
function panelVoiture(G, p) {
  const cost = k => Math.min(Math.max(0, p.cash), 6e6);
  return '<h2>Voiture</h2><p class="muted">Chaque investissement fait progresser la voiture, mais plus elle est développée, plus les gains diminuent. Ses performances s\'érodent un peu chaque mois. Efficacité de ton bureau d\'études : <b>' + TE.pct(rdEff(p)) + '</b>.</p>' +
    Object.keys(AREAS).map(k => H.card(AREAS[k][0] + ' <span class="pill info">' + TE.nf(p.car[k], 1) + ' / 100</span>', H.bar(p.car[k], 100) +
      H.amt({ k: 'rd_' + k, min: 5e5, max: Math.max(5e5, cost(k)), step: 5e5, def: 2e6, act: 'rd', attrs: ' data-area="' + k + '"', cls: 'primary', fmt: v => 'Investir ' + money(v), lbl: 'Montant de développement', why: 'Trésorerie insuffisante' }))).join('');
}
function panelEquipe(G, p) {
  const S = TE.def.staff;
  return '<h2>Équipe</h2>' + H.card('Pilote', '<div class="row">' + DRIVERS.map((D, i) => '<button class="btn' + (p.driver === i ? ' primary' : '') + '" data-act="driver" data-v="' + i + '">' + D.label + '<br><small>' + D.skill + ' · ' + money(D.sal) + '/mois' + (i > p.driver ? ' · prime ' + money(D.fee) : '') + '</small></button>').join('') + '</div>') +
    Object.keys(S).map(k => H.card(S[k].label + ' : ' + p.staff[k].n, H.kv([['Moral', Math.round(p.staff[k].mo) + ' / 100'], ['Salaire mensuel total', money(p.staff[k].n * S[k].sal * TE.SALLV[p.staff[k].lv])]]) +
      '<div class="row">' + [[-10, '−10'], [10, '+10'], [25, '+25']].map(x => '<button class="btn small" data-act="hire" data-k="' + k + '" data-n="' + x[0] + '">' + x[1] + (x[0] > 0 ? ' (' + money(x[0] * S[k].hire) + ')' : '') + '</button>').join('') + '</div>' +
      '<div class="row"><span class="muted" style="font-size:12px">Niveau de salaire</span>' + H.seg('wage', k, p.staff[k].lv, ['−−', '−', '=', '+', '++']) + '</div>')).join('');
}

<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plan de Vol</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=B612:wght@400;700&family=B612+Mono:wght@400;700&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Carte aéronautique de jour + tableau des départs. Une seule ambiance, assumée. */
  --sea:#d6e4ea; --land:#f2efe4; --paper:#f8f7f2; --card:#ffffff;
  --ink:#17263a; --muted:#5b6a7c; --line:#cdd6dc;
  --magenta:#b01f6a; --blue:#2456a6;
  --board:#131922; --amber:#ffc447; --board-dim:#8d97a5;
  --good:#1b7f54; --warn:#b86a00; --bad:#c2362f;
  --display:"Barlow Condensed","Arial Narrow",sans-serif;
  --body:"B612","Segoe UI",system-ui,sans-serif;
  --mono:"B612 Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--magenta);outline-offset:2px}
#app{height:100%;display:flex;flex-direction:column}

#board{background:var(--board);color:#fff;display:flex;align-items:center;gap:10px 16px;padding:8px 14px;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:.08em;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.flap{display:flex;flex-direction:column;min-width:0}
.flap small{font-family:var(--display);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--board-dim)}
.flap b{font-family:var(--mono);font-size:15px;color:var(--amber);white-space:nowrap}
.flap b.neg{color:#ff7a70}
.grow{flex:1}
.speed{display:flex;border:1px solid #39424f;border-radius:6px;overflow:hidden}
.speed button{background:none;border:0;color:var(--board-dim);padding:7px 11px;font-family:var(--mono);font-size:13px;min-width:40px}
.speed button+button{border-left:1px solid #39424f}
.speed button[aria-pressed="true"]{background:var(--amber);color:var(--board);font-weight:700}

main{flex:1;min-height:0;display:flex;flex-direction:column}
#mapwrap{position:relative;background:var(--sea);flex:0 0 50%;min-height:0;overflow:hidden}
#map{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
.maptop{position:absolute;left:8px;right:52px;top:8px;display:flex;flex-direction:column;gap:6px;pointer-events:none}
.maptop>*{pointer-events:auto}
.search{position:relative;width:min(260px,100%)}
.search input{width:100%;border:1px solid var(--line);border-radius:999px;padding:7px 12px;background:var(--card);font-size:13px}
#qres{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--card);border:1px solid var(--line);border-radius:8px;overflow:hidden;z-index:5;box-shadow:0 6px 18px rgba(23,38,58,.18)}
#qres[hidden]{display:none}
#qres button{display:flex;width:100%;gap:8px;align-items:baseline;background:none;border:0;border-bottom:1px solid #eef1f3;padding:8px 12px;text-align:left;font-size:13px}
#qres button span{color:var(--muted);font-size:11px;margin-left:auto}
.chips{display:flex;flex:none;gap:6px;overflow-x:auto;scrollbar-width:none;touch-action:pan-x;padding-bottom:1px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 10px;font-size:12px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip i{width:9px;height:9px;border-radius:50%;display:block}
.chip.al[aria-pressed="true"]{background:var(--card);color:var(--ink);border-color:var(--ink)}
.chip.al[aria-pressed="false"]{opacity:.55;text-decoration:line-through}
.mapctl{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:6px}
.mapctl button{width:36px;height:36px;border-radius:6px;border:1px solid var(--line);background:var(--card);font-family:var(--mono);font-size:17px;line-height:1;display:flex;align-items:center;justify-content:center}
.mapctl img{width:20px;height:20px}
#legend{position:absolute;left:8px;bottom:8px;right:8px}
#panel{flex:1;min-height:0;overflow-y:auto;padding:14px 16px 24px;display:flex;flex-direction:column;gap:14px}
body[data-tab]:not([data-tab="carte"]) #mapwrap{display:none}

#tabs{display:flex;background:var(--card);border-top:1px solid var(--line)}
#tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;background:none;border:0;border-top:3px solid transparent;padding:6px 2px 7px;font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
#tabs button[aria-pressed="true"]{color:var(--magenta);border-top-color:var(--magenta)}
#tabs img{width:24px;height:24px;opacity:.5}
#tabs button[aria-pressed="true"] img{opacity:1}
.evt{width:48px;height:32px;object-fit:cover;border-radius:3px;flex:none;border:1px solid var(--line)}
.hero{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:8px}
.apt{width:68px;height:68px;object-fit:cover;border-radius:6px;flex:none}
.ico{width:18px;height:18px;vertical-align:-3px;margin-right:5px}
.tabhero{width:100%;height:118px;object-fit:cover;border-radius:8px;display:block}
.thumb{width:64px;height:64px;object-fit:cover;border-radius:6px;flex:none}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.duo figure{margin:0;display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
.duo img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:6px;border:2px solid transparent}
.duo img.on{border-color:var(--magenta)}
.banner{width:calc(100% + 28px);margin:-12px -14px 0;height:110px;object-fit:cover;border-radius:8px 8px 0 0;display:block}

@media (max-width:600px){
  #board{padding:7px 12px;gap:6px 14px}
  .brand{font-size:17px;order:0;min-width:0}
  .brand span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:38vw}
  #board .grow{order:1}
  .speed{order:2}
  .speed button{padding:6px 9px;min-width:36px}
  .flap{order:3;flex:1 1 auto}
  .flap b{font-size:13px}
  #tabs button{font-size:13px;letter-spacing:.04em}
}
@media (min-width:900px){
  main{flex-direction:row}
  #mapwrap{flex:1 1 auto}
  body[data-tab]:not([data-tab="carte"]) #mapwrap{display:block}
  #panel{flex:0 0 440px;border-left:1px solid var(--line)}
}

h2{font-family:var(--display);font-weight:700;font-size:24px;letter-spacing:.03em;text-transform:uppercase;margin:0;text-wrap:balance}
h3{font-family:var(--display);font-weight:600;font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
p{margin:0}
.muted{color:var(--muted)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.pos{color:var(--good)} .neg{color:var(--bad)}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.row>.grow{flex:1;min-width:0}
.btn{background:var(--card);border:1px solid var(--ink);border-radius:6px;padding:8px 12px;font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:.06em;text-transform:uppercase}
.btn.primary{background:var(--magenta);border-color:var(--magenta);color:#fff}
.btn.small{padding:5px 9px;font-size:13px}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.pill{display:inline-block;font-family:var(--display);font-weight:600;font-size:12px;letter-spacing:.1em;text-transform:uppercase;padding:1px 7px;border-radius:3px;border:1px solid currentColor}
.pill.good{color:var(--good)} .pill.warn{color:var(--warn)} .pill.bad{color:var(--bad)} .pill.info{color:var(--blue)}
.alert{border-left:4px solid var(--warn);background:#fff7e8;padding:8px 10px;border-radius:0 6px 6px 0;font-size:13px}
.alert.bad{border-color:var(--bad);background:#fdeceb}
.bar{height:8px;background:#e6eaed;border-radius:4px;overflow:hidden;position:relative}
.bar>i{display:block;height:100%;background:var(--blue)}
.bar.goal>i{background:var(--magenta)}
.bar .mark{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink)}
table{border-collapse:collapse;width:100%}
td,th{padding:5px 4px;text-align:left;border-bottom:1px solid #e7ebee;font-size:13px}
td.r,th.r{text-align:right}
th{font-family:var(--display);font-weight:600;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding-top:10px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;gap:2px}
.tile small{font-family:var(--display);font-weight:600;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.tile b{font-family:var(--mono);font-size:17px;font-weight:400}
tr.total td{font-weight:700;border-top:2px solid var(--ink);border-bottom:0}
.route{cursor:pointer}
.route .od{font-family:var(--mono);font-weight:700;font-size:15px}
.kv{display:grid;grid-template-columns:1fr auto;gap:3px 12px;font-size:13px}
.kv b{font-family:var(--mono);font-weight:400;text-align:right}
.seg{display:flex;border:1px solid var(--ink);border-radius:6px;overflow:hidden}
.seg button{flex:1;background:var(--card);border:0;padding:6px 4px;font-size:12px}
.seg button+button{border-left:1px solid var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.news{display:flex;flex-direction:column}
.news div{padding:6px 0;border-bottom:1px solid #e7ebee;font-size:13px;display:flex;gap:8px}
.news time{font-family:var(--mono);font-size:11px;color:var(--muted);flex:0 0 52px;padding-top:2px}
.plane-ico{flex:0 0 112px;width:112px;height:auto}
.bd-strip{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:10px 0}
.bd-m{text-align:center;font-size:11px;line-height:1.25}.bd-m .pt{width:100%;aspect-ratio:3/4;border-radius:10px;object-fit:cover;object-position:top;background:#dfe7ea;display:block}
.bd-m .ini{width:100%;aspect-ratio:1;border-radius:10px;display:flex;align-items:center;justify-content:center;font:700 20px 'Barlow Condensed';color:#fff}
.bd-m b{display:block;font-size:11px;margin-top:3px}.bd-m .bar{height:5px;margin-top:3px}
.bd-q{display:flex;gap:10px;align-items:flex-start;margin:8px 0}.bd-q img,.bd-q .ini{flex:0 0 56px;width:56px;height:70px;border-radius:10px;object-fit:cover;object-position:top}
.bd-q .ini{display:flex;align-items:center;justify-content:center;font:700 18px 'Barlow Condensed';color:#fff}
.bd-q .bub{flex:1;background:#fff;border:1px solid var(--line);border-radius:4px 12px 12px 12px;padding:8px 10px;font-size:13px}
.bd-q .bub small{display:block;color:var(--muted);font-size:11px;margin-bottom:2px}
.gauge{display:block;margin:0 auto}.gauge .ndl{transition:transform 1.4s cubic-bezier(.2,.8,.2,1);transform-origin:100px 100px}
.gcard{border:2px solid var(--line);border-radius:10px;padding:10px;margin:8px 0;background:#fff;cursor:pointer}
.gcard[aria-pressed=true]{border-color:var(--magenta);box-shadow:0 0 0 3px rgba(176,31,106,.12)}
.chart svg{display:block;width:100%;height:auto}.chart .lg{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--muted);margin-top:4px}.chart .lg i{display:inline-block;width:10px;height:3px;border-radius:2px;margin-right:4px;vertical-align:middle}
[aria-disabled=true]{opacity:.45;cursor:not-allowed}
#toast{position:fixed;left:50%;bottom:84px;transform:translate(-50%,20px);width:max-content;max-width:min(92vw,460px);box-sizing:border-box;background:#17263A;color:#F2EFE4;padding:11px 16px;border-radius:12px;font-size:14px;line-height:1.35;box-shadow:0 10px 30px rgba(0,0,0,.3);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:60;border-left:4px solid #FFC447}
#toast.on{opacity:1;transform:translate(-50%,0)}
.seas{display:flex;gap:3px;align-items:flex-end;height:44px;margin:6px 0 2px}.seas i{flex:1;background:#9fb9c7;border-radius:2px 2px 0 0;min-height:3px}.seas i.cur{background:var(--magenta)}.seas i.ev{background:#e0a21b}
.seasl{display:flex;gap:3px;font:10px 'B612 Mono',monospace;color:var(--muted)}.seasl span{flex:1;text-align:center}
.plane-hero{position:relative;margin:-4px -4px 2px;height:150px;border-radius:8px;overflow:hidden;cursor:zoom-in;background:linear-gradient(180deg,#D6E4EA 0%,#EEF3F2 62%,#F2EFE4 100%);display:flex;align-items:center;justify-content:center}
.plane-hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:6px;background:var(--mk)}
.plane-hero img{width:var(--w);max-height:128px;object-fit:contain;filter:drop-shadow(0 10px 8px rgba(23,38,58,.18));transition:transform .25s}
.plane-hero:hover img{transform:translateX(-4px) scale(1.02)}
.plane-hero .zz{position:absolute;right:8px;top:8px;font:600 11px var(--body);color:#17263A;background:rgba(255,255,255,.75);padding:3px 7px;border-radius:10px}
.plane-hero.sm{height:118px}.plane-hero.sm img{max-height:98px}
@media (min-width:700px){.plane-hero{height:190px}.plane-hero img{max-height:165px}}
#zoom{position:fixed;inset:0;z-index:40;background:linear-gradient(180deg,#BFD4DE 0%,#D6E4EA 45%,#EEF1EA 75%,#F2EFE4 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px;cursor:zoom-out;color:#17263A}
#zoom[hidden]{display:none}
#zoom .zst{position:relative;width:100%;max-width:1200px;display:flex;justify-content:center;align-items:center;min-height:38vh}
#zoom .zst img{width:var(--w);max-height:55vh;object-fit:contain;filter:drop-shadow(0 26px 16px rgba(23,38,58,.22));animation:zin .45s cubic-bezier(.2,.8,.2,1)}
@keyframes zin{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
#zoom .zband{width:min(1200px,100%);height:5px;background:var(--mk);border-radius:3px}
#zoom h3{margin:0;color:#17263A!important;opacity:1;text-align:center;font:700 30px 'Barlow Condensed',sans-serif;letter-spacing:.04em;text-transform:uppercase}
#zoom .zsub{font-size:13px;opacity:.8;text-align:center}
#zoom .zsig{font-size:14px;max-width:560px;text-align:center;opacity:.9;font-style:italic}
#zoom .zk{display:flex;flex-wrap:wrap;gap:8px 18px;justify-content:center;font:13px 'B612 Mono',monospace}
#zoom .zk b{color:#B01F6A;font-weight:700}
#zoom .zx{position:absolute;top:14px;right:16px;font-size:13px;opacity:.7}

.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.spark{display:flex;align-items:flex-end;gap:3px;height:64px;border-bottom:1px solid var(--line);position:relative}
.spark i{flex:1;background:var(--good);min-height:2px;border-radius:2px 2px 0 0}
.spark i.n{background:var(--bad)}
.lbl{font-family:var(--display);font-weight:600;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
/* liste de destinations */
.dlist{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:8px;background:var(--card);max-height:300px;overflow-y:auto}
.drow{display:flex;align-items:center;gap:10px;background:none;border:0;border-bottom:1px solid #eef1f3;padding:8px 12px;text-align:left;width:100%}
.drow:last-child{border-bottom:0}
.drow:disabled{opacity:.45;cursor:not-allowed}
.drow b{font-size:14px}
.drow small{display:block;color:var(--muted);font-size:11.5px}
.drow .num{margin-left:auto;white-space:nowrap;font-size:13px}
.drow:not(:disabled):hover{background:#f4f6f7}

#modal{position:fixed;inset:0;background:rgba(19,25,34,.55);display:flex;align-items:flex-end;justify-content:center;z-index:20}
#modal.top{z-index:35}
.slot{border:1px solid var(--line);border-radius:10px;padding:10px;margin:8px 0;background:#fff}.slot.empty{background:transparent;border-style:dashed}
.slot .sw{flex:0 0 12px;height:36px;border-radius:4px}
.hsave{background:none;border:1px solid rgba(255,255,255,.25);color:#F2EFE4;border-radius:8px;width:34px;height:30px;display:flex;align-items:center;justify-content:center;cursor:pointer;margin-left:6px}
.hsave svg{width:17px;height:17px}
textarea.code{width:100%;min-height:90px;font:11px 'B612 Mono',monospace;border:1px solid var(--line);border-radius:8px;padding:8px;box-sizing:border-box;word-break:break-all}
#modal[hidden]{display:none}
.sheet{background:var(--paper);width:min(560px,100%);max-height:92%;overflow-y:auto;border-radius:12px 12px 0 0;padding:16px 16px 22px;display:flex;flex-direction:column;gap:12px}
.sheet>*{flex-shrink:0}
@media (min-width:700px){#modal{align-items:center}.sheet{border-radius:12px}}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px}
label.f>span{font-family:var(--display);font-weight:600;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
select,input[type=text],input[type=search]{background:var(--card);border:1px solid var(--ink);border-radius:6px;padding:8px;width:100%}
input[type=range]{width:100%;accent-color:var(--magenta)}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:36px;height:36px;border:1px solid var(--ink);background:var(--card);border-radius:6px;font-family:var(--mono);font-size:17px}
.stepper b{font-family:var(--mono);font-size:17px;min-width:24px;text-align:center}

#start{position:fixed;inset:0;z-index:30;background:linear-gradient(180deg,rgba(19,25,34,0) 22%,rgba(19,25,34,.93) 58%),url(art/title-m.jpg) center top/cover no-repeat,#131922;display:flex;align-items:flex-end;justify-content:center;padding:16px;overflow-y:auto}
#start[hidden]{display:none}
.title{width:min(560px,100%);color:#fff;display:flex;flex-direction:column;gap:14px;margin:auto 0 0}
.title h1{font-family:var(--display);font-weight:700;font-size:clamp(56px,17vw,104px);line-height:.86;letter-spacing:.01em;text-transform:uppercase;margin:0}
.title h1 span{color:var(--amber)}
.title .lede{font-size:15px;max-width:44ch}
.title .card{color:var(--ink)}
@media (min-width:900px){#start{background:linear-gradient(90deg,rgba(19,25,34,.96) 0%,rgba(19,25,34,.9) 30%,rgba(19,25,34,0) 58%),url(art/title-d.jpg) right center/cover no-repeat,#131922;align-items:center;justify-content:flex-start;padding-left:7vw}.title{margin:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body data-tab="carte">
<div id="app">
  <header id="board">
    <div class="brand"><img src="art/logo-0.jpg" width="24" height="24" alt="" style="border-radius:50%"><span id="coname">Plan de Vol</span></div>
    <div class="flap"><small>Date</small><b id="hdate">--</b></div>
    <div class="flap"><small>Trésorerie</small><b id="hcash">--</b></div>
    <div class="flap"><small>Résultat du mois</small><b id="hprofit">--</b></div>
    <div class="grow"></div>
    <div class="speed" role="group" aria-label="Vitesse du temps">
      <button data-act="speed" data-v="0" aria-label="Pause">II</button>
      <button data-act="speed" data-v="1" aria-label="Vitesse normale">&gt;</button>
      <button data-act="speed" data-v="2" aria-label="Vitesse rapide">&gt;&gt;</button>
      <button data-act="speed" data-v="3" aria-label="Vitesse très rapide">&gt;&gt;&gt;</button>
    </div>
    <button class="hsave" data-act="saves" aria-label="Sauvegardes" title="Sauvegardes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M5 3h11l3 3v15H5z"/><path d="M8 3v6h8V3"/><rect x="8" y="13" width="8" height="6"/></svg></button>
  </header>
  <main>
    <section id="mapwrap" aria-label="Carte du monde">
      <canvas id="map"></canvas>
      <div class="maptop">
        <div class="search"><input type="search" id="q" placeholder="Chercher une ville ou un code" autocomplete="off" aria-label="Chercher une ville"><div id="qres" hidden></div></div>
        <div class="chips" id="regions" role="group" aria-label="Aller à une région"></div>
      </div>
      <div class="mapctl">

function optimizeRoute(al,a,b,planes,extra,via,rid){const d=dist(a,b),R={a,b,via:via||null,planes:planes||[]},skip=rid?al.routes.find(x=>x.id===rid):null,mr=Math.max(1,Math.min(maxRotRoute(al,R,extra),slotLimit(al,R,skip))),o=routeOps(al,{a,b,via:R.via,planes:R.planes,rot:99},extra,false);

  for(let pass=0;pass<2;pass++)for(const [k,base] of cls){let bv=cur,bp=P[k];

  if(M.kind==='route'){if(!M.plane||!M.b)return;o=optimizeRoute(p,M.a,M.b,[M.plane],null,M.via);}
  else{const r=p.routes.find(x=>x.id===M.rid);o=optimizeRoute(p,r.a,r.b,r.planes,null,r.via,r.id);}
  if(!o)return;M.rot=o.rot;M.price=o.price;M.priceB=o.priceB;M.priceF=o.priceF;M.opt=o.profit;const st=$('sheet').scrollTop;renderModal();$('sheet').scrollTop=st;},
 bestdest(){const M=UI.modal,p=player(),pl=planeOf(p,M.plane);if(!pl)return;
  const top=destScan(p,M.a,pl).filter(x=>x.pf!==null&&!x.has).sort((x,y)=>y.pf-x.pf).slice(0,6);let best=null;
  for(const x of top){if(x.via)continue;const o=optimizeRoute(p,M.a,x.a.code,[pl.id]);if(o&&(!best||o.profit>best.o.profit))best={b:x.a.code,o};}
  if(!best)return;M.b=best.b;M.rot=best.o.rot;M.price=best.o.price;M.priceB=best.o.priceB;M.priceF=best.o.priceF;M.opt=best.o.profit;M.step='tune';renderModal();$('sheet').scrollTop=0;},
 changedest(){const M=UI.modal;M.step='pick';M.via=null;M.rot=0;M.price=null;renderModal();},
 editroute(d){openModal('edit',{rid:+d.v,price:null});},
 showroute(){const M=UI.modal,r=player().routes.find(x=>x.id===M.rid);closeModal();UI.tab='carte';UI.sel=r.b;renderAll(true);requestAnimationFrame(()=>{resizeMap();const A=APX[r.a],B=APX[r.b];
  if(Math.abs(A.lon-B.lon)>180)goRegion('WORLD',true);else fitBox(Math.min(A.lon,B.lon)-6,Math.max(-55,Math.min(A.lat,B.lat)-6),Math.max(A.lon,B.lon)+6,Math.min(72,Math.max(A.lat,B.lat)+6),true);});},
 shop(){openModal('shop');},
 close(){closeModal();},
 rot(d){const M=UI.modal,p=player();let mr=1;if(M.kind==='route'){const pl=planeOf(p,M.plane),RR={a:M.a,b:M.b,via:M.via||null};mr=pl?Math.max(1,Math.min(rotMax(RR,MX[pl.model]),slotLimit(p,RR))):1;}else{const r=p.routes.find(x=>x.id===M.rid);mr=Math.max(1,Math.min(maxRotRoute(p,r),slotLimit(p,r,r)));}M.rot=clamp(M.rot+(+d.v),1,mr);refreshEst();},
 confirmroute(){const M=UI.modal,p=player();if(!M.plane||!M.b)return;const RR={a:M.a,b:M.b,via:M.via||null},need=slotNeed(p,RR,M.rot).reduce((s,x)=>s+x.cost,0);if(need>p.cash){toast('Trésorerie insuffisante pour acheter les créneaux ('+money(need)+').');return;}
  const nr=openRoute(p,M.a,M.b,M.price,M.rot,[M.plane],M.priceB,M.priceF,M.via||null);if(nr&&M.brand)setBrand(p,nr,M.brand);if(!nr){toast('Aucun créneau disponible sur cette ligne.');return;}news('Ligne '+M.a+(M.via?' · '+M.via:'')+' - '+M.b+' ouverte à '+M.price+' €'+(need?', créneaux achetés pour '+money(need):'')+'.','good');const first=p.routes.length===1;UI.tab='flotte';UI.best=null;closeModal();if(first&&!UI.speed){UI.speed=1;header();}renderAll(true);const pn=$('panel');if(pn)pn.scrollTop=0;},
 applyroute(){const M=UI.modal,p=player(),r=p.routes.find(x=>x.id===M.rid);r.price=M.price;if(M.priceB)r.priceB=M.priceB;if(M.priceF)r.priceF=M.priceF;r.rot=M.rot>r.rot&&slotAps(r).length?Math.max(r.rot,Math.min(M.rot,ensureSlots(p,r,M.rot,r))):M.rot;G.mut=(G.mut||0)+1;if(p.autoHire)staffAuto(p);closeModal();},
 unassign(d){const M=UI.modal,p=player(),r=p.routes.find(x=>x.id===M.rid);unassignPlane(p,r,+d.v);renderModal();},
 assign(){const M=UI.modal,p=player(),r=p.routes.find(x=>x.id===M.rid);assignPlane(p,r,+$('mAdd').value);renderModal();},
 closeroute(){const M=UI.modal,p=player(),r=p.routes.find(x=>x.id===M.rid);closeRoute(p,r);news('Ligne '+r.a+' - '+r.b+' fermée.','info');closeModal();},
 buynew(d){openModal('order',{model:d.v,src:'new',lid:null,qty:1,biz:0,first:0});},
 lease(d){openModal('order',{model:d.v,src:'lease',lid:UI.modal.lid,qty:1,biz:0,first:0});},
 buyused(d){const p=player(),pl=buyUsed(p,+d.v);if(pl){news(MX[pl.model].name+' d\'occasion acheté ('+pl.reg+'), convoyage de 3 jours.','good');UI.tab='flotte';UI.ff='all';closeModal();}},
 regedit(d){openModal('reg',{pid:+d.v,sx:null,nm:null,err:''});},
 savereg(){const M=UI.modal,p=player(),pl=planeOf(p,M.pid);M.sx=$('mRegS').value;M.nm=$('mRegN').value;const e=setReg(p,pl,M.sx,M.nm);if(e){M.err=e;renderModal();return;}closeModal();},
 randreg(){const M=UI.modal,p=player(),R=regRule(p);let r;do r=R.gen();while(regTaken(R.fixed+r));M.sx=r;M.nm=$('mRegN').value;M.err='';renderModal();},
 check(d){const p=player(),pl=planeOf(p,+d.v);if(pl&&!pl.down){startCheck(p,pl);renderAll(true);}},
 dispose(d){const p=player(),pl=planeOf(p,+d.v);if(!pl)return;openModal('confirm',{title:pl.owned?'Vendre cet avion ?':'Rendre cet avion ?',text:plLabel(pl)+(pl.owned?' : tu récupères '+money(planeValue(pl))+'.':' : un mois de loyer de pénalité.')+(pl.route?' Il sera retiré de sa ligne.':''),ok:pl.owned?'Vendre':'Rendre',yes(){dispose(p,pl);for(const r of p.routes.slice())if(!r.planes.length)closeRoute(p,r);}});},
 yes(){const M=UI.modal;if(M&&M.yes)M.yes();closeModal();},
 policy(d){const p=player();if(d.k==='train'&&+d.v>p.train)news('Le budget de formation passe à '+['0','60','150','300'][+d.v]+' € par salarié et par mois.','good','train');p[d.k]=(d.k==='autoMx'||d.k==='autoHire'||d.k==='autoHeavy')?d.v==='1':+d.v;if(d.k==='cRate'||d.k==='ob')G.mut=(G.mut||0)+1;if(d.k==='autoHire'&&p.autoHire)staffAuto(p);renderAll(true);},
 svc(d){player().svc[d.k]=+d.v;renderAll(true);},
 hub(d){const p=player();setHub(p,d.v,!p.hubs.includes(d.v));news(p.hubs.includes(d.v)?APX[d.v].name+' devient un hub de correspondance.':APX[d.v].name+' n\'est plus un hub.','info',p.hubs.includes(d.v)?'hub':null);renderAll(true);},
 hedge(){const p=player(),sh=+(UI.hsh||0.5),du=+(UI.hdur||6);if(buyHedge(p,sh,du))news('Contrat de carburant signé : '+Math.round(sh*100)+' % couverts pendant '+du+' mois à l\'indice '+nf(p.hedge.idx*100)+'.','good','fuelc');renderAll(true);},
 ally(d){const p=player(),al=G.airlines[+d.v],ok=proposeAlly(p,al);if(ok===true)news(al.name+' accepte de rejoindre ton alliance.','good','allyon');else if(ok===false)news(al.name+' refuse ta proposition d\'alliance.','bad');renderAll(true);},
 leaveally(d){const p=player(),al=G.airlines[+d.v];leaveAlly(p,al);al.allyCd=G.day+180;news('Tu quittes l\'alliance avec '+al.name+'.','info','allyoff');renderAll(true);},
 ipo(d){const p=player(),c=sellShares(p,+d.v);if(c)news((p.float<=+d.v+1e-9?'Introduction en bourse : ':'Cession de titres : ')+Math.round(+d.v*100)+' % du capital cédés pour '+money(c)+'.','good','ipo');renderAll(true);},
 buyback(){const p=player(),c=buyBack(p);if(c)news('Rachat de 10 % de tes actions pour '+money(c)+'.','info');renderAll(true);},
 stake(d){const p=player(),al=G.airlines[+d.v],c=buyStake(p,al);if(c)news('Tu prends 10 % de '+al.name+' pour '+money(c)+'.','info');renderAll(true);},
 unstake(d){const p=player(),al=G.airlines[+d.v],c=sellStake(p,al);if(c)news('Tu revends 10 % de '+al.name+' pour '+money(c)+'.','info');renderAll(true);},
 takeover(d){const p=player(),al=G.airlines[+d.v],c=takeoverCost(p,al);openModal('confirm',{title:'Racheter '+al.name+' ?',text:'Coût : '+money(c)+'. Tu récupères '+plur(al.planes.length,'avion')+', '+plur(al.routes.length,'ligne')+' et '+plur(al.bases.length,'base')+', ainsi que sa trésorerie ('+money(al.cash)+') et ses dettes ('+money(al.debt)+'). Les lignes en doublon avec les tiennes sont fermées.',ok:'Racheter',yes(){if(absorb(p,al))news('Tu rachètes '+al.name+' : sa flotte et son réseau rejoignent ta compagnie.','good','takeover');}});},
 lounge(d){const p=player(),i=p.lounges.indexOf(d.v);if(i>=0)p.lounges.splice(i,1);else p.lounges.push(d.v);renderAll(true);},
 camp(d){const p=player(),old=p.camp[d.k]||0;p.camp[d.k]=+d.v;if(+d.v>old)news('Nouvelle campagne publicitaire en '+REGIONS[d.k]+' : '+money(CAMP_COST[+d.v])+' par mois.','good','ad');renderAll(true);},
 sallv(d){player().staff[d.k].lv=+d.v;renderAll(true);},
 hire(d){const p=player();p.autoHire=false;hire(p,d.k,+d.v);if(+d.v>0)news('Recrutement : '+d.v+' '+STAFF[d.k].label.toLowerCase()+' rejoignent la compagnie.','good','hire');renderAll(true);},
 adjust(d){const p=player(),need=updateCap(p);hire(p,d.k,Math.ceil(need[d.k]*1.05)-p.staff[d.k].n);renderAll(true);},
 cabin(d){openModal('cabin',{pid:+d.v,biz:null});},
 setbrand(d){const p=player(),r=p.routes.find(x=>x.id===UI.modal.rid);if(r&&setBrand(p,r,d.v||null)){renderModal();}else toast('Cette marque n\'accepte que des avions de 100 places au plus.');},
 convert(d){const p=player(),pl=planeOf(p,+d.v);openModal('confirm',{title:'Convertir en cargo ?',text:plLabel(pl)+' : '+money(convCost(pl))+', 40 jours au sol. L\'avion perd ses sièges et emporte '+Math.round(MX[pl.model].seats*0.16)+' t de fret. Conversion définitive.',ok:'Convertir',yes(){if(convertCargo(p,pl))news(pl.reg+' part en conversion cargo.','info','delivery');}});},
 newbrand(d){const p=player();openModal('brand',{k:d.v,bname:d.v==='lc'?p.name.split(' ')[0]+' Go':p.name.split(' ')[0]+' Connect',color:d.v==='lc'?'#F28C28':'#1E8C8C'});},
 brandok(){const M=UI.modal,p=player();if(createBrand(p,M.k,(M.bname||'').trim()||BRANDS[M.k].label,M.color)){news('Filiale '+M.bname+' créée.','good','brand');closeModal();UI.tab='gestion';UI.sub='group';renderAll(true);}},
 cs(d){const p=player(),al=G.airlines[+d.v],ok=proposeCS(p,al);news(ok?'Accord de partage de codes signé avec '+al.name+'.':al.name+' décline le partage de codes.',ok?'good':'bad',ok?'allyon':null);renderAll(true);},
 endcs(d){endCS(player(),G.airlines[+d.v]);renderAll(true);},
 rms(){const p=player();if(buyRMS(p))news('Système de revenue management installé.','good','rms');renderAll(true);},
 bmot(d){const M=UI.modal;M.opt=+d.v;M.step='motres';renderModal();},
 bstep(d){UI.modal.step=d.v;renderModal();$('sheet').scrollTop=0;},
 bgsel(d){const M=UI.modal,i=+d.v;M.sel=M.sel||[];if(M.sel.includes(i))M.sel=M.sel.filter(x=>x!==i);else if(M.sel.length<2)M.sel.push(i);renderModal();},
 bgamb(d){const M=UI.modal;M.amb=M.amb||{};M.amb[d.v]=!M.amb[d.v];renderModal();},
 bclose(){const M=UI.modal,p=player(),P=G.board.pending,gs=(M.sel||[]).map(i=>M.amb&&M.amb[i]?P.props[i].a:P.props[i].p);const fired=boardClose(p,M.opt,gs);closeModal();if(fired){UI.endShown=0;}else{news('Séance close. Confiance du conseil : '+G.board.conf+' %.',G.board.conf>=50?'good':'bad');}renderAll(true);},
 buyslot(d){const p=player(),c=d.v,pr=slotPrice(c);if(slotFree(c)<1||p.cash<pr)return;p.cash-=pr;p.m.slots=(p.m.slots||0)+pr;p.slots[c]=(p.slots[c]||0)+1;news('Créneau acheté à '+APX[c].name+' pour '+money(pr)+'.','info');renderAll(true);},
 sellslot(d){const p=player(),v=sellSlot(p,d.v);if(v){news('Créneau revendu à '+APX[d.v].name+' pour '+money(v)+'.','info');renderAll(true);}},
 heavy(d){const p=player(),pl=planeOf(p,+d.v);if(pl&&!pl.down){startHeavy(p,pl,d.k);renderAll(true);}},
 spare(d){const p=player(),pl=planeOf(p,+d.v);if(pl&&!pl.route){pl.spare=!pl.spare;renderAll(true);}},
 cabstep(d){const M=UI.modal,m=MX[M.kind==='order'?M.model:planeOf(player(),M.pid).model];if(d.k==='first'){M.first=clamp(M.first+(+d.v),0,maxFirst(m));M.biz=Math.min(M.biz,maxBiz(m,M.first));}else M.biz=clamp(M.biz+(+d.v),0,maxBiz(m,M.first));renderModal();},
 cabset(d){UI.modal.biz=+d.b;UI.modal.first=+d.f;renderModal();},
 qty(d){UI.modal.qty=clamp(UI.modal.qty+(+d.v),1,10);renderModal();},
 confirmcabin(){const M=UI.modal,p=player(),pl=planeOf(p,M.pid);if(reconfig(p,pl,M.biz,M.first))news(pl.reg+' réaménagé : '+cabinTxt(MX[pl.model],M.biz,M.first)+'.','info');closeModal();},
 confirmorder(){const M=UI.modal,p=player(),L=M.lid,got=acquireBatch(p,M.model,M.src==='lease',M.qty,M.biz,M.first,L);if(got.length){const m=MX[M.model];news(plur(got.length,m.name)+' '+(M.src==='lease'?'loué'+(got.length>1?'s':'')+', livraison dans 7 jours':'commandé'+(got.length>1?'s':'')+', livraison dans '+got[0].down+' jours')+' ('+got.map(x=>x.reg).join(', ')+').','good');UI.tab='flotte';UI.ff='all';closeModal();}},
 loan(d){const p=player(),v=+d.v;if(v>0&&p.debt+v<=creditLimit(p)){p.debt+=v;p.cash+=v;}else if(v<0&&p.debt>=-v&&p.cash>=-v){p.debt+=v;p.cash+=v;}renderAll(true);},
 openbase(d){const p=player();openModal('confirm',{title:'Ouvrir une base à '+APX[d.v].name+' ?',text:'Coût : '+money(CFG.baseCost)+', puis 60 k€ par mois. Tu pourras ouvrir des lignes au départ de cet aéroport.',ok:'Ouvrir la base',yes(){if(openBase(p,d.v))news('Nouvelle base ouverte à '+APX[d.v].name+'.','good','base');}});},
 savegame(){openModal('saves');},
 saves(){openModal('saves');},
 svwrite(d){if(writeSlot(d.v)){toast(d.v==='auto'?'Partie sauvegardée.':'Partie enregistrée dans l\'emplacement '+d.v+'.');}renderModal();},
 svload(d){const go=()=>{const g=readSlot(d.v);if(!g){toast('Cette sauvegarde est illisible.');return;}if(G&&$('start').hidden&&!G.over)save();G=g;UI.recovered=0;closeModal();begin();if(d.v!=='auto')save();toast('Partie chargée : '+player().name+', '+dateStr(G.day)+'.');};
  if(G&&$('start').hidden&&!G.over)openModal('confirm',{title:'Charger cette sauvegarde ?',text:'La partie en cours est d\'abord enregistrée dans la sauvegarde automatique, qui sera ensuite remplacée par la partie chargée. Enregistre-la dans un emplacement si tu veux la garder.',ok:'Charger',yes:go});else go();},
 svdel(d){openModal('confirm',{title:'Effacer l\'emplacement '+d.v+' ?',text:'Cette sauvegarde sera supprimée de ce navigateur.',ok:'Effacer',yes(){lsDel(svK(d.v));lsDel(svM(d.v));setTimeout(()=>openModal('saves'),0);}});},
 svexport(){exportFile();},
 async svcode(){UI.modal.code=await packSave();renderModal();const t=$('svCodeOut');if(t){t.focus();t.select();}},
 async svcopy(){const t=$('svCodeOut');if(!t)return;try{await navigator.clipboard.writeText(t.value);toast('Code copié. Colle-le dans « Coller un code » sur l\'autre appareil.');}catch(e){t.focus();t.select();try{document.execCommand('copy');toast('Code copié.');}catch(_){toast('Copie bloquée par le navigateur : sélectionne le texte et copie-le à la main.');}}},
 svpaste(){UI.modal.paste=1;renderModal();const t=$('svCodeIn');if(t)t.focus();},
 svimport(){const t=$('svCodeIn');if(t&&t.value.trim())importText(t.value);else toast('Colle d\'abord un code de transfert.');},
 quit(){if(G&&!G.over)save();UI.modal=null;$('modal').hidden=true;UI.speed=0;showStart();},
 newgame(){const name=$('inName').value.trim()||'Atlas Aéro';newGame({name,hub:$('inHub').value,diff:+$('inDiff').value,seed:(Date.now()%2147483647)|0});begin();},
 continue(){const s=load();if(s){G=s;begin();if(UI.recovered)toast('Sauvegarde automatique illisible : la copie précédente a été chargée.');}else toast('Aucune partie à reprendre.');}
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el||el.disabled)return;if(el.getAttribute('aria-disabled')==='true'){e.stopPropagation();toast(el.dataset.why||'Action indisponible pour le moment.');return;}const f=ACT[el.dataset.act];if(f)f(el.dataset);});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('[role=button][data-act]'))e.target.click();if(e.key==='Escape'){if(UI.modal&&!['end','board'].includes(UI.modal.kind))closeModal();$('qres').hidden=true;}});

function showStart(){const mt=slotMeta('auto')||slotMeta('auto.prev');$('btnContinue').hidden=!(mt&&!mt.over);$('contInfo').textContent=mt&&!mt.over?'Dernière partie : '+mt.name+', '+dateStr(mt.day)+', enregistrée '+ago(mt.at)+'.':'';$('start').hidden=false;}
function begin(){restoreWorld();_mk.k='';_cx.k='';$('start').hidden=true;UI.sel=null;UI.tab='carte';UI.speed=0;UI.acc=0;UI.hide={};UI.best=null;UI.rf='all';UI.ff='all';UI.endShown=G.over?2:G.won?1:0;UI.view=null;CW=0;resizeMap();renderAll(true);}

// ---- Horloge
let lastT=0,lastSave=0;
function frame(t){const dt=Math.min(0.25,(t-lastT)/1000||0);lastT=t;resizeMap();
 if(UI.anim&&UI.view){const A=UI.anim,u=Math.min(1,(performance.now()-A.t0)/520),e=u<0.5?2*u*u:1-Math.pow(-2*u+2,2)/2,s=A.from.s*Math.pow(A.to.s/A.from.s,e),cxw=A.from.cx+(A.to.cx-A.from.cx)*e,cyw=A.from.cy+(A.to.cy-A.from.cy)*e;
  UI.view.s=s;UI.view.ox=CW/2-cxw*s;UI.view.oy=CH/2-cyw*s;clampView();if(u>=1)UI.anim=null;}
 if(G&&!G.over&&UI.speed&&!UI.modal){UI.acc+=dt*SPEEDS[UI.speed];let n=0;while(UI.acc>=1&&n<4){dayStep();UI.acc-=1;n++;if(G.over)break;}G.frac=UI.acc;
  if(n){renderAll();if(G.day-lastSave>=30||G.day<lastSave){lastSave=G.day;save();}}}
 else if(G&&UI.dirty)renderAll();
 if(G&&!UI.modal&&!G.over&&G.board&&G.board.pending){UI.speed=0;openModal('board',{step:'intro'});}
 if(G&&!UI.modal){if(G.over&&UI.endShown<2){UI.endShown=2;UI.speed=0;save();openModal('end',{win:false});}else if(G.won&&!UI.endShown){UI.endShown=1;openModal('end',{win:true});}}
 if(document.body.dataset.tab==='carte'||innerWidth>=900)drawMap();
 requestAnimationFrame(frame);}

function start(data){$('lede').textContent='Un avion, un capital limité, huit compagnies rivales sur '+AP.length+' villes du monde. Ouvre des lignes, règle tes prix, tes équipages et tes services, et prends '+GOAL+' % du marché mondial avant la faillite.';
 $('inHub').innerHTML=Object.entries(REGIONS).map(r=>'<optgroup label="'+r[1]+'">'+AP.filter(a=>a.reg===r[0]).sort((a,b)=>a.name.localeCompare(b.name,'fr')).map(a=>'<option value="'+a.code+'"'+(a.code==='CMN'?' selected':'')+'>'+esc(a.name)+' ('+a.code+')</option>').join('')+'</optgroup>').join('');
 mapChrome();
 migrateLegacy();
 if(data&&data.G){G=data.G;begin();}else showStart();
 requestAnimationFrame(frame);}
// Sauvegarde dès que la page passe en arrière-plan ou se ferme (onglet, appli mobile)
const bgSave=()=>{if(G&&$('start').hidden&&!G.over)save();};document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')bgSave();});addEventListener('pagehide',bgSave);
try{window.claude&&window.claude.hot&&window.claude.hot.snapshot&&window.claude.hot.snapshot(()=>G?{G}:{});}catch(e){}
if(window.claude&&window.claude.hot&&window.claude.hot.ready)window.claude.hot.ready(start);else start((window.claude&&window.claude.hot&&window.claude.hot.data)||{});
</script>

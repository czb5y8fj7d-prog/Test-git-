<style>
/* Plan : atelier à deux volets, code à gauche, diagramme vivant à droite. Accent teal réservé à la sélection et à l'onglet actif. */
:root {

}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1318; --surface: #151d25; --panel: #1a232c; --code-bg: #111920;
    --ink: #e5eaef; --muted: #91a0af; --line: #28333e; --edge: #93a4b6;
    --accent: #3cc3cf; --accent-soft: #123a3f; --warn: #e0a24a; --err: #ff7a6b; --ok: #58c88f;

  --ink: #e5eaef; --muted: #91a0af; --line: #28333e; --edge: #93a4b6;
  --accent: #3cc3cf; --accent-soft: #123a3f; --warn: #e0a24a; --err: #ff7a6b; --ok: #58c88f;

  --k-attr-f: #242a30; --k-attr-s: #8f99a3; --k-iface-f: #172f3d; --k-iface-s: #62aed8; --k-enum-f: #3a211f; --k-enum-s: #db8c80;

#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }

#cv.placing { cursor: crosshair; }
.empty { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px 32px; text-align: center; color: var(--muted); max-width: 460px; margin: auto; height: fit-content; }

.tag { font: 11px var(--font-mono); background: var(--accent-soft); color: var(--accent); padding: 1px 7px; border-radius: 4px; white-space: nowrap; }
.x { border: 0; background: none; cursor: pointer; color: var(--muted); font-size: 14px; padding: 2px 6px; }
.sr { display: flex; gap: 6px; }
.sr.end { justify-content: flex-end; }
.sec { display: grid; gap: 6px; }
.f { display: grid; grid-template-columns: 84px minmax(0, 1fr); align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
.f input { min-width: 0; padding: 5px 8px; border: 1px solid var(--line); border-radius: 5px; background: var(--code-bg); font-family: var(--font-mono); font-size: 12.5px; }
.lbl { font-size: 11.5px; color: var(--muted); }

.sr.col > span { font-size: 12px; color: var(--muted); }
.sw { width: 20px; height: 20px; padding: 0 !important; border-radius: 50%; border: 2px solid var(--surface) !important; outline: 1px solid var(--line); cursor: pointer; }
.sw.on { outline: 2px solid var(--accent); }
.sr input[type=color] { flex: none; width: 30px; height: 24px; padding: 0; border: 1px solid var(--line); background: none; }
.sr input { flex: 1; min-width: 0; padding: 6px 8px; border: 1px solid var(--line); border-radius: 5px; background: var(--code-bg); font-family: var(--font-mono); font-size: 12.5px; }
.sr button { padding: 5px 10px; border: 1px solid var(--line); background: var(--surface); border-radius: 5px; cursor: pointer; font-size: 12.5px; white-space: nowrap; }
.sr button:hover { background: var(--panel); }

.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--surface); padding: 8px 14px; border-radius: 8px; font-size: 13px; z-index: 50; max-width: calc(100% - 32px); }
.mbar { display: none; }

.tn:hover { background: var(--surface); }

.band { position: absolute; border: 1.5px dashed var(--accent); background: var(--hl); pointer-events: none; z-index: 3; }
.modal { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; background: rgb(8 14 20 / .45); padding: 16px; }
.mcard { width: min(560px, 100%); max-height: calc(100% - 32px); overflow: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px; box-shadow: 0 20px 60px rgb(0 0 0 / .35); display: grid; gap: 12px; }

.gl{display:flex;flex-direction:column;gap:4px;margin:8px 0;font-size:13px}.gl label{display:flex;gap:6px;align-items:center}
.krow { display: grid; grid-template-columns: 1fr auto auto; gap: 8px; align-items: center; font-size: 13px; }
.gl{display:flex;flex-direction:column;gap:4px;margin:8px 0;font-size:13px}.gl label{display:flex;gap:6px;align-items:center}

.muted { color: var(--muted); font-size: 12px; }

<script>
/* ===== Noyau : lecteur / modèle SysML v2 textuel (sous-ensemble) ===== */
const MODS = new Set(['abstract','ref','in','out','inout','private','public','protected','readonly','derived','variation','individual','end','composite','portion','constant','var','ordered','nonunique']);
const KW1 = new Set(['package','verification','part','attribute','port','item','action','state','requirement','constraint','connection','interface','enum','calc','case','occurrence','allocation','actor','subject','objective','stakeholder','concern','view','viewpoint','rendering','metadata','import','alias','satisfy','verify','connect','bind','flow','message','succession','first','then','if','else','transition','accept','entry','exit','do','send','decide','merge','fork','join','perform','exhibit','include','allocate','dependency','snapshot','timeslice','event','assert','assume','require','return','language','expose','filter','assign','while','loop','until','for']);
const KW2 = { 'use case': 'use case', 'analysis case': 'analysis case', 'verification case': 'verification case', 'library package': 'package' };
const CTRL = new Set(['decide', 'merge', 'fork', 'join']);
const NAME_STOP = new Set(['specializes','subsets','redefines','references','connect','of','from','default','ordered','nonunique','typed','conjugates','first','then','def','to']);
const STD = new Set(['Real','Integer','Boolean','String','Natural','Number','Rational','Complex','Positive','Anything','Part','Item','Attribute','Port','Action','State','Requirement','Occurrence','Object','Time','Length','Mass','Force','Energy','Power','Torque','Velocity','Acceleration','Duration','Area','Volume','Quantity','UnlimitedNatural','ISQ','SI']);

function cleanBC(s) {
  return s.split('\n').map(l => l.replace(/^\s*\*+\s?/, '').trim()).filter(Boolean).join(' ').trim();
}

function tokenize(src) {
  const T = [], n = src.length;
  let i = 0;
  const isL = c => /[\p{L}_]/u.test(c), isD = c => c >= '0' && c <= '9';
  while (i < n) {
    const c = src[i];
    if (c === ' ' || c === '\n' || c === '\t' || c === '\r') { i++; continue; }
    if (c === '/' && src[i + 1] === '/') {
      let j = i; while (j < n && src[j] !== '\n') j++;
      T.push({ t: 'lc', v: src.slice(i + 2, j).trim(), s: i, e: j }); i = j; continue;
    }
    if (c === '/' && src[i + 1] === '*') {
      const j = src.indexOf('*/', i + 2), end = j < 0 ? n : j + 2;
      T.push({ t: 'bc', v: cleanBC(src.slice(i + 2, j < 0 ? n : j)), s: i, e: end }); i = end; continue;
    }
    if (c === "'") {
      let j = i + 1; while (j < n && src[j] !== "'" && src[j] !== '\n') { if (src[j] === '\\') j++; j++; }
      T.push({ t: 'id', v: src.slice(i + 1, j), s: i, e: Math.min(j + 1, n), q: true }); i = j + 1; continue;
    }
    if (c === '"') {
      let j = i + 1; while (j < n && src[j] !== '"') { if (src[j] === '\\') j++; j++; }
      T.push({ t: 'str', v: src.slice(i + 1, j), s: i, e: Math.min(j + 1, n) }); i = j + 1; continue;
    }
    if (isL(c)) {
      let j = i + 1; while (j < n && (isL(src[j]) || isD(src[j]))) j++;
      T.push({ t: 'id', v: src.slice(i, j), s: i, e: j }); i = j; continue;
    }
    if (isD(c)) {
      let j = i + 1;
      while (j < n && /[0-9._eE]/.test(src[j])) { if (src[j] === '.' && src[j + 1] === '.') break; j++; }
      T.push({ t: 'num', v: src.slice(i, j), s: i, e: j }); i = j; continue;
    }
    const s3 = src.substr(i, 3), s2 = src.substr(i, 2);
    let v = c;
    if (s3 === ':>>' || s3 === '::>') v = s3;
    else if ([':>', '::', '..', '==', '!=', '<=', '>=', '=>', '**', ':='].includes(s2)) v = s2;
    T.push({ t: 'sym', v, s: i, e: i + v.length }); i += v.length;
  }
  return T;
}

function tokText(t) { return t.t === 'id' ? (t.q ? "'" + t.v + "'" : t.v) : t.t === 'str' ? '"' + t.v + '"' : t.v; }
function joinToks(a) {
  return a.map(tokText).join(' ').replace(/ ?\. ?/g, '.').replace(/ ?:: ?/g, '::').replace(/ ,/g, ',').replace(/\( /g, '(').replace(/ \)/g, ')').trim();
}

/* curseur sur les jetons d'un en-tête */
function P(h) {
  let i = 0;
  const o = {
    get i() { return i; }, set i(v) { i = v; },
    peek(k = 0) { return h[i + k]; },
    eof() { return i >= h.length; },
    isId(v, k = 0) { const t = h[i + k]; return !!t && t.t === 'id' && !t.q && (v === undefined || t.v === v); },
    isSym(v, k = 0) { const t = h[i + k]; return !!t && t.t === 'sym' && (v === undefined || t.v === v); },
    path(allowIndex) {
      let s = '';
      if (o.isSym('~')) { s += '~'; i++; }
      if (!(h[i] && h[i].t === 'id')) return s || null;
      s += h[i].v; i++;
      for (;;) {
        if ((o.isSym('::') || o.isSym('.')) && h[i + 1] && h[i + 1].t === 'id') { s += h[i].v + h[i + 1].v; i += 2; }
        else if (o.isSym('::') && o.isSym('*', 1)) { s += '::*'; i += 2; }
        else if (allowIndex && o.isSym('[')) { while (i < h.length && !o.isSym(']')) i++; i++; }
        else break;
      }
      return s;
    },
    until(stops, symStops) {
      const a = [];
      while (i < h.length) {
        const t = h[i];
        if (t.t === 'id' && !t.q && stops.includes(t.v)) break;
        if (t.t === 'sym' && symStops && symStops.includes(t.v)) break;
        a.push(t); i++;
      }
      return joinToks(a);
    },
    rest() { const a = h.slice(i); i = h.length; return joinToks(a); },
    bracket() {
      i++; const a = [];
      while (i < h.length && !o.isSym(']')) { a.push(h[i]); i++; }
      i++; return joinToks(a);
    }
  };
  return o;
}

function mk(kind, parent, props) {
  return Object.assign({ kind, isDef: false, name: '', short: '', type: null, supers: [], redefs: [], mult: '', value: '', dir: '', mods: [], children: [], doc: '', parent, raw: '', start: 0, end: 0, nameTok: null, bodyClose: null, semi: null, superEnd: null, defEnd: null, supRanges: [], supOp: null, typeOp: null, typeEnd: null, headEnd: 0, hadBody: false, flow: null, ends: null, acts: null, blank: false }, props || {});
}
function fl(n) { return n.flow || (n.flow = { last: null, lastDecide: null, lastDecl: null, edges: [], nodes: [], n: 0 }); }
function addEdge(parent, from, to, label, extra) {
  if (from == null || to == null) return;
  fl(parent).edges.push(Object.assign({ from, to, label: label || '' }, extra || {}));
}

function decl(c, parent, mods, kw, h, src) {
  const n = mk(KW2[kw] || kw, parent, {});
  n.mods = mods.slice(); n.dir = ['in', 'out', 'inout'].find(d => mods.includes(d)) || '';
  n.start = h[0].s; n.raw = src.slice(h[0].s, h[h.length - 1].e).replace(/\s+/g, ' ');
  if (c.isId('def')) { n.isDef = true; c.i++; n.defEnd = h[c.i - 1].e; }
  const short = () => {
    if (c.isSym('<')) {
      c.i++; if (c.peek() && (c.peek().t === 'id' || c.peek().t === 'str')) { n.short = c.peek().v; c.i++; }
      while (!c.eof() && !c.isSym('>')) c.i++; c.i++;
    }
  };
  short();
  if (c.isId('def') && !n.isDef) { n.isDef = true; c.i++; short(); }
  const t = c.peek();
  if (t && t.t === 'id' && !(!t.q && NAME_STOP.has(t.v))) { n.name = t.v; n.nameTok = t; c.i++; }
  short();
  while (!c.eof()) {
    if (c.isSym(':>') || c.isId('specializes') || c.isId('subsets')) {
      if (n.supOp == null) n.supOp = h[c.i].s;
      c.i++; do { const st = h[c.i]; const p = c.path(); if (p) { n.supers.push(p); n.supRanges.push({ s: st.s, e: h[c.i - 1].e }); } n.superEnd = h[c.i - 1].e; } while (c.isSym(',') && (c.i++, true));
    } else if (c.isSym(':>>') || c.isId('redefines')) {
      c.i++; do { const p = c.path(); if (p) n.redefs.push(p); } while (c.isSym(',') && (c.i++, true));
    } else if (c.isSym(':') || (c.isId('typed') && c.isId('by', 1))) {
      n.typeOp = h[c.i].s; c.i += c.isSym(':') ? 1 : 2; n.type = c.path(); n.typeEnd = h[c.i - 1].e;
      while (c.isSym(',')) { c.i++; c.path(); }
    } else if (c.isSym('::>')) { c.i++; c.path(); }
    else if (c.isSym('[')) n.mult = c.bracket();
    else if (c.isId('connect')) {
      c.i++; n.ends = [c.path(true)];
      if (c.isId('to')) { c.i++; n.ends.push(c.path(true)); }
    } else if (c.isSym('=') || c.isSym(':=') || c.isId('default')) { c.i++; n.value = c.rest(); }
    else c.i++;
  }
  return n;
}

function parseFlowLike(kw, c, node) {
  const n = node(kw);
  const p0 = c.peek(), p1 = c.peek(1);
  if (p0 && p0.t === 'id' && !['of', 'from', 'to'].includes(p0.v) && p1 && ((p1.t === 'id' && ['of', 'from'].includes(p1.v)) || (p1.t === 'sym' && p1.v === ':'))) { n.name = p0.v; n.nameTok = p0; c.i++; }
  let a = null, b = null;
  while (!c.eof()) {
    if (c.isId('of')) { c.i++; n.type = c.path(); }
    else if (c.isSym(':')) { c.i++; n.type = c.path(); }
    else if (c.isId('from')) { c.i++; a = c.path(true); }
    else if (c.isId('to')) { c.i++; b = c.path(true); }
    else if (c.peek().t === 'id' && !a) a = c.path(true);
    else c.i++;
  }
  n.ends = [a, b];
  return n;
}

function parseTransition(c, parent, named) {
  const f = fl(parent);
  let name = '', from = null, ev = '', guard = '', eff = '', to = null;
  const STOPS = ['first', 'accept', 'if', 'do', 'then', 'via'];
  if (named && c.peek() && c.peek().t === 'id' && !c.isId() ) { /* nom entre guillemets */ name = c.peek().v; c.i++; }
  else if (named && c.isId() && !STOPS.includes(c.peek().v)) { name = c.peek().v; c.i++; }

    if (c.isId('first')) { c.i++; from = c.path(); }
    else if (c.isId('accept')) { c.i++; ev = c.until(['via', 'if', 'do', 'then'], ['[']); }
    else if (c.isId('if')) { c.i++; guard = c.until(['do', 'then', 'accept']); }
    else if (c.isSym('[')) { guard = c.bracket(); }
    else if (c.isId('do')) { c.i++; eff = c.until(['then']).replace(/^action\s+/, ''); }
    else if (c.isId('send')) { c.i++; eff = 'send ' + c.until(['then']); }
    else if (c.isId('then')) { c.i++; to = c.path(); }
    else if (c.isId('via')) { c.i++; c.path(); }

  if (to != null && from != null) { addEdge(parent, from, to, '', { kind: 'transition', name, event: ev, guard, effect: eff }); }
}

function thenTarget(c, h, parent, src) {
  const nk = c.peek();
  if (nk && nk.t === 'id' && !nk.q && KW1.has(nk.v) && !['then', 'if', 'else', 'first'].includes(nk.v)) {
    if (CTRL.has(nk.v)) {
      const f = fl(parent); c.i++;
      let nm; if (c.peek() && c.peek().t === 'id') { nm = c.peek().v; c.i++; } else nm = nk.v + (++f.n);
      f.nodes.push({ name: nm, kind: nk.v });
      if (nk.v === 'decide') f.lastDecide = nm;
      return { to: nm, decl: null };
    }
    const sub = interpret(h.slice(c.i), parent, src);
    c.i = h.length;
    return { to: sub ? sub.name : null, decl: sub };
  }

}

function interpret(h, parent, src) {
  const c = P(h), mods = [];

    const nx = c.peek(1), two = t0.v + ' ' + (nx && nx.t === 'id' ? nx.v : '');

  }
  const node = kind => { const n = mk(kind, parent, {}); n.mods = mods.slice(); n.start = h[0].s; n.raw = raw(); return n; };
  const f = () => fl(parent);
  switch (kw) {
    case 'import': { const n = node('import'); n.target = c.path(); return n; }
    case 'alias': {
      const n = node('alias');
      if (c.peek() && c.peek().t === 'id') { n.name = c.peek().v; n.nameTok = c.peek(); c.i++; }
      if (c.isId('for')) { c.i++; n.target = c.path(); }

    }
    case 'satisfy': case 'verify': {
      const n = node(kw); if (c.isId('requirement')) c.i++;
      n.req = c.path(); if (c.isId('by')) { c.i++; n.by = c.path(true); }
      return n;
    }
    case 'connect': { const n = node('connect'); n.ends = [c.path(true)]; if (c.isId('to')) { c.i++; n.ends.push(c.path(true)); } return n; }
    case 'bind': { const n = node('bind'); n.ends = [c.path(true)]; if (c.isSym('=')) { c.i++; n.ends.push(c.path(true)); } return n; }
    case 'flow': case 'message': return parseFlowLike(kw, c, node);
    case 'succession': {
      const n = node('succession');
      if (c.peek() && c.peek().t === 'id' && !c.isId('first')) { n.name = c.peek().v; c.i++; }
      if (c.isId('first')) { c.i++; const a = c.path(); if (c.isId('then')) { c.i++; addEdge(parent, a, c.path(), ''); } }
      return n;
    }
    case 'first': {
      const n = node('first'); const a = c.path();
      if (c.isId('then')) { c.i++; const b = c.path(); addEdge(parent, a, b, ''); f().last = b; } else f().last = a;

    }
    case 'then': {
      const fw = f(); const n0 = node('then');
      const r = thenTarget(c, h, parent, src);
      const from = fw.last != null ? fw.last : fw.lastDecl;
      addEdge(parent, from, r.to, '');
      fw.last = r.to;
      if (r.decl) { r.decl.start = h[0].s; r.decl.raw = raw(); return r.decl; }
      return n0;
    }
    case 'if': case 'else': {
      const n0 = node(kw); let g = 'else';
      if (kw === 'if') g = c.until(['then']);
      if (kw === 'if' && c.isId('then')) c.i++;

      const fw = f();
      addEdge(parent, fw.lastDecide != null ? fw.lastDecide : fw.last, r.to, g);
      if (r.decl) { r.decl.start = h[0].s; r.decl.raw = raw(); return r.decl; }

    case 'perform': case 'exhibit': {

      }
      const n = node(kw); n.target = c.path(); return n;
    }
    case 'decide': case 'merge': case 'fork': case 'join': {
      const n = node(kw); const fw = f(); let nm;

    }
    default:
      if (kw) {
        const n = decl(c, parent, mods, kw, h, src);
        if (parent.kind === 'state' && (n.kind === 'state') && n.name) { const fw = f(); fw.last = n.name; fw.lastDecl = n.name; }

      }
      if (t0.t === 'id' || (t0.t === 'sym' && (t0.v === ':>>' || t0.v === ':>'))) {

        if (parent.kind === 'enum' && h.length === 1 && t0.t === 'id') { const n = node('enum'); n.name = t0.v; n.nameTok = t0; return n; }
        if (t0.t === 'sym' || mods.length || (nx && nx.t === 'sym' && [':', ':>', ':>>', '=', '[', ':=', '::>'].includes(nx.v))) return decl(c, parent, mods, 'feature', h, src);
      }
      return null;
  }
}

function parse(src) {
  const toks = tokenize(src), errors = [];
  const root = mk('root', null, {}); root.id = ''; root.qname = '';
  let p = 0;
  const isSym = (t, v) => t && t.t === 'sym' && t.v === v;

  function parseBody(parent) {
    while (p < toks.length) {
      const t = toks[p];
      if (isSym(t, '}')) return t;
      if (isSym(t, ';')) { p++; continue; }
      parseStatement(parent);
    }
    return null;
  }

  function parseStatement(parent) {
    const p0 = p, t0 = toks[p];
    const prevEnd = p0 > 0 ? toks[p0 - 1].e : 0;
    const blank = /\n[ \t]*\n/.test(src.slice(prevEnd, t0.s));
    if (t0.t === 'bc' || t0.t === 'lc') {
      const n = mk('note', parent, { start: t0.s, end: t0.e, raw: src.slice(t0.s, t0.e), blank });
      parent.children.push(n); p++; return;
    }
    if (t0.t === 'id' && !t0.q && (t0.v === 'doc' || t0.v === 'comment')) {
      let q = p + 1;
      while (q < toks.length && toks[q].t !== 'bc' && !(toks[q].t === 'sym' && [';', '{', '}'].includes(toks[q].v))) q++;
      if (q < toks.length && toks[q].t === 'bc') {
        const n = mk('doc', parent, { start: t0.s, end: toks[q].e, raw: src.slice(t0.s, toks[q].e), doc: toks[q].v, blank });
        if (t0.v === 'doc') parent.doc = toks[q].v; else n.kind = 'comment';
        parent.children.push(n); p = q + 1; return;
      }
    }
    const head = []; let depth = 0, term = null;
    while (p < toks.length) {
      const t = toks[p];
      if (t.t === 'lc' || t.t === 'bc') { p++; continue; }
      if (t.t === 'sym') {
        if (t.v === '(' || t.v === '[') depth++;
        else if (t.v === ')' || t.v === ']') depth--;
        else if (depth <= 0 && (t.v === ';' || t.v === '{' || t.v === '}')) { term = t; break; }
      }
      head.push(t); p++;
    }
    let node = null; const fb = parent.flow ? parent.flow.edges.length : 0;
    if (head.length) node = interpret(head, parent, src);
    if (node && parent.flow) for (let i = fb; i < parent.flow.edges.length; i++) if (!parent.flow.edges[i].node) parent.flow.edges[i].node = node;
    if (node && head.length) node.headEnd = head[head.length - 1].e;
    if (term && term.v === '{') {
      const open = term; p++;
      const holder = node || mk('block', parent, {});
      const close = parseBody(holder);
      if (close) { holder.bodyClose = close.s; holder.end = close.e; p++; }
      else { errors.push({ pos: open.s, msg: 'Accolade « { » jamais refermée' }); holder.end = toks.length ? toks[toks.length - 1].e : open.e; }
      holder.hadBody = true;
    } else if (term && term.v === ';') {
      p++; if (node) { node.semi = term.s; node.end = term.e; }
    } else if (node && head.length) node.end = head[head.length - 1].e;
    if (node) { node.blank = blank; if (!node.end) node.end = head[head.length - 1].e; parent.children.push(node); }
  }

  while (p < toks.length) {
    if (isSym(toks[p], '}')) { errors.push({ pos: toks[p].s, msg: 'Accolade « } » en trop' }); p++; continue; }
    if (isSym(toks[p], ';')) { p++; continue; }
    parseStatement(root);
  }
  return { root, errors, toks };
}

/* ---------- modèle indexé ---------- */
function buildModel(src) {
  const { root, errors, toks } = parse(src);
  const M = { src, root, toks, all: [], byId: new Map(), named: new Map(), problems: [] };
  const ls = [0]; for (let i = 0; i < src.length; i++) if (src[i] === '\n') ls.push(i + 1);
  M.lineAt = pos => { let lo = 0, hi = ls.length - 1; while (lo < hi) { const m = (lo + hi + 1) >> 1; if (ls[m] <= pos) lo = m; else hi = m - 1; } return lo + 1; };
  M.lineStart = ln => ls[ln - 1] || 0;
  (function walk(n) {
    const seen = new Map();
    n.children.forEach((c, i) => {
      const base = c.name || (c.kind + '~' + i);
      let id = n.id ? n.id + '/' + base : base;
      const k = seen.get(id) || 0; seen.set(id, k + 1); if (k) id += '#' + (k + 1);
      c.id = id; c.parent = n; c.line = M.lineAt(c.nameTok ? c.nameTok.s : c.start); c.endLine = M.lineAt(Math.max(c.start, c.end - 1));
      M.all.push(c); M.byId.set(id, c);
      if (c.name) { if (!M.named.has(c.name)) M.named.set(c.name, []); const L = M.named.get(c.name); if (c.isDef) L.unshift(c); else L.push(c); }
      walk(c);
    });
  })(root);

  const stripT = p => p ? String(p).replace(/^~/, '') : '';
  M.lastSeg = p => { const s = stripT(p).split(/::|\./).filter(Boolean); return s[s.length - 1] || ''; };
  M.resolveType = (p, scope) => {
    if (!p) return null;
    const segs = stripT(p).split('::').filter(Boolean), last = segs[segs.length - 1];
    const cands = M.named.get(last); if (!cands) return null;
    if (segs.length > 1) { const f = cands.find(c => c.parent && c.parent.name === segs[segs.length - 2]); if (f) return f; }
    let best = null, bs = -1;
    for (const c of cands) {
      let sc = c.isDef ? 10 : 0; const anc = new Set();
      for (let x = c.parent; x; x = x.parent) anc.add(x);
      for (let x = scope; x; x = x.parent) if (anc.has(x)) { sc += x.id ? x.id.split('/').length : 0; break; }
      if (sc > bs) { bs = sc; best = c; }
    }
    return best;
  };
  M.typeDef = n => n.isDef ? n : (n.type ? M.resolveType(n.type, n) : null);
  M.members = (n, seen = new Set()) => {
    if (seen.has(n)) return []; seen.add(n);
    const out = n.children.filter(c => c.name);
    const refs = [];
    if (!n.isDef && n.type) { const t = M.resolveType(n.type, n); if (t) refs.push(t); }
    n.supers.forEach(s => { const t = M.resolveType(s, n); if (t) refs.push(t); });
    refs.forEach(t => M.members(t, seen).forEach(m => { if (!out.some(o => o.name === m.name)) out.push(m); }));
    return out;
  };
  M.chain = (path, scope) => {
    const segs = stripT(path).split(/::|\./).filter(Boolean); if (!segs.length) return null;
    let cur = null;
    for (let x = scope; x && !cur; x = x.parent) cur = M.members(x).find(m => m.name === segs[0]) || null;
    if (!cur) { const c = M.named.get(segs[0]); cur = c ? c[0] : null; }
    for (let i = 1; i < segs.length && cur; i++) cur = M.members(cur).find(m => m.name === segs[i]) || null;
    return cur;
  };
  M.nodeAt = pos => {
    let best = null;
    (function f(n) { for (const c of n.children) { if (c.start <= pos && pos <= c.end) { best = c; f(c); break; } } })(root);
    return best;
  };
  validate(M, errors);
  return M;
}

function validate(M, errors) {
  const Pb = M.problems;
  errors.forEach(e => Pb.push({ line: M.lineAt(e.pos), msg: e.msg, sev: 'err' }));
  const warn = (n, msg) => Pb.push({ line: n.line, msg, sev: 'warn' });
  const checkT = (n, p, what) => {
    if (!p || /::/.test(p)) return;
    const l = M.lastSeg(p); if (STD.has(l)) return;
    if (!M.resolveType(p, n)) warn(n, what + ' « ' + l + ' » introuvable');
  };
  M.all.forEach(n => {
    if (n.type) checkT(n, n.type, 'Type');
    n.supers.forEach(s => checkT(n, s, 'Spécialisation'));
    if ((n.kind === 'satisfy' || n.kind === 'verify')) {
      if (n.req && !M.chain(n.req, n.parent)) warn(n, 'Exigence « ' + n.req + ' » introuvable');
      if (n.by && !M.chain(n.by, n.parent)) warn(n, 'Élément « ' + n.by + ' » introuvable');
    }
    if (n.ends && ['connect', 'connection', 'interface', 'flow', 'bind', 'message'].includes(n.kind)) {
      n.ends.forEach(e => { if (e && !M.chain(e, n.parent)) warn(n, 'Extrémité « ' + e + ' » introuvable'); });
    }
    if (n.flow && (n.kind === 'action' || n.kind === 'state' || n.kind === 'transition')) {
      const names = new Set(n.children.filter(c => c.name).map(c => c.name));
      n.flow.nodes.forEach(x => names.add(x.name));
      ['start', 'done', '@init'].forEach(x => names.add(x));
      n.flow.edges.forEach(e => { [e.from, e.to].forEach(r => { if (r && !names.has(r) && !M.members(n).some(m => m.name === r)) warn(n, 'Étape « ' + r + ' » inconnue dans « ' + (n.name || n.kind) + ' »'); }); });
    }
    const dup = n.parent && n.name && n.parent.children.filter(c => c !== n && c.name === n.name && c.kind === n.kind && c.isDef === n.isDef).length;
    if (dup && n.parent.children.find(c => c.name === n.name && c.kind === n.kind && c.isDef === n.isDef) === n) warn(n, 'Nom « ' + n.name + ' » défini plusieurs fois');
  });
  /* --- contrôles de cohérence avancés --- */
  const info = (n, msg) => Pb.push({ line: n.line, msg, sev: 'info' });
  const isSub = (a, b, seen = new Set()) => { if (!a || !b) return false; if (a === b) return true; if (seen.has(a)) return false; seen.add(a); return a.supers.some(s => { const t = M.resolveType(s, a); return t && isSub(t, b, seen); }); };
  const flip = d => d === 'in' ? 'out' : d === 'out' ? 'in' : d;
  const effDir = p => { const d = p.dir; return p.type && String(p.type).startsWith('~') ? flip(d) : d; };
  const used = new Set();
  M.all.forEach(n => {
    if (!n.ends || n.ends.length !== 2 || !['connect', 'connection', 'interface', 'flow'].includes(n.kind)) return;
    n.ends.forEach(e => { if (e) used.add(n.parent.id + '|' + e.replace(/^\./, '')); });
    const a = n.ends[0] && M.chain(n.ends[0], n.parent), b = n.ends[1] && M.chain(n.ends[1], n.parent);
    if (!a || !b || a.kind !== 'port' || b.kind !== 'port') return;
    const ta = M.typeDef(a), tb = M.typeDef(b);
    if (ta && tb && !isSub(ta, tb) && !isSub(tb, ta) && a.type.replace(/^~/, '') !== b.type.replace(/^~/, '')) warn(n, 'Types de ports incompatibles : « ' + M.lastSeg(a.type) + ' » et « ' + M.lastSeg(b.type) + ' »');
    const own = e => !/[.:]/.test(e.replace(/^\./, ''));
    if (n.kind !== 'flow' && !own(n.ends[0]) && !own(n.ends[1])) {
      const da = effDir(a), db = effDir(b);
      if (da && da === db && da !== 'inout') warn(n, 'Deux ports « ' + da + ' » connectés entre eux (' + n.ends[0] + ' → ' + n.ends[1] + ')');
    }
  });
  M.all.forEach(c => {
    if (c.kind !== 'part' || !c.name || c.isDef || !c.parent || !['part'].includes(c.parent.kind)) return;
    if (!c.parent.children.some(x => ['connect', 'connection', 'interface', 'flow', 'bind'].includes(x.kind))) return;
    M.members(c).filter(m => m.kind === 'port' && m.name).forEach(p => {
      const key = c.parent.id + '|' + c.name + '.' + p.name;
      if (![...used].some(u => u === key || u.startsWith(key + '.'))) info(c, 'Port « ' + c.name + '.' + p.name + ' » non connecté');
    });
  });
  M.all.forEach(n => {
    if (n.kind !== 'verification' || !n.name) return;
    const hasObj = n.children.some(c => c.kind === 'objective' && c.children.some(v => v.kind === 'verify')) || M.all.some(v => v.kind === 'verify' && v.by && M.chain(v.by, v.parent) === n);
    if (!hasObj) info(n, 'Test « ' + n.name + ' » sans exigence vérifiée');
    const sj = n.children.find(c => c.kind === 'subject'), st = sj && sj.type && M.resolveType(sj.type, sj);
    n.children.filter(c => c.kind === 'action').forEach(step => {
      const sg = step.children.find(a => a.name === 'signal'); if (!sg || !st) return;
      const v = String(sg.value).replace(/^\s*"|"\s*$/g, '').trim(); if (!v || /^[eé]tat$/i.test(v)) return;
      if (!M.members(st).some(m => m.kind === 'port' && m.name === v)) warn(sg, 'Signal « ' + v + ' » introuvable dans « ' + st.name + ' »');
    });
  });
  const sat = new Set(), ver = new Set();
  M.all.forEach(n => { if ((n.kind === 'satisfy' || n.kind === 'verify') && n.req) { const r = M.chain(n.req, n.parent); if (r) (n.kind === 'satisfy' ? sat : ver).add(r); } });
  M.all.forEach(n => {
    if (n.kind !== 'requirement' || !n.name) return;
    if (!sat.has(n)) info(n, 'Exigence « ' + n.name + ' » non satisfaite (aucun satisfy)');
    else if (!ver.has(n)) info(n, 'Exigence « ' + n.name + ' » non vérifiée (aucun verify)');
  });
  const shorts = new Map();
  M.all.forEach(n => {
    if (n.short) { if (shorts.has(n.short)) warn(n, 'Identifiant « ' + n.short + ' » déjà utilisé ligne ' + shorts.get(n.short)); else shorts.set(n.short, n.line); }
    if (n.mult) { const m = /^(\d+)\s*\.\.\s*(\d+)$/.exec(n.mult.replace(/\s/g, '')); if (m && +m[1] > +m[2]) warn(n, 'Multiplicité [' + n.mult + '] invalide (borne basse > borne haute)'); }
    if ((n.kind === 'attribute' || n.kind === 'feature') && n.type && n.value) {
      const t = M.lastSeg(n.type), v = n.value.trim();
      if (['Real', 'Integer', 'Natural', 'Positive', 'Number'].includes(t) && /^["']/.test(v)) warn(n, 'Valeur texte pour un attribut « ' + t + ' »');
      else if (['Integer', 'Natural', 'Positive'].includes(t) && /^-?\d+\.\d+/.test(v)) warn(n, 'Valeur décimale pour un attribut « ' + t + ' »');
      else if (t === 'Boolean' && /^(-?\d|["'])/.test(v)) warn(n, 'Valeur non booléenne pour un attribut « Boolean »');
      else if (t === 'String' && /^-?\d/.test(v)) warn(n, 'Valeur numérique pour un attribut « String »');
    }
  });
  Pb.sort((a, b) => a.line - b.line);
}

/* ---------- sérialisation (formatage / JSON) ---------- */
function fmtNode(n, ind) {
  if (n.kind === 'doc' || n.kind === 'comment' || n.kind === 'note') return ind + n.raw;
  let s = ind + n.raw;
  if (n.children.length || n.hadBody) {
    s += ' {\n' + fmtChildren(n.children, ind + '  ') + (n.children.length ? '\n' : '') + ind + '}';
  } else s += ';';
  return s;

/* ---------- Exigences ---------- */

  openModal(mHead('Générer un scénario de test') + '<p class="muted">Système testé : <b>' + esc(sut.name) + '</b>. Choisissez les exigences à vérifier et les signaux de sortie à allouer ; une étape est créée par signal.</p>' +
    '<div class="gl"><b>Exigences vérifiées</b>' + (reqs.map((r, i) => '<label><input type="checkbox" data-g="r" value="' + i + '"' + (defR.includes(r) ? ' checked' : '') + '> ' + esc((r.short ? r.short + ' ' : '') + r.name) + (sat.has(r) ? '' : ' <span class="muted">(non allouée à ce bloc)</span>') + '</label>').join('') || '<span class="muted">Aucune exigence</span>') + '</div>' +
    '<div class="gl"><b>Signaux de sortie</b>' + (sigs.map((p, i) => '<label><input type="checkbox" data-g="s" value="' + i + '"' + (!covered.has(p.name) ? ' checked' : '') + '> ' + esc(p.name) + (p.type ? ' <span class="muted">: ' + esc(shortT(p.type)) + '</span>' : '') + (covered.has(p.name) ? ' <span class="muted">(déjà testé)</span>' : '') + '</label>').join('') || '<span class="muted">Aucun signal de sortie</span>') + '</div>' +
    '<label class="gl"><span><input type="checkbox" data-g="t" checked> Ajouter une étape par transition de la machine à états</span></label>' +
    '<textarea id="g-code" readonly spellcheck="false" rows="12" style="width:100%;font:12px/1.4 \'IBM Plex Mono\',monospace"></textarea><div class="row"><button class="tb" data-m="close">Annuler</button><button class="tb add" data-m="gins">Insérer dans le modèle</button></div>');
  G.reqs = reqs; G.sigs = sigs; genPreview();
}
let G = null;
function genSel() {
  const pick = k => [...$('mcard').querySelectorAll('[data-g="' + k + '"]:checked')].map(x => +x.value);
  return { r: pick('r').map(i => G.reqs[i]), s: pick('s').map(i => G.sigs[i]), t: !!$('mcard').querySelector('[data-g="t"]:checked') };
}
function genPreview() { const g = genSel(); G.out = genTestCode(G.sut, g.r, g.s, g.t); $('g-code').value = G.out.code; }
$('mcard').addEventListener('change', e => { if (e.target.dataset && e.target.dataset.g && G) genPreview(); });
$('mcard').addEventListener('click', e => {
  const b = e.target.closest('[data-m="gins"]'); if (!b || !G) return;
  syncModel(); const o = G.out; if (!o.steps) return toast('Sélectionnez au moins un signal');
  closeModal(); apply(insertInto(topContainer(), o.code), o.name); S.tst.mode = 'plan'; $('tools').dataset.mat = ''; S.needFit = true; render(); toast('Scénario « ' + o.name + ' » ajouté');
});

/* ---------- démarrage ---------- */
(async function boot() {
  let src = SAMPLE;
  try { const v = localStorage.getItem(LSKEY); if (v && v.trim()) src = v; } catch (e) { /* ignoré */ }
  S.showProbs = false;
  try { loadPres(JSON.parse(localStorage.getItem(LSKEY + '-pres'))); S.libId = localStorage.getItem(LSKEY + '-lib') || null; } catch (e) { /* ignoré */ }
  toggleView('none');
  setSource(src); setPane(matchMedia('(max-width:860px)').matches ? 'view' : 'both');
  refresh();
  requestAnimationFrame(() => { S.needFit = true; render(); });
  try { DL = window.claude && window.claude.use ? await window.claude.use('downloads') : null; } catch (e) { DL = null; }
  $('mExp').querySelectorAll('[data-x]:not([data-x=copy])').forEach(b => { b.disabled = !DL; });
  $('dlNote').hidden = !!DL;
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { S.needFit = true; render(); });
})();

</script>

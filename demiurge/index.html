<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Démiurge</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;700&display=swap">
<style>
/* Concept : jeu 16 bits en plein jour. Papier chaud, contours prune, accents francs ; version nuit disponible dans le menu.
   Carte plein cadre, HUD en haut, dock d'outils en bas, tiroir pour la chronique. */
:root{color-scheme:light;--ink:#3b2f4a;--panel:#fbeed6;--panel-hi:#f3d9b0;--panel-lo:#e2c28f;--paper:#fff7e8;--fg:#3b2f4a;--mute:#6b5a7d;--amber:#b8650a;--gold:#ffc94d;--blue:#2a62c9;--cyan:#17829a;--orange:#c4521f;--lime:#2a8750;--purple:#8a47c4;--bevel-hi:rgba(255,255,255,.75);--bevel-lo:rgba(150,100,50,.28);--tsh:none;--sea:#265caa;--f:'Pixelify Sans',ui-monospace,Menlo,Consolas,monospace}
:root.night{color-scheme:dark;--ink:#1a1c2c;--panel:#333c57;--panel-hi:#566c86;--panel-lo:#29314a;--paper:#232840;--fg:#f4f4f4;--mute:#94b0c2;--amber:#ffcd75;--gold:#ffcd75;--blue:#41a6f6;--cyan:#73eff7;--orange:#ef7d57;--lime:#a7f070;--purple:#b45cf0;--bevel-hi:rgba(255,255,255,.16);--bevel-lo:rgba(0,0,0,.35);--tsh:2px 2px 0 #1a1c2c}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--panel);color:var(--fg);font:400 15px/1.4 var(--f);overflow:hidden;overscroll-behavior:none}
button,input,output{font-family:var(--f)}
b{font-weight:700}
.game{height:100%;display:flex}
.col{flex:1;min-width:0;height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto}

/* ---------- boutons à coins crantés ---------- */
button{color:var(--fg);background:var(--panel);border:0;font-size:15px;line-height:1.1;padding:6px 10px;min-height:40px;margin:4px;cursor:pointer;touch-action:manipulation;text-shadow:var(--tsh);
 box-shadow:-4px 0 0 0 var(--ink),4px 0 0 0 var(--ink),0 -4px 0 0 var(--ink),0 4px 0 0 var(--ink),inset 0 -4px 0 0 var(--bevel-lo),inset 0 4px 0 0 var(--bevel-hi)}
button:hover{background:var(--panel-hi)}
button:active{transform:translateY(2px);box-shadow:-4px 0 0 0 var(--ink),4px 0 0 0 var(--ink),0 -4px 0 0 var(--ink),0 4px 0 0 var(--ink),inset 0 4px 0 0 var(--bevel-lo)}
button.on{background:var(--gold);color:#3b2f4a;text-shadow:none}
button:focus-visible,input:focus-visible,canvas:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
.px{background:var(--panel);box-shadow:-4px 0 0 0 var(--ink),4px 0 0 0 var(--ink),0 -4px 0 0 var(--ink),0 4px 0 0 var(--ink),inset 0 -4px 0 0 var(--bevel-lo),inset 0 4px 0 0 var(--bevel-hi)}
.ico{width:36px;height:36px;image-rendering:pixelated;display:block;flex:0 0 auto}

/* ---------- HUD ---------- */
.hud{display:flex;align-items:center;gap:6px;padding:4px max(16px,env(safe-area-inset-right,0px)) 4px max(16px,env(safe-area-inset-left,0px));background:var(--panel);border-bottom:4px solid var(--ink);box-shadow:inset 0 -4px 0 var(--bevel-lo)}
.hud button{min-height:44px}
#menuBtn{min-width:48px;padding:4px}
#menuBtn .ico{width:30px;height:30px}
.plate{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.05;padding:0 6px;text-shadow:var(--tsh)}
.plate b{font-size:20px;color:var(--amber);letter-spacing:.04em;font-variant-numeric:tabular-nums;white-space:nowrap}
.plate span{font-size:13px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.speed{display:flex}
.speed button{min-width:40px;padding:4px 6px;font-size:14px}

/* ---------- carte ---------- */
.map{position:relative;min-height:0;background:var(--sea);overflow:hidden}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated;touch-action:none;cursor:crosshair}
.topov{position:absolute;top:10px;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:6px;pointer-events:none;align-items:flex-start}
.topov>*{pointer-events:auto;max-width:100%}
.strip{display:flex;overflow-x:auto;scrollbar-width:none;padding:4px 6px 4px 4px}
.strip::-webkit-scrollbar{display:none}
.strip button{flex:0 0 auto;min-height:34px;padding:4px 9px;font-size:13px;margin:4px 3px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:3px 4px;pointer-events:none}
.chips::-webkit-scrollbar{display:none}
.chips:empty{display:none}
.chip{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--fg);background:var(--paper);padding:2px 8px;box-shadow:-2px 0 0 0 var(--ink),2px 0 0 0 var(--ink),0 -2px 0 0 var(--ink),0 2px 0 0 var(--ink);white-space:nowrap}
.chip.bad{color:var(--orange)}.chip.ice{color:var(--cyan)}
.sw{display:inline-block;width:10px;height:10px;flex:0 0 auto;box-shadow:0 0 0 2px var(--ink)}
.ramp{width:120px;height:10px;background:linear-gradient(90deg,#6b5a7d,#c23b2e,#ffd34d);box-shadow:0 0 0 2px var(--ink)}
.toast{padding:8px 12px;font-size:14px;max-width:min(100%,440px);background:var(--paper);color:var(--fg);box-shadow:-4px 0 0 0 var(--ink),4px 0 0 0 var(--ink),0 -4px 0 0 var(--ink),0 4px 0 0 var(--ink);margin:4px;overflow-wrap:anywhere}
.toast b{text-transform:uppercase;letter-spacing:.06em;font-size:12px;margin-right:6px}
.k-guerre{color:var(--orange)}.k-politique{color:var(--blue)}.k-nature{color:var(--lime)}.k-culture{color:var(--purple)}.k-heros{color:var(--amber)}.k-eco{color:var(--mute)}
.zoom{position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:14px;display:flex;flex-direction:column}
.zoom button{min-width:46px;min-height:46px;padding:4px;font-size:18px;font-weight:700}
.zoom button.t{font-size:12px}
.inspect{position:absolute;left:max(16px,env(safe-area-inset-left,0px));bottom:14px;max-width:min(300px,calc(100% - 110px));padding:10px 12px;font-size:14px;line-height:1.35;margin:4px;display:flex;gap:8px;align-items:flex-start}
.inspect .tx{min-width:0;overflow-wrap:anywhere}
.inspect .x{min-width:30px;min-height:30px;padding:0;margin:0 0 0 auto;flex:0 0 auto}
.hint{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);max-width:min(78%,320px);text-align:center;padding:12px 14px;pointer-events:none;animation:blink 1.6s steps(2) infinite}
@keyframes blink{50%{opacity:.78}}
.mute{color:var(--mute)}

/* ---------- dock ---------- */
.dock{background:var(--panel);border-top:4px solid var(--ink);box-shadow:inset 0 4px 0 var(--bevel-hi);padding:6px max(16px,env(safe-area-inset-right,0px)) 4px max(16px,env(safe-area-inset-left,0px));display:grid;gap:2px}
.tline{display:flex;align-items:center;gap:10px;min-height:44px;padding:0 4px}
.tinfo{flex:1;min-width:0;font-size:13px;line-height:1.25;color:var(--mute);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tinfo b{color:var(--amber);font-size:15px;margin-right:6px}
.brush{display:flex;align-items:center;gap:8px;flex:0 0 auto;font-size:13px;color:var(--mute)}
.brush output{width:1.2em;text-align:right;color:var(--fg);font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;width:110px;height:24px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:12px;background:var(--panel-lo);box-shadow:0 0 0 2px var(--ink)}
input[type=range]::-moz-range-track{height:12px;background:var(--panel-lo);box-shadow:0 0 0 2px var(--ink)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:24px;margin-top:-6px;background:var(--gold);border:0;border-radius:0;box-shadow:0 0 0 2px var(--ink)}
input[type=range]::-moz-range-thumb{width:16px;height:24px;background:var(--gold);border:0;border-radius:0;box-shadow:0 0 0 2px var(--ink)}
.tray{display:flex;gap:6px;overflow-x:auto;padding:6px 4px;scrollbar-width:thin;scrollbar-color:var(--panel-lo) var(--panel)}
.tool,.cat{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.tool{flex:0 0 auto;min-width:70px;min-height:68px;padding:6px 4px 4px}
.tool span,.cat span{font-size:12px;line-height:1}
.cats{display:flex}
.cat{flex:1;min-width:0;min-height:58px;padding:4px 2px}
.cat .ico{width:30px;height:30px}

/* ---------- tiroir ---------- */
.sheet{display:none;flex-direction:column;background:var(--panel);min-height:0;z-index:30;border-left:4px solid var(--ink)}
body.open .sheet{display:flex}
.sheet-top{display:flex;align-items:center;gap:4px;padding:6px 8px 2px max(12px,env(safe-area-inset-left,0px));border-bottom:4px solid var(--ink);background:var(--panel)}
.ptabs{flex:1;display:flex;overflow-x:auto;scrollbar-width:none;min-width:0;padding:2px}
.ptabs::-webkit-scrollbar{display:none}
.ptabs button{flex:0 0 auto;min-height:38px;padding:4px 10px;font-size:14px}
.sheet-top .close{min-width:40px;min-height:38px;padding:0}
.pbody{flex:1;min-height:0;overflow:auto;padding:12px max(16px,env(safe-area-inset-right,0px)) 24px 16px;background:var(--paper);scrollbar-width:thin;scrollbar-color:var(--panel-lo) var(--paper);overscroll-behavior:contain}
.pbody h3{margin:16px 0 8px;font-size:17px;font-weight:700;color:var(--amber);letter-spacing:.04em}
.pbody h3:first-child{margin-top:0}
.filters{display:flex;flex-wrap:wrap;gap:0 2px;margin:0 0 6px -4px}
.filters button{min-height:34px;padding:3px 9px;font-size:13px}
.log{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.log li{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;padding-bottom:8px;border-bottom:2px dashed var(--panel-lo)}
.yr{font-size:12px;color:var(--mute);white-space:nowrap;grid-row:span 2;font-variant-numeric:tabular-nums;line-height:1.2}
.kd{font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:700}
.log .tx{min-width:0;overflow-wrap:anywhere}
.kr{display:flex;gap:10px;padding:10px 0;border-bottom:2px dashed var(--panel-lo)}
.kr .sw{width:14px;height:14px;margin-top:4px}
.kmain{min-width:0;display:grid;gap:2px}
.kmeta{font-size:13px;color:var(--mute);font-variant-numeric:tabular-nums}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.pill{font-size:12px;padding:1px 7px;background:var(--panel);box-shadow:0 0 0 2px var(--ink)}
.pill.bad{color:var(--orange)}.pill.ice{color:var(--cyan)}
.bars{display:grid;gap:8px}
.bar{display:grid;grid-template-columns:minmax(70px,.55fr) 1fr auto;gap:8px;align-items:center;font-size:14px}
.bar i{display:block;height:12px;background:var(--c,var(--blue));box-shadow:inset 0 -4px 0 rgba(0,0,0,.2),0 0 0 2px var(--ink);min-width:4px}
.bar span:last-child{font-variant-numeric:tabular-nums;color:var(--mute)}
.kv{display:grid;grid-template-columns:1fr auto;gap:3px 12px;font-size:14px}
.kv span:nth-child(even){text-align:right;font-variant-numeric:tabular-nums;color:var(--mute)}
.hr{display:grid;gap:4px;padding:10px 0;border-bottom:2px dashed var(--panel-lo)}
.hr .row,.row{display:flex;flex-wrap:wrap;gap:0 4px;margin-left:-4px}
.hr button{min-height:34px;padding:3px 9px;font-size:13px}
.guide p,.guide li{margin:0 0 6px;max-width:62ch}
.guide ul{padding-left:18px;margin:0 0 8px}

/* ---------- adaptations ---------- */
@media(max-width:899px){
 .sheet{position:fixed;left:0;right:0;bottom:0;height:66%;border-left:0;border-top:4px solid var(--ink);box-shadow:0 -8px 0 rgba(59,47,74,.25);padding-bottom:env(safe-area-inset-bottom,0px)}
}
@media(min-width:900px){
 .sheet{flex:0 0 400px;width:400px}
 .ico{width:40px;height:40px}
 .tool{min-width:78px}
}
@media(max-width:420px){.brush input{width:84px}.tool{min-width:64px}.tool .ico{width:32px;height:32px}}
@media(prefers-reduced-motion:reduce){.hint{animation:none}}
.log li.go{cursor:pointer}.log li.go:hover{background:var(--panel)}.log li.go .tx::after{content:' ›';color:var(--amber);font-weight:700}
.slot{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:2px dashed var(--panel-lo);flex-wrap:wrap}
.goal{display:grid;gap:4px;padding:10px 0;border-bottom:2px dashed var(--panel-lo)}.goal.done b{color:var(--lime)}
.inp{font:inherit;color:var(--fg);background:var(--paper);border:0;padding:6px 10px;min-height:40px;width:9em;margin:4px;box-shadow:-3px 0 0 var(--ink),3px 0 0 var(--ink),0 -3px 0 var(--ink),0 3px 0 var(--ink)}
button:disabled{opacity:.45;cursor:default}
.ibtns{display:flex;flex-direction:column;gap:6px;margin-left:auto}.ibtns .x{margin:0}
.inspect{max-height:50vh;overflow:auto}
.zoom{align-items:flex-end}
.mini{position:absolute;top:auto;left:auto;inset:auto max(20px,env(safe-area-inset-right,0px)) 240px auto;right:max(20px,env(safe-area-inset-right,0px));bottom:240px;display:block;width:112px;height:70px;margin:0;background:var(--sea);box-shadow:-3px 0 0 var(--ink),3px 0 0 var(--ink),0 -3px 0 var(--ink),0 3px 0 var(--ink);image-rendering:pixelated;touch-action:none;cursor:pointer}
.foi{font-size:18px;color:var(--amber);padding:4px 0}
.wbar{height:12px;background:var(--b);box-shadow:0 0 0 2px var(--ink);position:relative;margin:4px 2px}.wbar i{display:block;height:100%;background:var(--a)}.wbar::after{content:'';position:absolute;left:50%;top:-3px;bottom:-3px;width:2px;background:var(--ink)}
#newBtn .sm{display:none}
select.inp{width:100%;max-width:100%;min-height:44px;margin:4px}
@media(max-width:700px){#newBtn{display:none}}
.chart{width:100%;height:auto;display:block;background:var(--paper);box-shadow:0 0 0 2px var(--ink);margin:4px 0 8px}
.sheet h4{margin:10px 0 2px;font-size:13px;color:var(--mute);font-weight:700}
.dlg{position:fixed;inset:0;z-index:80;background:rgba(59,47,74,.55);display:flex;align-items:center;justify-content:center;padding:16px}
.dlgbox{background:var(--panel);box-shadow:-4px 0 0 var(--ink),4px 0 0 var(--ink),0 -4px 0 var(--ink),0 4px 0 var(--ink);padding:16px;max-width:460px;width:100%;max-height:92vh;overflow:auto}
.dlgbox h2{margin:0 0 6px;font-size:22px}.dlgbox h3{margin:12px 0 4px;font-size:15px}
.scn{display:grid;gap:8px;margin:10px 4px}
.scn button{display:flex;flex-direction:column;align-items:flex-start;text-align:left;margin:4px;gap:2px}
.scn button span{font-size:13px;color:inherit;opacity:.85}
.dlgfoot{margin-top:14px;justify-content:flex-end}
</style>
<div class="game">
 <div class="col">
  <header class="hud">
   <button id="menuBtn" aria-label="Ouvrir le menu et la chronique"><img class="ico" id="menuIco" alt=""></button>
   <div class="plate" id="clock"></div>
   <button id="newBtn" aria-label="Nouvelle partie" title="Nouvelle partie"><span class="lg">Nouvelle partie</span><span class="sm">+</span></button>
   <div class="speed" id="speed" role="group" aria-label="Vitesse du temps"><button data-s="0" aria-label="Pause">II</button><button data-s="1" class="on">1×</button><button data-s="2">2×</button><button data-s="5">5×</button></div>
  </header>
  <main class="map" id="map">

   </div>
   <canvas id="mini" class="mini" width="112" height="70" aria-label="Mini-carte : touche pour te déplacer"></canvas>

  </div>
  <div class="pbody" id="pbody"></div>
 </aside>

<script>
'use strict';
/* ===== Démiurge : données, monde, état ===== */
const W=192,H=120,S=4,N=W*H;
const T={DEEP:0,SEA:1,SAND:2,GRASS:3,FOREST:4,HILL:5,MOUNT:6,SNOW:7,LAVA:8,ASH:9};
const TCOL=[[38,92,170],[72,160,222],[240,220,156],[128,198,92],[58,150,84],[196,164,98],[150,142,160],[250,252,255],[246,98,38],[112,100,112]];
const RESCOL=[null,[250,230,90],[130,76,34],[176,176,200],[255,196,30],[90,200,255]];
const RESNAME=['—','Terres fertiles','Bois','Minerai','Or','Poisson'];
const R=Math.random;
const rint=(a,b)=>a+Math.floor(R()*(b-a+1));
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const pick=a=>a[Math.floor(R()*a.length)];
const inb=(x,y)=>x>=0&&y>=0&&x<W&&y<H;
let seedv=1;
function srand(s){seedv=(s>>>0)||1}
function rnd(){let x=seedv;x^=x<<13;x^=x>>>17;x^=x<<5;seedv=x>>>0;return seedv/4294967296}
function hash(ix,iy,s){let h=(Math.imul(ix,374761393)+Math.imul(iy,668265263)+Math.imul(s,1274126177))|0;h=Math.imul(h^(h>>>13),1274126177);h^=h>>>16;return (h>>>0)/4294967296}
function vnoise(x,y,s){const ix=Math.floor(x),iy=Math.floor(y),fx=x-ix,fy=y-iy;const u=fx*fx*(3-2*fx),v=fy*fy*(3-2*fy);const a=hash(ix,iy,s),b=hash(ix+1,iy,s),c=hash(ix,iy+1,s),d=hash(ix+1,iy+1,s);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v}
function fbm(x,y,s){let v=0,a=.5,f=1,t=0;for(let i=0;i<5;i++){v+=a*vnoise(x*f,y*f,s+i*17);t+=a;a*=.5;f*=2}return v/t}
function hsl(h,s,l){s/=100;l/=100;const k=n=>(n+h/30)%12,a=s*Math.min(l,1-l),f=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));return[Math.round(255*f(0)),Math.round(255*f(8)),Math.round(255*f(4))]}
const hex=c=>'#'+c.map(v=>clamp(v,0,255).toString(16).padStart(2,'0')).join('');
const esc=s=>String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));

const RACES=[
 {n:'Humains',s:'Humain',c:'#f0d2a8',hp:10,sp:1,lf:[3,2],kn:['Royaume','Empire','Marche','Duché']},
 {n:'Elfes',s:'Elfe',c:'#a9f0b0',hp:9,sp:1,lf:[4],kn:['Sylve','Concile','Havre']},
 {n:'Orques',s:'Orque',c:'#78c24f',hp:14,sp:1.2,lf:[5,3],kn:['Horde','Clan','Griffe']},

function civilWar(K){
 if(K.cl.length<2)return;
 const c=K.cl.slice().sort((a,b)=>a.pop-b.pop).find(q=>q!==K.cap);if(!c)return;
 const K2=newKingdom(K.r);if(!K2)return;
 K2.faith=K.faith;K2.lv=K.lv;K2.tp=K.tp*.8;
 c.k=K2.id;K2.cl=[c];K2.cities=1;K2.cap=c;
 for(const d of G.creatures)if(!d.dead&&d.k===K.id&&Math.hypot(d.x-c.x,d.y-c.y)<7)d.k=K2.id;
 const r=rel(K.id,K2.id);r.s='w';r.v=-70;recountWars();
 log(`Guerre civile : ${c.name} fait sécession de ${K.name} et fonde ${K2.name}.`,'politique');
 territory();
}
function kingdomTick(t){
 for(const K of G.kingdoms){
  if(!K.alive)continue;
  if(K.cities===0){collapse(K);continue}
  K.tp+=K.pop*.012*(1+.5*K.hs)*(K.res[3]+K.res[4]>0?1.1:1);
  K.gold+=K.pop*.04+K.routeN*.5;
  if(K.gold>60){K.gold-=40;K.tp+=8}
  if(K.vas>=0){const V=G.kingdoms[K.vas];if(V&&V.alive){const tr=K.pop*.01;K.gold-=tr;V.gold+=tr}}
  if(K.gold<0)K.gold=0;
  let l=0;while(l<4&&K.tp>=TTH[l+1])l++;
  if(l>=2&&K.res[3]+K.res[4]===0)l=Math.min(l,1);
  if(l>K.lv){K.lv=l;log(`${K.name} entre dans l’${TECH[l]}.`,'culture')}
  if(K.heroes<2&&K.pop>=8&&R()<.03)promote(K);
  if(t>=K.rulerEnd){
   const old=K.ruler;K.ruler=nameFor(K.r);K.rulerEnd=t+rint(5000,9000);
   log(`Mort du souverain ${old} : ${K.ruler} monte sur le trône de ${K.name}.`,'politique');
   if(K.cl.length>=2&&R()<.12)civilWar(K);
   succession(K);
  }
  if(K.vas>=0&&R()<.004){const V=G.kingdoms[K.vas];if(V&&V.alive){K.vas=-1;declareWar(K.id,V.id,'révolte');}}
 }
}
function territory(){
 const g=G;g.owner.fill(-1);g.odist.fill(1e9);
 for(const c of g.cities){
  const K=g.kingdoms[c.k],Rr=4+c.lvl*2+(K.cap===c?1:0);
  for(let dy=-Rr;dy<=Rr;dy++)for(let dx=-Rr;dx<=Rr;dx++){
   const x=c.x+dx,y=c.y+dy;if(!inb(x,y))continue;const d=Math.hypot(dx,dy);if(d>Rr)continue;
   const i=y*W+x;if(g.ter[i]<=T.SEA)continue;
   if(d<g.odist[i]){g.odist[i]=d;g.owner[i]=c.k}
  }
 }
 for(const K of g.kingdoms){K.res=[0,0,0,0,0,0];K.adj={}}
 for(let y=0;y<H;y++)for(let x=0;x<W;x++){
  const i=y*W+x,o=g.owner[i];if(o<0)continue;
  g.kingdoms[o].res[g.res[i]]++;
  if(x+1<W){const p=g.owner[i+1];if(p>=0&&p!==o){const A=g.kingdoms[o],B=g.kingdoms[p];A.adj[p]=(A.adj[p]||0)+1;B.adj[o]=(B.adj[o]||0)+1}}
  if(y+1<H){const p=g.owner[i+W];if(p>=0&&p!==o){const A=g.kingdoms[o],B=g.kingdoms[p];A.adj[p]=(A.adj[p]||0)+1;B.adj[o]=(B.adj[o]||0)+1}}
 }
 g.dirtyT=true;
}
/* ===== Simulation : diplomatie, religion, commerce, climat, faune, pouvoirs ===== */
const fn=id=>G.faiths[id]?G.faiths[id].name:'?';
function declareWar(a,b,why){
 const A=G.kingdoms[a],B=G.kingdoms[b];if(!A||!B||!A.alive||!B.alive)return;
 const r=rel(a,b);if(r.s==='w')return;
 if(!['trahison','révolte','discorde','succession'].includes(why)&&(r.truce>G.t||r.pact>G.t))return;
 if(r.pact>G.t){A.rep=Math.max(0,repOf(A)-20);r.pact=0;log(`${A.name} foule aux pieds son pacte de non-agression avec ${B.name}.`,'politique')}
 if(why==='trahison')A.rep=Math.max(0,repOf(A)-25);
 const had=G.routes.filter(q=>(q.ka===a&&q.kb===b)||(q.ka===b&&q.kb===a)).length;
 const allies=[];
 for(const key in G.rel){const q=G.rel[key];if(q.s!=='a')continue;const n=Number(key),x=Math.floor(n/512),y=n%512;const o=x===b?y:y===b?x:-1;if(o>=0&&o!==a)allies.push(o)}
 r.s='w';r.v=-80;G.stats.wars++;recountWars();openWar(a,b,why);
 const txt={trahison:`Trahison ! ${A.name} brise son alliance et attaque ${B.name}.`,'révolte':`${A.name} se révolte contre son suzerain ${B.name}.`,sainte:`Guerre sainte : ${A.name} part en croisade contre ${B.name} au nom de ${fn(A.faith)}.`,alliance:`${A.name} rejoint la guerre contre ${B.name} pour honorer une alliance.`,'frontière':`${A.name} déclare la guerre à ${B.name} (querelles de frontière).`};
 Object.assign(txt,{ultimatum:`${A.name} part en guerre après le refus de son ultimatum par ${B.name}.`,discorde:`La discorde divine dresse ${A.name} contre ${B.name}.`,succession:`${A.name} fait valoir ses droits dynastiques et attaque ${B.name}.`,vengeance:`${A.name} se venge de ${B.name} : la rancune a fini par l’emporter.`});
 log(txt[why]||txt['frontière'],'guerre');
 trade();
 if(had>0)log(`Blocus : les routes marchandes entre ${A.name} et ${B.name} sont coupées.`,'eco');
 for(const o of allies){const O=G.kingdoms[o];if(O&&O.alive&&R()<(rel(o,b).mar?.8:.55)&&rel(o,a).s!=='w'&&O.vas!==a&&A.vas!==o){O.rep=Math.min(100,repOf(O)+4);declareWar(o,a,'alliance')}}
}
function makePeace(a,b,why){
 const r=rel(a,b);if(r.s!=='w')return;closeWarRec(a,b,why);r.s='p';r.v=-10;recountWars();
 log(`Paix signée entre ${nm(a)} et ${nm(b)}${why?' ('+why+')':''}.`,'politique');trade();
}
function makeAlliance(A,B){
 const r=rel(A.id,B.id);r.s='a';
 log(`Alliance scellée entre ${A.name} et ${B.name}.`,'politique');
}
function vassalize(big,small){
 if(small.vas>=0||big.vas===small.id)return;
 const r=rel(big.id,small.id);r.s='p';r.v=15;small.vas=big.id;recountWars();
 log(`${small.name} plie le genou et devient vassal de ${big.name}.`,'politique');
}
function captureNearest(big,small){
 if(!big.cap||!small.cl.length)return;
 let best=null,bd=1e9;for(const c of small.cl){const d=Math.hypot(c.x-big.cap.x,c.y-big.cap.y);if(d<bd){bd=d;best=c}}
 if(!best||best===small.cap&&small.cl.length===1)return;
 best.k=big.id;addScore(big.id,small.id,25);
 for(const d of G.creatures)if(!d.dead&&d.k===small.id&&Math.hypot(d.x-best.x,d.y-best.y)<6){if(R()<.6)d.k=big.id;else{d.dead=1;G.stats.deaths++}}
 log(`${big.name} s’empare de ${best.name} au terme d’une campagne victorieuse contre ${small.name}.`,'guerre');
 territory();
}
function setTgt(A,B){
 if(!A.cap||!B.cl.length)return;
 let best=null,bd=1e9;for(const c of B.cl){const d=Math.hypot(c.x-A.cap.x,c.y-A.cap.y);if(d<bd){bd=d;best=c}}
 if(best&&bd<A.tgtd){A.tgt={x:best.x,y:best.y};A.tgtd=bd}
}
function diplomacy(){
 const ks=G.kingdoms.filter(k=>k.alive);
 const tp=new Set();for(const q of G.routes)tp.add(rk(q.ka,q.kb));
 for(let i=0;i<ks.length;i++)for(let j=i+1;j<ks.length;j++){
  const A=ks[i],B=ks[j],border=A.adj[B.id]||0,key=rk(A.id,B.id),ex=G.rel[key];
  if(!border&&!ex)continue;
  const r=ex||rel(A.id,B.id);
  const vass=A.vas===B.id||B.vas===A.id;
  let d=rint(-5,5)+(A.faith===B.faith?3:-3);
  if(border)d-=Math.min(3,Math.floor(border/20));
  if(tp.has(key))d+=3;
  if(A.hc||B.hc)d-=2;
  if(r.s==='a')d+=2;
  d+=opExtra(A,B,r);
  if(vass)d=Math.max(d,2);
  r.v=clamp(r.v+d,-100,100);
  if((A.hr||B.hr)&&border&&r.s!=='w'&&R()<.025){
   const spy=A.hr?A:B,oth=spy===A?B:A;
   if(oth.tp>spy.tp){spy.tp+=(oth.tp-spy.tp)*.15;log(`Les espions de ${spy.name} dérobent des secrets à ${oth.name}.`,'culture')}
   r.v=clamp(r.v-10,-100,100);
  }
  if(r.s==='p'){
   if(peaceDeals(A,B,r,border,vass)){}
   else if(!vass&&r.v>55&&repOf(A)>35&&repOf(B)>35&&R()<.25)makeAlliance(A,B);
   else if(!vass&&border&&!(r.truce>G.t)&&!(r.pact>G.t)&&r.v<-45&&R()<.3*(1+.3*(A.hc+B.hc))*(A.faith!==B.faith?1.3:1)){
    const sa=kStr(A),sb=kStr(B),agg=R()<sa/(sa+sb)?A:B,def=agg===A?B:A;
    declareWar(agg.id,def.id,A.faith!==B.faith&&R()<.6?'sainte':((rel(A.id,B.id).h||0)>45?'vengeance':'frontière'));
   }
  }else if(r.s==='a'){
   if(r.v<25){r.s='p';log(`L’alliance entre ${A.name} et ${B.name} se brise.`,'politique')}
   else if(!r.mar&&r.v>40&&R()<.04){r.mar=1;r.v=clamp(r.v+25,-100,100);log(`Mariage dynastique entre ${A.name} et ${B.name} : l’alliance se scelle par le sang.`,'politique')}
   else if(!r.mar&&R()<.03){const agg=R()<.5?A:B,def=agg===A?B:A;declareWar(agg.id,def.id,'trahison')}
  }else if(r.s==='w'){
   warResolve(A,B,r);
  }
 }
 for(const K of ks){K.tgt=null;K.tgtd=1e9}
 for(const key in G.rel){
  const q=G.rel[key];if(q.s!=='w')continue;
  const n=Number(key),A=G.kingdoms[Math.floor(n/512)],B=G.kingdoms[n%512];
  if(!A||!B||!A.alive||!B.alive)continue;setTgt(A,B);setTgt(B,A);
 }
}
function siege(){
 if(!G.warN)return;
 for(const c of G.cities.slice()){
  const K=G.kingdoms[c.k];let def=0;const att={};
  for(const d of G.creatures){
   if(d.dead||d.k<0||d.age<12)continue;
   if(Math.abs(d.x-c.x)>3||Math.abs(d.y-c.y)>3)continue;
   if(d.k===c.k)def++;else if(atWar(d.k,c.k))att[d.k]=(att[d.k]||0)+1;
  }
  let best=-1,bn=0;for(const k in att)if(att[k]>bn){bn=att[k];best=Number(k)}
  if(best>=0&&bn>=3&&bn>def*1.5){
   const A=G.kingdoms[best];c.k=best;addScore(best,K.id,25);
   for(const d of G.creatures)if(!d.dead&&d.k===K.id&&Math.hypot(d.x-c.x,d.y-c.y)<5){if(R()<.6)d.k=best;else{d.dead=1;G.stats.deaths++}}
   log(`${A.name} prend d’assaut ${c.name}, jusque-là à ${K.name}.`,'guerre');territory();
  }
 }
}
function fusion(A,B){
 if(G.faiths.length>=24)return;
 const fa=G.faiths[A.faith],fb=G.faiths[B.faith],id=G.faiths.length;
 const last=s=>s.split(' ').slice(-1)[0];
 G.faiths.push({id,name:`Concorde ${last(fa.name)}-${last(fb.name)}`,col:hex(hsl(rint(0,359),55,64))});
 A.faith=id;B.faith=id;
 log(`Syncrétisme : ${A.name} et ${B.name} fondent ensemble la ${G.faiths[id].name}.`,'culture');
}
function schism(K){
 if(G.faiths.length>=24)return;
 const base=G.faiths[K.faith],id=G.faiths.length;
 G.faiths.push({id,name:`${pick(['Réforme','Dissidence','Orthodoxie','Voie nouvelle'])} ${base.name.split(' ').slice(-1)[0]}`,col:hex(hsl(rint(0,359),65,62))});
 K.faith=id;
 log(`Schisme religieux : ${K.name} rompt avec ${base.name} et adopte la ${G.faiths[id].name}.`,'culture');
}
function religion(){
 const ks=G.kingdoms.filter(k=>k.alive);
 for(const A of ks){
  for(const bid in A.adj){
   const B=G.kingdoms[bid];if(!B||!B.alive||A.id>B.id||A.faith===B.faith)continue;
   const r=G.rel[rk(A.id,B.id)],rv=r?r.v:0;
   if(r&&r.s==='a'&&R()<.05){fusion(A,B);continue}
   const strong=A.pop>=B.pop?A:B,weak=strong===A?B:A;
   const p=.05*(A.adj[bid]>10?1:.5)*(rv>0?1.6:1)*(1+.3*(A.hp+B.hp));
   if(R()<p){const old=weak.faith;weak.faith=strong.faith;log(`${weak.name} abandonne ${fn(old)} pour ${fn(strong.faith)}.`,'culture')}
  }
 }
 for(const K of ks)if(K.vas>=0){const V=G.kingdoms[K.vas];if(V&&V.alive&&K.faith!==V.faith&&R()<.1){K.faith=V.faith;log(`${K.name}, vassal, adopte la foi de son suzerain (${fn(V.faith)}).`,'culture')}}
 for(const K of ks)if(K.pop>25&&R()<.004)schism(K);
}
function coast(c){for(let dy=-3;dy<=3;dy++)for(let dx=-3;dx<=3;dx++){const x=c.x+dx,y=c.y+dy;if(inb(x,y)&&G.ter[y*W+x]<=T.SEA)return true}return false}
function trade(){
 G.routes=[];const seen=new Set();
 for(const K of G.kingdoms)K.routeN=0;
 for(const a of G.cities){
  const cand=G.cities.filter(b=>b!==a&&!atWar(a.k,b.k)).map(b=>[Math.hypot(a.x-b.x,a.y-b.y),b]).filter(q=>q[0]<34&&q[0]>5).sort((x,y)=>x[0]-y[0]).slice(0,2);
  for(const q of cand){
   const b=q[1],key=a.id<b.id?a.id+'-'+b.id:b.id+'-'+a.id;if(seen.has(key))continue;
   let wet=0;for(let s=1;s<8;s++){const x=Math.round(a.x+(b.x-a.x)*s/8),y=Math.round(a.y+(b.y-a.y)*s/8);if(G.ter[y*W+x]<=T.SEA)wet++}
   const sea=wet>=3;if(wet>=6)continue;
   if(sea&&!(coast(a)&&coast(b)))continue;
   seen.add(key);G.routes.push({ax:a.x,ay:a.y,bx:b.x,by:b.y,ka:a.k,kb:b.k,sea});
   G.kingdoms[a.k].routeN++;if(b.k!==a.k)G.kingdoms[b.k].routeN++;
  }
 }
}
/* ----- climat ----- */
function setTer(i,t){G.ter[i]=t;genRes(i);G.dirtyT=true}
function ignite(i){const t=G.ter[i];if((t===T.GRASS||t===T.FOREST)&&!G.fire[i]&&!G.flood[i])G.fire[i]=rint(30,70)}
function igniteN(i){const n=i+[1,-1,W,-W][rint(0,3)];if(n>=0&&n<N&&Math.abs((n%W)-(i%W))<=1)ignite(n)}
function startDrought(){G.drought=rint(240,480);log('Une grande sécheresse frappe le monde : les récoltes dépérissent.','nature');G.dirtyT=true}
function startIce(){G.iceAge=rint(8,14);log('Un âge glaciaire s’installe : les neiges ne fondent plus.','nature');G.dirtyT=true}
function yearly(){
 const g=G,y=year(),pn=g.creatures.length;
 if(!g.iceAge&&y>6&&R()<.015)startIce();
 if(!g.drought&&R()<.07)startDrought();
 if(R()<.12)eruption(null);
 if(R()<.05)tsunami(null);
 if(pn>60&&!g.outbreak&&R()<.07)plague(null);
 if(!g.dragon&&pn>80&&R()<.05)spawnDragon(null);
 if(!g.kraken&&R()<.04)spawnKraken(null);
}
function climate(t){
 const g=G;
 if(t%60===0)g.dirtyT=true;
 if(g.drought>0){g.drought--;if(g.drought===0){log('La sécheresse prend fin : les pluies reviennent.','nature');g.dirtyT=true}}
 if(g.iceAge>0&&t%240===0){g.iceAge--;if(g.iceAge===0){log('L’âge glaciaire s’achève : les glaces reculent.','nature');g.dirtyT=true}}
 if(t%240===0)yearly();
}
function envTick(){
 const g=G,ter=g.ter;
 for(let i=0;i<N;i++){
  const f=g.fire[i];
  if(f){g.fire[i]=f-1;if(R()<.05)igniteN(i);if(f===1&&(ter[i]===T.FOREST||ter[i]===T.GRASS))setTer(i,T.ASH)}
  if(ter[i]===T.LAVA){
   if(g.lava[i]>0){g.lava[i]--;if(g.lava[i]===0){setTer(i,T.ASH);continue}}
   if(R()<.01)igniteN(i);
  }
  if(g.flood[i])g.flood[i]--;
  if(ter[i]===T.ASH&&R()<.0003){let fo=0;for(const d of [1,-1,W,-W]){const n=i+d;if(n>=0&&n<N&&ter[n]===T.FOREST)fo++}setTer(i,fo>0&&R()<.5?T.FOREST:T.GRASS)}
 }
}
function eruption(p){
 let vx,vy;
 if(p){vx=p[0];vy=p[1]}else{const q=randTile(t=>t===T.MOUNT||t===T.SNOW);if(!q)return;vx=q[0];vy=q[1]}
 const rad=rint(2,3);
 const lavaAt=(x,y)=>{
  if(!inb(x,y))return;const i=y*W+x;if(G.ter[i]<=T.SEA)return;
  let co=false;for(const d of [[1,0],[-1,0],[0,1],[0,-1]]){const nx=x+d[0],ny=y+d[1];if(inb(nx,ny)&&G.ter[ny*W+nx]<=T.SEA)co=true}
  G.fire[i]=0;if(co){setTer(i,T.ASH);return}
  setTer(i,T.LAVA);G.lava[i]=rint(120,300);
 };
 for(let dy=-rad;dy<=rad;dy++)for(let dx=-rad;dx<=rad;dx++)if(dx*dx+dy*dy<=rad*rad)lavaAt(vx+dx,vy+dy);
 for(let f=0;f<10;f++){let x=vx,y=vy;const L=rint(6,12);for(let s=0;s<L;s++){x+=rint(-1,1);y+=rint(-1,1);lavaAt(x,y)}}
 for(const c of G.creatures)if(Math.hypot(c.x-vx,c.y-vy)<=rad+1&&c.r!==6)c.hp-=20;
 for(let dy=-7;dy<=7;dy++)for(let dx=-7;dx<=7;dx++){const x=vx+dx,y=vy+dy;if(inb(x,y)&&R()<.25)ignite(y*W+x)}
 G.fx.push({x:vx,y:vy,t:20,k:'v'});
 log(`Éruption volcanique en (${vx},${vy}) : la lave dévale la montagne.`,'nature');
}
function tsunami(p){
 let cx,cy;if(p){cx=p[0];cy=p[1]}else{const q=randTile(t=>t<=T.SEA);if(!q)return;cx=q[0];cy=q[1]}
 const rad=16;let hit=0;
 for(let dy=-rad;dy<=rad;dy++)for(let dx=-rad;dx<=rad;dx++){
  const x=cx+dx,y=cy+dy;if(!inb(x,y)||dx*dx+dy*dy>rad*rad)continue;
  const i=y*W+x,t=G.ter[i];if(t<=T.SEA||(t>=T.HILL&&t!==T.ASH))continue;
  let near=false;
  for(let wy=-4;wy<=4&&!near;wy++)for(let wx=-4;wx<=4;wx++){const nx=x+wx,ny=y+wy;if(inb(nx,ny)&&G.ter[ny*W+nx]<=T.SEA){near=true;break}}
  if(!near)continue;
  G.flood[i]=rint(40,70);G.fire[i]=0;if(t===T.GRASS&&R()<.25)setTer(i,T.SAND);hit++;
 }
 G.fx.push({x:cx,y:cy,t:20,k:'t'});
 log(hit?`Un tsunami submerge les côtes autour de (${cx},${cy}) : ${hit} terres inondées.`:`Un tsunami se perd au large de (${cx},${cy}).`,'nature');
}
function plague(p){
 let x,y;
 if(p){x=p[0];y=p[1]}else{const l=G.creatures.filter(c=>!c.dead);if(!l.length)return;const c=pick(l);x=c.x;y=c.y}
 let n=0;for(const c of G.creatures)if(!c.dead&&!c.imm&&Math.hypot(c.x-x,c.y-y)<=6){c.sick=1;n++}
 if(n){G.outbreak=1;G.outDead=0;log(`Une épidémie se déclare près de (${x},${y}) : ${n} malades.`,'nature')}
}
function epi(){
 let n=0;for(const c of G.creatures)if(!c.dead&&c.sick)n++;G.sickN=n;
 if(G.outbreak&&n===0){G.outbreak=0;log(`L’épidémie s’éteint après ${G.outDead} morts.`,'nature')}
}
/* ----- faune ----- */
function stepA(a,fly,water){
 const nx=a.x+rint(-1,1),ny=a.y+rint(-1,1);if(!inb(nx,ny))return;
 const t=G.ter[ny*W+nx];
 if(water){if(t<=T.SEA){a.x=nx;a.y=ny}return}
 if(fly||walk(nx,ny,0)&&t!==T.MOUNT&&t!==T.SNOW){a.x=nx;a.y=ny}
}
function toward(a,tx,ty,fly){
 const nx=a.x+Math.sign(tx-a.x),ny=a.y+Math.sign(ty-a.y);if(!inb(nx,ny))return;
 if(fly||walk(nx,ny,3)){a.x=nx;a.y=ny}
}

function updA(a,t){
 const g=G;a.age++;
 if(MON[a.t])return MON[a.t](a,t);
 if(a.t==='deer'){
  if(R()<.18)stepA(a,false);
  if(g.fire[a.y*W+a.x]||a.age>2500+a.id%500){a.dead=1;return}
  if(t%40===0&&R()<.26&&g.deerN<300){const tt=g.ter[a.y*W+a.x];if(tt===T.GRASS||tt===T.FOREST){const nx=a.x+rint(-1,1),ny=a.y+rint(-1,1);if(walk(nx,ny,0))g.animals.push({id:g.cid++,x:nx,y:ny,t:'deer',age:0,hun:0})}}
  if(t%5===0)for(const c of nearList(a.x,a.y,g.grid))if(!c.dead&&c.k>=0&&R()<.0012){a.dead=1;break}
 }else if(a.t==='wolf'){
  a.hun++;
  if(a.hun>100){let b=null,bd=196;for(const d of g.animals)if(d.t==='deer'&&!d.dead){const q=(d.x-a.x)**2+(d.y-a.y)**2;if(q<bd){bd=q;b=d}}if(b&&R()<.4)toward(a,b.x,b.y,false);else if(R()<.3)stepA(a,false)}
  else if(R()<.3)stepA(a,false);
  for(const d of nearList(a.x,a.y,g.ag))if(d.t==='deer'&&!d.dead){d.dead=1;a.hun=0;if(g.wolfN<30&&R()<.12)g.animals.push({id:g.cid++,x:a.x,y:a.y,t:'wolf',age:0,hun:0});break}
  for(const c of nearList(a.x,a.y,g.grid))if(!c.dead&&R()<.04){c.hp-=2}
  if(a.hun>1500||g.fire[a.y*W+a.x])a.dead=1;
 }else if(a.t==='dragon'){
  a.life--;
  let tg=null,bd=1e9;for(const c of g.cities){const d=Math.hypot(c.x-a.x,c.y-a.y);if(d<bd){bd=d;tg=c}}
  if(tg&&bd>2&&R()<.5)toward(a,tg.x,tg.y,true);else if(R()<.3)stepA(a,true);
  for(const c of g.creatures)if(!c.dead&&Math.abs(c.x-a.x)<=2&&Math.abs(c.y-a.y)<=2&&R()<.35){c.hp-=4;c.lastHit=-1}
  if(R()<.25){const x=a.x+rint(-2,2),y=a.y+rint(-2,2);if(inb(x,y))ignite(y*W+x)}
  for(const c of nearList(a.x,a.y,g.grid))if(!c.dead&&c.k>=0&&R()<.4){a.hp-=(1+.4*lvOf(c.k))*(c.hero?2:1);a.last=c.k}
  if(a.hp<=0){a.dead=1;g.dragon=null;log(a.last>=0?`Le dragon est terrassé par les guerriers de ${nm(a.last)} !`:'Le dragon s’effondre, terrassé.','heros')}
  else if(a.life<=0){a.dead=1;g.dragon=null;log('Le dragon regagne son antre et se rendort.','nature')}
 }else if(a.t==='kraken'){
  a.life--;if(R()<.3)stepA(a,false,true);
  if(R()<.1)for(const c of g.creatures)if(!c.dead&&Math.abs(c.x-a.x)<=2&&Math.abs(c.y-a.y)<=2){c.hp-=6;c.lastHit=-1;break}
  if(a.life<=0){a.dead=1;g.kraken=null;log('Le monstre marin replonge dans les abysses.','nature')}
 }
}
function checkExt(){
 let d=0,w=0;for(const a of G.animals)if(!a.dead){if(a.t==='deer')d++;else if(a.t==='wolf')w++}
 for(const [k,n,nom] of [['deer',d,'cerfs'],['wolf',w,'loups']]){
  if(n>G.peak[k])G.peak[k]=n;
  if(n===0&&G.peak[k]>=5&&!G.ext[k]){G.ext[k]=1;log(`Extinction : il ne reste plus aucun des ${nom} dans ce monde.`,'nature')}
  if(n>0)G.ext[k]=0;
 }
}
function domest(){
 for(const K of G.kingdoms)if(K.alive&&!K.dom&&K.lv>=1&&G.animals.some(a=>a.t==='deer'&&!a.dead&&K.cl.some(c=>Math.hypot(a.x-c.x,a.y-c.y)<9))){K.dom=1;log(`${K.name} domestique les cerfs sauvages : l’élevage nourrit ses villes.`,'culture')}

/* ----- pouvoirs ----- */
const TERR={sea:T.DEEP,shallow:T.SEA,sand:T.SAND,grass:T.GRASS,forest:T.FOREST,hill:T.HILL,mount:T.MOUNT};
const RSPAWN={human:0,elf:1,orc:2,dwarf:3};
function circle(cx,cy,rad,fn2){for(let dy=-rad;dy<=rad;dy++)for(let dx=-rad;dx<=rad;dx++){if(dx*dx+dy*dy>rad*rad+.5)continue;const x=cx+dx,y=cy+dy;if(inb(x,y))fn2(x,y,y*W+x)}}
function brushTerrain(tt,cx,cy,rad){circle(cx,cy,rad,(x,y,i)=>{setTer(i,tt);G.fire[i]=0;G.lava[i]=0;G.flood[i]=0});territory()}
function rainAt(cx,cy,rad){circle(cx,cy,rad,(x,y,i)=>{G.fire[i]=0;const t=G.ter[i];if(t===T.LAVA){G.lava[i]=0;setTer(i,T.ASH)}else if(t===T.ASH&&R()<.35)setTer(i,T.GRASS)});G.fx.push({x:cx,y:cy,t:6,k:'r',r:rad})}
function fireAt(cx,cy,rad){circle(cx,cy,rad,(x,y,i)=>{if(R()<.5)ignite(i)})}
function smite(cx,cy,rad){
 for(const c of G.creatures)if(!c.dead&&Math.hypot(c.x-cx,c.y-cy)<=rad+.5)killC(c,'smite');
 for(const a of G.animals)if(!a.dead&&Math.hypot(a.x-cx,a.y-cy)<=rad+.5){a.dead=1;if(a===G.dragon)G.dragon=null;if(a===G.kraken)G.kraken=null}
 G.fx.push({x:cx,y:cy,t:5,k:'s',r:rad});
}
function lightning(x,y){
 ignite(y*W+x);G.fx.push({x,y,t:6,k:'l'});
 for(const c of G.creatures)if(!c.dead&&Math.abs(c.x-x)<=1&&Math.abs(c.y-y)<=1)c.hp-=30;
 for(const a of G.animals)if(!a.dead&&a.t!=='dragon'&&Math.abs(a.x-x)<=1&&Math.abs(a.y-y)<=1)a.dead=1;
}
function meteor(x,y){
 circle(x,y,3,(px,py,i)=>{const d=Math.hypot(px-x,py-y);if(G.ter[i]<=T.SEA)return;if(d<=1.6){setTer(i,T.LAVA);G.lava[i]=rint(100,220)}else setTer(i,T.ASH);G.fire[i]=0});
 for(const c of G.creatures)if(!c.dead&&Math.hypot(c.x-x,c.y-y)<=4&&c.r!==6)c.hp-=40;
 circle(x,y,7,(px,py,i)=>{if(R()<.3)ignite(i)});
 G.fx.push({x,y,t:14,k:'m'});
 log(`Une météorite s’écrase en (${x},${y}).`,'nature');territory();
}
function nearestC(x,y,rad){let b=null,bd=rad*rad+1;for(const c of G.creatures){if(c.dead)continue;const d=(c.x-x)**2+(c.y-y)**2-(c.hero?2:0);if(d<bd){bd=d;b=c}}return b}
function blessAt(x,y){
 const c=nearestC(x,y,3);if(!c)return;
 c.hp=RACES[c.r].hp*1.5;c.sick=0;c.imm=1;
 if(!c.hero&&c.r!==5)makeHero(c);else log(`Les dieux bénissent ${c.name||RACES[c.r].s}.`,'heros');
 G.fx.push({x:c.x,y:c.y,t:10,k:'g'});
}
function curseAt(x,y){
 const c=nearestC(x,y,3);if(!c)return;
 const nom=c.name||RACES[c.r].s;
 if(R()<.5){log(`Une malédiction s’abat sur ${nom} : il se transforme en abomination.`,'heros');curseC(c)}
 else{log(`Une malédiction foudroie ${nom}.`,'heros');killC(c,'?')}
 G.fx.push({x:c.x,y:c.y,t:10,k:'c'});
}
function spawnGroup(r,x,y){let n=0;for(let k=0;k<4;k++){const c=spawnNear(x,y,r,-1,2,{age:16+k});if(c)n++}if(!n)return;G.fx.push({x,y,t:8,k:'g'})}
function inspectAt(x,y){
 let best=null,bd=9;
 for(const a of G.armies||[]){const d=(a.x-x)**2+(a.y-y)**2;if(d<=12&&d<bd){bd=d;best={type:'army',id:a.id}}}
 for(const c of G.cities){const d=(c.x-x)**2+(c.y-y)**2;if(d<bd){bd=d;best={type:'city',id:c.id}}}
 if(!best){
  const c=nearestC(x,y,2);if(c)best={type:'cre',id:c.id};
  else for(const a of G.animals){if(!a.dead&&Math.abs(a.x-x)<=2&&Math.abs(a.y-y)<=2){best={type:'ani',id:a.id};break}}
 }
 G.sel=best||{type:'tile',x,y};
}
function applyTool(id,x,y,rad){
 if(!inb(x,y))return;
 if(TERR[id]!==undefined){brushTerrain(TERR[id],x,y,rad);return}
 switch(id){
  case 'rain':rainAt(x,y,rad);break;
  case 'fire':fireAt(x,y,rad);break;
  case 'smite':smite(x,y,rad);break;
  case 'light':lightning(x,y);break;
  case 'meteor':meteor(x,y);break;
  case 'volcano':eruption([x,y]);break;
  case 'tsunami':tsunami([x,y]);break;
  case 'plague':plague([x,y]);break;
  case 'bless':blessAt(x,y);break;
  case 'curse':curseAt(x,y);break;
  case 'human':case 'elf':case 'orc':case 'dwarf':spawnGroup(RSPAWN[id],x,y);break;
  case 'deer':case 'wolf':spawnAnimal(id,x,y);break;
  case 'bear':case 'serpent':case 'golem':case 'zombie':spawnMon(id,x,y);break;
  case 'dragon':spawnDragon([x,y]);break;
  case 'kraken':spawnKraken([x,y]);break;
  case 'inspect':inspectAt(x,y);break;
 }
}
/* ----- pas de simulation ----- */
function step(){
 const g=G;g.t++;const t=g.t;
 buildGrids();
 climate(t);
 if(t%10===0){cityTick();kingdomTick(t);siege();domest()}
 for(const c of g.creatures)if(!c.dead)updC(c,t);
 g.deerN=0;g.wolfN=0;
 for(const a of g.animals)if(!a.dead){if(a.t==='deer')g.deerN++;else if(a.t==='wolf')g.wolfN++}
 for(const a of g.animals.slice())if(!a.dead)updA(a,t);
 envTick();
 if(t%25===0)territory();
 if(t%60===0){diplomacy();recountWars()}
 if(t%80===0)religion();
 if(t%100===0){trade();checkExt()}
 if(t%20===0)epi();
 extra(t);
 for(const f of g.fx)f.t--;
 g.fx=g.fx.filter(f=>f.t>0).slice(-300);
 if(g.creatures.some(c=>c.dead))g.creatures=g.creatures.filter(c=>!c.dead);
 if(g.animals.some(a=>a.dead))g.animals=g.animals.filter(a=>!a.dead);
 if(g.dragon&&g.dragon.dead)g.dragon=null;
 if(g.kraken&&g.kraken.dead)g.kraken=null;
}

const GENT=['le Conquérant','le Prudent','le Stratège','l’Inflexible','la Faucheuse','le Lion'];
function logPos(text){
 const m=/\((\d+),(\d+)\)/.exec(text);if(m)return[+m[1],+m[2]];
 for(const c of G.cities)if(text.includes(c.name))return[c.x,c.y];
 for(const K of G.kingdoms)if(K.alive&&K.cap&&text.includes(K.name))return[K.cap.x,K.cap.y];
 for(const c of G.creatures)if(c.hero&&c.name&&text.includes(c.name))return[c.x,c.y];

/* ---------- armées ---------- */
function raiseArmies(){
 const g=G;
 for(const K of g.kingdoms){
  if(!K.alive||!K.cap||R()>.5)continue;
  if(g.armies.filter(a=>a.k===K.id).length>=2)continue;
  let src=null,tgt=null,bd=1e9;
  for(const B of g.kingdoms){
   if(!B.alive||!atWar(K.id,B.id))continue;
   for(const c of K.cl){if(c.lvl<1)continue;for(const e of B.cl){const d=Math.hypot(c.x-e.x,c.y-e.y);if(d<bd&&d<70){bd=d;src=c;tgt=e}}}
  }
  if(!src||g.armies.some(a=>a.k===K.id&&a.tid===tgt.id))continue;
  const pool=g.creatures.filter(c=>!c.dead&&c.k===K.id&&c.age>=14&&!c.settle&&Math.hypot(c.x-src.x,c.y-src.y)<9);
  const n=Math.min(pool.length-2,Math.min(24,Math.floor(K.pop/4)+3));
  if(n<4)continue;
  for(let i=0;i<n;i++)pool[i].dead=1;
  const hero=pool.find(c=>c.hero),gen=hero?hero.name:nameFor(K.r)+' '+pick(GENT);
  g.armies.push({id:g.cid++,k:K.id,x:src.x,y:src.y,n,n0:n,gen,tid:tgt.id,sid:src.id,state:'march',stuck:0,bd:bd,t0:g.t});
  log(`${K.name} lève une armée de ${n} soldats menée par ${gen}, en route vers ${tgt.name}.`,'guerre');
 }
}

 {const A=G.kingdoms[w.a],B=G.kingdoms[w.b];if(A&&B){if(w.s>=25){kst(A).ww++;kst(B).wl++}else if(w.s<=-25){kst(B).ww++;kst(A).wl++}else{kst(A).wp++;kst(B).wp++}}}

function dictate(w,win,lose){

 const armed=G.armies.some(a=>a.k===A.id||a.k===B.id);

  if(!M.alive||M===A||M===B)continue;

 if((sa/sb>2.2||sb/sa>2.2)&&R()<.3){const big=sa>=sb?A:B;dictate(w,big,big===A?B:A);return}

 const war=G.warN>0,dk=OPT.dn?dayInfo().dark:0,sc=war||dk>.3?PENT:PENTM,dt=war?.17:dk>.3?.3:.23;
 while(nextT<AC.currentTime+.5){
  const root=[0,0,-3,-5][(stepN>>4)&3],f=n=>220*Math.pow(2,(n+root)/12);
  if(stepN%4===0)tone('triangle',f(0)/2,nextT,dt*3.5,.09);

  nextT+=dt;stepN++;
 }
}

function drawLife(now){
 const g=G,dk=OPT.dn?dayInfo().dark:0,WW=W*S,HH=H*S;
 const vx0=cam.x-20,vx1=cam.x+VW/cam.z+20,vy0=cam.y-20,vy1=cam.y+VH/cam.z+20;
 if(dk<.35&&cam.z>=.9){
  for(let i=0;i<16;i++){
   const dir=hash(i,1,g.seed)<.5?-1:1,sp=.006+hash(i,2,g.seed)*.005;
   const x=(((hash(i,3,g.seed)*WW+dir*now*sp)%WW)+WW)%WW,y=hash(i,4,g.seed)*HH+Math.sin(now/1300+i)*5;
   if(x<vx0||x>vx1||y<vy0||y>vy1)continue;
   ctx.fillStyle='rgba(30,20,50,.18)';ctx.fillRect(Math.round(x),Math.round(y+11),4,1);
   ctx.fillStyle='#3a3350';const up=((now/180+i)|0)&1;
   if(up){ctx.fillRect(x,y,1,1);ctx.fillRect(x+1,y+1,1,1);ctx.fillRect(x+2,y+2,1,1);ctx.fillRect(x+3,y+1,1,1);ctx.fillRect(x+4,y,1,1)}
   else{ctx.fillRect(x,y+1,1,1);ctx.fillRect(x+1,y+1,1,1);ctx.fillRect(x+2,y+2,1,1);ctx.fillRect(x+3,y+1,1,1);ctx.fillRect(x+4,y+1,1,1)}
  }
 }
 if(dk>.3&&cam.z>=1.4){
  ctx.globalCompositeOperation='lighter';
  for(let i=0;i<90;i++){
   const x=hash(i,5,g.seed)*WW+Math.sin(now/1700+i)*4,y=hash(i,6,g.seed)*HH+Math.cos(now/1400+i*2)*3;
   if(x<vx0||x>vx1||y<vy0||y>vy1)continue;
   const t=g.ter[Math.min(H-1,y/S|0)*W+Math.min(W-1,x/S|0)];if(t!==T.FOREST&&t!==T.GRASS)continue;
   const a=.5+.5*Math.sin(now/300+i*7);ctx.fillStyle=`rgba(220,255,120,${(a*.9).toFixed(2)})`;ctx.fillRect(Math.round(x),Math.round(y),2,2);
  }
  ctx.globalCompositeOperation='source-over';
 }
 if(cam.z>=1){
  const slot=Math.floor(now/1500);
  for(let q=0;q<8;q++){
   const ph=(now-slot*1500)/500;if(ph>1)break;
   const tx=Math.floor(hash(slot,20+q,g.seed)*W),ty=Math.floor(hash(slot,40+q,g.seed)*H);
   if(g.ter[ty*W+tx]>T.SEA)continue;
   const x=tx*S+S/2,y=ty*S+S/2;if(x<vx0||x>vx1||y<vy0||y>vy1)continue;
   const h=Math.sin(ph*Math.PI)*5;ctx.fillStyle='#e8f4ff';ctx.fillRect(Math.round(x-1+ph*3),Math.round(y-h),3,1);ctx.fillRect(Math.round(x+ph*3),Math.round(y-h-1),1,1);
   if(ph>.8){ctx.fillStyle='rgba(255,255,255,.7)';ctx.fillRect(Math.round(x-2),Math.round(y),5,1)}
  }
 }
}

 }
 if(!n)h+='<p class="mute">Le monde est en paix. Pour l’instant.</p>';

    if(!(r.pact>g.t))acts+=btn('pact',K.id,O.id,'Pacte',1);
    acts+=btn('discord',K.id,O.id,'Guerre',1);
   }else if(r.s==='a'){
    if(!r.mar)acts+=btn('marriage',K.id,O.id,'Mariage',1);
    acts+=btn('discord',K.id,O.id,'Trahir',1);
   }
   h+=`<div class="goal"><div>${sw(O.col)}<b>${esc(O.name)}</b> ${pills(K,O,r)}</div><div class="bar" style="grid-template-columns:1fr auto"><i style="--c:${r.v<-10?'var(--red,#c23b2e)':r.v>20?'var(--lime)':'var(--mute)'};width:${Math.max(3,pc)}%"></i><span>${opLabel(r.v)} (${Math.round(r.v)})</span></div><div class="row">${acts}</div></div>`;
  }
 }
 if(g.wlog.length){
  h+='<h3>Guerres passées</h3><ul class="log">';
  for(const w of g.wlog.slice(-8).reverse())h+=`<li><span class="yr">${yr(Math.floor(w.t0/240))}<br>→ ${yr(Math.floor(w.t1/240))}</span><span class="kd k-guerre">${esc(GOAL_L[w.goal]||w.goal)}</span><span class="tx">${esc(nm(w.a))} contre ${esc(nm(w.b))} : ${esc(w.res)}${Math.abs(w.s)>=15?' (avantage '+esc(nm(w.s>0?w.a:w.b))+')':''}</span></li>`;
  h+='</ul>';
 }
 return h;
}

let stSel=null;
function lineChart(series,o){
 o=o||{};const w=300,h=o.h||96,pl=30,pr=6,pt=8,pb=16;
 const n=Math.max(...series.map(s=>s.v.length));
 if(n<2)return '<p class="mute">Les courbes apparaissent après quelques années.</p>';
 let mx=1;for(const s of series)for(const v of s.v)if(v>mx)mx=v;
 mx=Math.ceil(mx*1.08);
 const X=i=>pl+(w-pl-pr)*(i/(n-1)),Y=v=>pt+(h-pt-pb)*(1-v/mx);
 let g='';
 for(const f of [0,.5,1]){const v=Math.round(mx*f),y=Y(v);g+=`<line x1="${pl}" x2="${w-pr}" y1="${y}" y2="${y}" stroke="var(--panel-lo)" stroke-width="1"/><text x="${pl-4}" y="${y+3}" text-anchor="end" font-size="9" fill="var(--mute)">${v}</text>`}
 const y0=o.y0,y1=o.y1;
 g+=`<text x="${pl}" y="${h-3}" font-size="9" fill="var(--mute)">An ${y0+1}</text><text x="${w-pr}" y="${h-3}" text-anchor="end" font-size="9" fill="var(--mute)">An ${y1+1}</text>`;
 for(const s of series){
  const d=s.v.map((v,i)=>(i?'L':'M')+X(i+(n-s.v.length)).toFixed(1)+' '+Y(v).toFixed(1)).join('');
  g+=`<path d="${d}" fill="none" stroke="${s.c}" stroke-width="2" stroke-linejoin="round"/>`;
 }
 return `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(o.label||'Courbe')}">${g}</svg>`;
}

const TER_IC={sea:['D','B'],shallow:['S','q'],sand:['a','A'],grass:['f','u'],forest:['F','v'],hill:['h','H'],mount:['m','M']};
function terrBM(id){const p=TER_IC[id],rows=[];for(let y=0;y<10;y++){let r='';for(let x=0;x<10;x++)r+=hash(x,y,id.length*31+id.charCodeAt(0))<.3?p[1]:p[0];rows.push(r)}return rows}
const icoCache={};
function icon(name){
 if(icoCache[name])return icoCache[name];
 const bm=name.startsWith('T_')?terrBM(name.slice(2)):(ICO[name]||ICO.inspect),n=bm.length,sz=n+2;
 const g=[];for(let y=0;y<sz;y++)g.push(new Array(sz).fill(null));
 for(let y=0;y<n;y++)for(let x=0;x<n;x++){const c=PAL[bm[y][x]];if(c)g[y+1][x+1]=c}
 const c=document.createElement('canvas');c.width=sz;c.height=sz;const q=c.getContext('2d');
 for(let y=0;y<sz;y++)for(let x=0;x<sz;x++){
  let col=g[y][x];
  if(!col&&((y>0&&g[y-1][x])||(y<sz-1&&g[y+1][x])||(x>0&&g[y][x-1])||(x<sz-1&&g[y][x+1])))col=PAL.k;
  if(col){q.fillStyle=col;q.fillRect(x,y,1,1)}
 }
 return icoCache[name]=c.toDataURL();
}

const ptrs=new Map();let pinch=null,panning=false,lastPan=null;
function scr(x,y){const r=cv.getBoundingClientRect();return[(x-r.left)/r.width*VW,(y-r.top)/r.height*VH]}
function s2w(sx,sy){return[cam.x+sx/cam.z,cam.y+sy/cam.z]}
function tilePos(e){const s=scr(e.clientX,e.clientY),w=s2w(s[0],s[1]);return[Math.floor(w[0]/S),Math.floor(w[1]/S)]}
function zoomAt(sx,sy,nz){nz=clamp(nz,ZMIN,ZMAX);const w=s2w(sx,sy);cam.z=nz;cam.x=w[0]-sx/nz;cam.y=w[1]-sy/nz;clampCam()}
function mid2(){const a=[...ptrs.values()];return{x:(a[0].x+a[1].x)/2,y:(a[0].y+a[1].y)/2,d:Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)||1}}
cv.addEventListener('pointerdown',e=>{
 e.preventDefault();try{cv.setPointerCapture(e.pointerId)}catch(_){}
 $('hint').hidden=true;
 ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(ptrs.size===2){painting=false;panning=false;const m=mid2(),s=scr(m.x,m.y),w=s2w(s[0],s[1]);pinch={d0:m.d,z0:cam.z,wx:w[0],wy:w[1]};return}
 if(ptrs.size>2)return;
 if(tool.id==='pan'){panning=true;lastPan={x:e.clientX,y:e.clientY};return}
 const p=tilePos(e);painting=!tool.once;lastApply=performance.now();
 applyTool(tool.id,p[0],p[1],rad);refreshUI(true);
});
cv.addEventListener('pointermove',e=>{
 if(ptrs.has(e.pointerId))ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(pinch&&ptrs.size===2){const m=mid2(),s=scr(m.x,m.y);cam.z=clamp(pinch.z0*m.d/pinch.d0,ZMIN,ZMAX);cam.x=pinch.wx-s[0]/cam.z;cam.y=pinch.wy-s[1]/cam.z;clampCam();return}
 if(panning&&lastPan){const r=cv.getBoundingClientRect();cam.x-=(e.clientX-lastPan.x)/r.width*VW/cam.z;cam.y-=(e.clientY-lastPan.y)/r.height*VH/cam.z;lastPan={x:e.clientX,y:e.clientY};clampCam();return}
 if(!painting)return;const now=performance.now();if(now-lastApply<45)return;lastApply=now;
 const p=tilePos(e);applyTool(tool.id,p[0],p[1],rad);
});
['pointerup','pointercancel'].forEach(ev=>cv.addEventListener(ev,e=>{ptrs.delete(e.pointerId);if(ptrs.size<2)pinch=null;painting=false;panning=false;lastPan=null}));
cv.addEventListener('wheel',e=>{e.preventDefault();const s=scr(e.clientX,e.clientY);zoomAt(s[0],s[1],cam.z*(e.deltaY<0?1.2:1/1.2))},{passive:false});

let ZCOV=1;
function resetCam(fit){cam.z=fit?ZMIN:ZCOV;cam.x=W*S/2-VW/2/cam.z;cam.y=H*S/2-VH/2/cam.z;clampCam()}
function resize(){
 const m=$('map'),r=m.getBoundingClientRect();if(r.width<10||r.height<10)return;
 const nw=Math.floor(r.width),nh=Math.floor(r.height);if(nw===VW&&nh===VH&&cv.width===nw&&cv.height===nh)return;
 const wasFit=cam.z<=ZMIN+1e-6;VW=nw;VH=nh;cv.width=VW;cv.height=VH;
 ZMIN=Math.min(VW/(W*S),VH/(H*S));ZCOV=Math.max(VW/(W*S),VH/(H*S));if(wasFit||cam.z<ZMIN)cam.z=ZMIN;clampCam();
}
if(typeof ResizeObserver!=='undefined')new ResizeObserver(resize).observe($('map'));
window.addEventListener('resize',resize);

function relMaps(){
 const wars={},allies={};
 for(const key in G.rel){
  const q=G.rel[key],n=Number(key),a=Math.floor(n/512),b=n%512;
  if(!G.kingdoms[a]||!G.kingdoms[b]||!G.kingdoms[a].alive||!G.kingdoms[b].alive)continue;
  if(q.s==='w'){(wars[a]=wars[a]||[]).push(b);(wars[b]=wars[b]||[]).push(a)}
  else if(q.s==='a'){allies[a]=(allies[a]||0)+1;allies[b]=(allies[b]||0)+1}
 }
 return{wars,allies};
}
function chronHTML(){
 const fl=['all','guerre','politique','nature','culture','heros','eco'];
 const head='<div class="filters">'+fl.map(k=>`<button data-f="${k}" class="${chFilter===k?'on':''}">${k==='all'?'Tout':KL[k]}</button>`).join('')+'</div>';
 const list=G.chron.filter(c=>chFilter==='all'||c.k===chFilter).slice(-120).reverse();
 if(!list.length)return head+'<p class="mute">Rien à raconter pour l’instant. Laisse le temps passer ou bouscule le monde.</p>';
 return head+'<ul class="log">'+list.map(c=>`<li${c.p?` class="go" data-go="${c.p[0]},${c.p[1]}"`:''}><span class="yr">${yr(c.y)}<br>${SEASONS[c.s].slice(0,3)}.</span><span class="kd k-${c.k}">${KL[c.k]}</span><span class="tx">${esc(c.t)}</span></li>`).join('')+'</ul>';
}
function kingdomsHTML(){
 const ks=G.kingdoms.filter(k=>k.alive).sort((a,b)=>b.pop-a.pop),m=relMaps();
 const dead=G.kingdoms.length-ks.length;
 if(!ks.length)return '<p class="mute">Aucun royaume. Pose des peuples sur la carte avec la catégorie « Peuples ».</p>';
 return ks.map(K=>{
  const chips=[];
  if(m.wars[K.id])chips.push(...m.wars[K.id].map(o=>`<span class="pill bad">Guerre : ${esc(nm(o))}</span>`));
  if(K.vas>=0)chips.push(`<span class="pill">Vassal de ${esc(nm(K.vas))}</span>`);
  const sv=G.kingdoms.filter(o=>o.alive&&o.vas===K.id).length;if(sv)chips.push(`<span class="pill">${sv} vassal${sv>1?'ux':''}</span>`);
  if(m.allies[K.id])chips.push(`<span class="pill ice">${m.allies[K.id]} allié${m.allies[K.id]>1?'s':''}</span>`);
  if(K.dom)chips.push('<span class="pill">Élevage</span>');
  return `<div class="kr">${sw(K.col)}<div class="kmain"><b>${esc(K.name)}</b><span class="mute">${RACES[K.r].s} · ${esc(fn(K.faith))} · souverain ${esc(K.ruler)}</span><span class="kmeta">Pop ${K.pop} · ${K.cities} cité${K.cities>1?'s':''} · Or ${Math.floor(K.gold)} · ${TECH[K.lv]}${K.routeN?' · '+K.routeN+' routes':''}</span><div class="pills">${chips.join('')}</div></div></div>`;
 }).join('')+(dead?`<p class="mute">${dead} royaume${dead>1?'s':''} disparu${dead>1?'s':''} depuis l’origine.</p>`:'');
}
function bars(items,total){return '<div class="bars">'+items.map(i=>`<div class="bar"><span>${esc(i.l)}</span><i style="width:${Math.max(2,i.v/Math.max(1,total)*100)}%;--c:${i.c}"></i><span>${i.v}</span></div>`).join('')+'</div>'}
function worldHTML(){
 const rc=[0,0,0,0,0,0,0];for(const c of G.creatures)rc[c.r]++;
 const tot=G.creatures.length,al=G.kingdoms.filter(k=>k.alive);
 const fol={};for(const K of al)fol[K.faith]=(fol[K.faith]||0)+K.pop;
 const fl=Object.keys(fol).map(k=>({l:fn(Number(k)),v:fol[k],c:G.faiths[k].col})).sort((a,b)=>b.v-a.v).slice(0,7);
 let deer=0,wolf=0;for(const a of G.animals){if(a.t==='deer')deer++;else if(a.t==='wolf')wolf++}
 const sn=SEASONS[season()],cl=G.iceAge?`Âge glaciaire (${G.iceAge} ans)`:G.drought>0?'Sécheresse':season()===3?'Hiver rigoureux':'Tempéré';
 const kv=(a,b)=>`<span>${a}</span><span>${b}</span>`;
 return `<h3>Peuples</h3>${tot?bars(RACES.map((r,i)=>({l:r.n,v:rc[i],c:r.c})).filter(x=>x.v>0),tot):'<p class="mute">Personne ne vit ici.</p>'}
 <h3>Monde</h3><div class="kv">${kv('Population',tot)}${kv('Cités',G.cities.length)}${kv('Royaumes en vie',al.length)}${kv('Guerres en cours',G.warN)}${kv('Guerres déclarées',G.stats.wars)}${kv('Naissances',G.stats.births)}${kv('Morts',G.stats.deaths)}${kv('Routes marchandes',G.routes.length)}</div>
 <h3>Religions</h3>${fl.length?bars(fl,al.reduce((s,k)=>s+k.pop,0)):'<p class="mute">Aucune foi établie.</p>'}
 <h3>Climat</h3><div class="kv">${kv('Saison',sn)}${kv('Conditions',cl)}${kv('Malades',G.sickN)}</div>
 <h3>Faune</h3><div class="kv">${kv('Cerfs',deer)}${kv('Loups',wolf)}${kv('Dragon',G.dragon?'éveillé':'—')}${kv('Kraken',G.kraken?'éveillé':'—')}</div>`;
}
function heroesHTML(){
 const hs=G.creatures.filter(c=>c.hero).sort((a,b)=>b.age-a.age);
 if(!hs.length)return '<p class="mute">Aucun héros. Ils émergent au fil des années, ou grâce à ta bénédiction (catégorie « Pouvoirs »).</p>';
 return hs.map(c=>`<div class="hr"><div><b>${esc(c.name)}</b> <span class="mute">${RACES[c.r].s}${c.trait?' · '+c.trait.toLowerCase():''} · ${c.age} ans</span></div><div class="mute">${c.k>=0?sw(G.kingdoms[c.k].col)+' '+esc(nm(c.k)):'Sans royaume'} · vie ${Math.max(0,Math.round(c.hp))}</div><div class="row"><button data-act="follow" data-id="${c.id}">Suivre</button><button data-act="bless" data-id="${c.id}">Bénir</button><button data-act="curse" data-id="${c.id}">Maudire</button></div></div>`).join('');
}
function renderPanel(){
 if(curTab==='Menu'&&document.activeElement&&document.activeElement.id==='seedIn')return;
 const h={Chronique:chronHTML,Royaumes:kingdomsHTML,Stats:statsHTML,Monde:worldHTML,'Héros':heroesHTML,Diplomatie:dipHTML,Prières:priereHTML,Objectifs:objectifsHTML,Menu:menuHTML}[curTab]();
 const st=pb.scrollTop;pb.innerHTML=h;pb.scrollTop=st;G.dirtyC=false;
}
function legendHTML(){
 const v=G.view;
 if(v==='terre'){const rc=[0,0,0,0,0,0,0];for(const c of G.creatures)rc[c.r]++;return RACES.map((r,i)=>rc[i]?`<span class="chip">${sw(r.c)}${r.n} ${rc[i]}</span>`:'').join('')}
 if(v==='dip')return [['#e0453a','Guerre'],['#38b764','Alliance'],['#41a6f6','Vassalité'],['#ffcd75','Pacte ou mariage']].map(q=>`<span class="chip">${sw(q[0])}${q[1]}</span>`).join('');
 if(v==='pol')return G.kingdoms.filter(k=>k.alive).sort((a,b)=>b.pop-a.pop).slice(0,10).map(k=>`<span class="chip">${sw(k.col)}${esc(k.name)}</span>`).join('');
 if(v==='rel'){const f={};for(const k of G.kingdoms)if(k.alive)f[k.faith]=(f[k.faith]||0)+k.pop;return Object.keys(f).sort((a,b)=>f[b]-f[a]).slice(0,8).map(i=>`<span class="chip">${sw(G.faiths[i].col)}${esc(G.faiths[i].name)} ${f[i]}</span>`).join('')}
 if(v==='res')return RESNAME.slice(1).map((n,i)=>`<span class="chip">${sw(hex(RESCOL[i+1]))}${n}</span>`).join('')+'<span class="chip">Routes : or = terre, bleu = mer</span>';
 return '<span class="chip">Faible<i class="ramp"></i>Forte</span>';
}
function showToast(c){
 if(typeof sfxFor==='function')sfxFor(c);
 const el=$('toast');el.className='toast k-'+c.k;el.innerHTML=`<b>${KL[c.k]}</b>${esc(c.t)}`;el.hidden=false;
 clearTimeout(toastT);toastT=setTimeout(()=>{el.hidden=true},5200);
}
function checkToasts(){
 const n=G.chronN||0;if(n<seenN)seenN=0;
 if(n>seenN){const k=Math.min(n-seenN,40),items=G.chron.slice(-k);seenN=n;const imp=items.filter(c=>c.k!=='eco').pop();if(imp)showToast(imp)}
}
function refreshUI(force){
 const g=G,st=[];
 if(g.drought>0)st.push('<span class="chip bad">Sécheresse</span>');
 if(g.iceAge)st.push('<span class="chip ice">Âge glaciaire</span>');
 if(g.outbreak)st.push('<span class="chip bad">Épidémie</span>');
 if(g.armies&&g.armies.length)st.push(`<span class="chip bad">${g.armies.length} armée${g.armies.length>1?'s':''}</span>`);
 if(g.warN)st.push(`<span class="chip bad">${g.warN} guerre${g.warN>1?'s':''}</span>`);
 $('clock').innerHTML=`<b>${yr(year()).toUpperCase()}</b><span>${SEASONS[season()]}</span>`;
 $('status').innerHTML=st.join('');
 $('legend').innerHTML=legendHTML();
 const ih=inspectHTML();const ie=$('inspect');ie.hidden=!ih;if(ih)ie.innerHTML=ih;
 checkToasts();
 if(G.prayers.length!==lastPrayN){lastPrayN=G.prayers.length;buildPTabs()}
 if(!document.body.classList.contains('open'))return;
 if(pbHold&&!force)return;
 if(curTab==='Chronique'&&!g.dirtyC&&!force)return;
 renderPanel();
}
let last=performance.now(),acc=0;
function frame(now){
 if(speed>0){acc+=Math.min(100,now-last)/100*speed;let n=0;while(acc>=1&&n<12){step();acc--;n++}if(acc>12)acc=0}
 last=now;followCam();draw();
 if(now-lastUI>700){lastUI=now;refreshUI(false)}
 requestAnimationFrame(frame);
}
$('menuIco').src=icon('menu');
if(!loadSlot('auto'))newGame(false);
seenN=G.chronN;if(G.t>0)$('hint').hidden=true;
buildViews();buildTools();buildPTabs();resize();resetCam(false);refreshUI(true);
requestAnimationFrame(frame);
</script>

</body></html>

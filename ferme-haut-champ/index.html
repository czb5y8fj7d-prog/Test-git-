<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Ferme du Haut-Champ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=DM+Mono:wght@400;500&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Concept : écran de jeu fixe. Tableau de bord en haut, champ carré au centre, onglets en bas. Le champ et l’accent suivent la saison. */
  --bg:#16211b; --panel:#1f3027; --panel2:#294034; --line:#38523f; --ink:#eef1e4; --mute:#9bb2a1;
  --gold:#f2c84b; --good:#87d46e; --bad:#f0695d; --warn:#f2a43d; --sky:#80c4ea;
  --season:#87d46e; --on-season:#13201a;
  --fd:'Bagel Fat One','Hanken Grotesk',system-ui,sans-serif;
  --fb:'Hanken Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;
  --fm:'DM Mono',ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
html[data-season="1"]{--season:#f3bb3d}
html[data-season="2"]{--season:#ea8040}
html[data-season="3"]{--season:#8fcbec}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 var(--fb);overflow:hidden;padding-block:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--season);outline-offset:2px}
.mono{font-family:var(--fm);font-variant-numeric:tabular-nums}
.app{height:100%;max-width:560px;margin:0 auto;display:grid;grid-template-rows:auto minmax(0,1fr) auto}
h2{font:400 19px/1.1 var(--fd);margin:20px 0 10px;letter-spacing:.2px;text-wrap:balance}
.panel>h2:first-child{margin-top:2px}
p{margin:0}

/* tableau de bord */
.hud{padding:10px 0 8px;border-bottom:1px solid var(--line);display:grid;gap:7px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;min-width:0}
.date{display:flex;align-items:baseline;gap:8px;min-width:0;white-space:nowrap}
.date b{font:400 21px/1 var(--fd);color:var(--season)}
.date .sub{color:var(--mute);font-size:13px}
.rt{display:flex;align-items:center;gap:10px;flex:none}
.cash{font:500 21px/1 var(--fm);color:var(--gold);transition:color .3s}
.cash.neg{color:var(--bad)}
.cash.gain{color:var(--good)}.cash.loss{color:var(--bad)}
.snd{background:none;border:1px solid var(--line);border-radius:8px;width:30px;height:30px;display:grid;place-items:center;color:var(--mute);padding:0}
.wx{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--mute);min-width:0}
.wx svg{flex:none}
.en{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mute);flex:none}
.ebar{width:84px;height:8px;border-radius:5px;background:var(--panel2);overflow:hidden}
.ebar i{display:block;height:100%;background:var(--season);border-radius:5px}
.evt{border:1px solid var(--gold);border-radius:8px;padding:5px 10px;font-size:12.5px;color:var(--ink)}
.evt.bad{border-color:var(--warn)}
.evt.fest{border-color:var(--season)}

.main{overflow-y:auto;overscroll-behavior:contain;padding:12px 0 18px;-webkit-overflow-scrolling:touch;min-width:0}

/* composants */
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:9px;margin-bottom:10px}
.card h3{margin:0;font:700 15px/1.25 var(--fb)}
.muted{color:var(--mute);font-size:13px}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:14px;align-items:baseline}
.kv span:first-child{color:var(--mute)}
.btn{border:1px solid var(--line);background:var(--panel2);border-radius:9px;padding:9px 12px;font-weight:600;font-size:14px;min-height:40px;text-align:center}
.btn:hover{border-color:var(--season)}
.btn.pri{background:var(--season);color:var(--on-season);border-color:transparent}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.sm{padding:6px 11px;min-height:34px;font-size:13px}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.gold{color:var(--gold)}
.pos{color:var(--good)}.neg{color:var(--bad)}
.inp{width:100%;padding:11px 12px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:16px}
.almanac{font-size:13px;color:var(--mute);font-style:italic;margin:0 0 10px;text-wrap:balance}

/* champ et ferme */
.fieldwrap{border-radius:12px;overflow:hidden;border:1px solid var(--line);background:#000}
#cv{display:block;width:100%;aspect-ratio:1/1;max-width:100%;touch-action:none;cursor:pointer}
#sc{display:block;width:100%;aspect-ratio:1/1.86;max-width:100%;cursor:pointer;touch-action:pan-y}
#yc{display:block;width:min(100%,calc(44vh/1.86));aspect-ratio:1/1.86;margin:0 auto;border-radius:10px}
.seedbar{display:flex;gap:8px;overflow-x:auto;padding:10px 0 4px;scrollbar-width:thin}
.chip{flex:none;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:7px 11px 7px 9px;display:grid;grid-template-columns:auto 1fr;column-gap:8px;text-align:left;min-width:128px;align-items:center}
.chip svg{grid-row:1/3}
.chip b{font-size:13px;line-height:1.2}
.chip small{font:400 11px var(--fm);color:var(--mute)}
.chip.on{border-color:var(--season);background:var(--panel2)}
.chip.late small{color:var(--warn)}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:6px}
.pk{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:7px 9px;display:grid;gap:1px;text-align:left;font:inherit;font-size:13px}
.pk small{color:var(--mute);font-size:11px}.pk.per{border-style:dashed}.pk[disabled]{opacity:.4}
.lbl{font:600 12.5px var(--fb);color:var(--mute);margin-top:4px}
.opts{display:grid;gap:7px}
.opt{text-align:left;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:9px 11px;display:grid;gap:2px;font:inherit}
.opt b{font-size:14px}.opt small{color:var(--mute);font-size:12px;line-height:1.35}
.opt.on{border-color:var(--season);background:var(--panel2)}
#ngmap{display:block;width:100%;aspect-ratio:1/.82;border-radius:10px;background:#101a14}
.deal{border-top:1px solid var(--line);padding:9px 0 2px;display:grid;gap:5px}
.deal.out{opacity:.5}
.hb{display:inline-block;width:56px;height:6px;border-radius:3px;background:var(--panel2);overflow:hidden;vertical-align:middle}.hb i{display:block;height:100%;background:var(--good)}.hb.mid i{background:var(--warn)}.hb.low i{background:var(--bad)}
.arow{border-top:1px solid var(--line);padding:9px 0;display:grid;gap:5px}.arow:first-of-type{border-top:0}
.ahead{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;background:none;border:0;color:var(--ink);font:inherit;text-align:left;padding:0;cursor:pointer;min-height:34px}
.chips2{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px}
.hb2{display:grid;grid-template-columns:minmax(80px,34%) 1fr auto;gap:8px;align-items:center;font-size:13px;padding:5px 0}
.hb2 .t{height:8px;border-radius:4px;background:var(--panel2);position:relative;overflow:hidden}
.hb2 .t:after{content:"";position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--line)}
.hb2 .t i{position:absolute;top:0;bottom:0;border-radius:4px}.hb2 .t i.p{left:50%;background:var(--good)}.hb2 .t i.n{right:50%;background:var(--bad)}
.hsub{font-size:12px;color:var(--mute);margin:-3px 0 5px}
.advbox{display:grid;gap:6px;margin:8px 0}
.adv{text-align:left;border:1px solid var(--line);border-left:4px solid var(--warn);background:var(--panel);color:var(--ink);border-radius:8px;padding:8px 10px;font:inherit;font-size:13px;cursor:pointer}
.adv.s2{border-left-color:var(--bad)}.adv.s0{border-left-color:var(--sky)}
.tag{display:inline-block;font:600 11px var(--fm);padding:2px 7px;border-radius:99px;background:var(--panel2);color:var(--ink);margin-right:5px}
.tag.hot{background:var(--gold);color:#2a2000}
.sw{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);padding:0}
.sw.on{border-color:#fff}
.seg{display:flex;gap:8px;margin-top:8px}
.seg .btn{flex:1}
.tools{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.tools .btn{display:flex;flex-direction:column;align-items:center;gap:1px;padding:8px 4px}
.tools .btn small{font:400 11px var(--fm);color:var(--mute)}
.info{margin-top:10px;font-size:13px;color:var(--mute);display:grid;gap:4px}
.info b{color:var(--ink)}
.warnbox{margin-top:10px;border:1px solid var(--warn);border-radius:10px;padding:8px 11px;font-size:13px}
#farm-body{margin-top:4px}

/* marché */
.mrow{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.mrow:last-child{border-bottom:0}
.mname{font-weight:700;font-size:14px}
.mprice{font:500 17px var(--fm);text-align:right}
.mprice small{display:block;font-size:11px}
.msub{display:flex;align-items:center;gap:8px;color:var(--mute);font-size:12px}
.sell{grid-column:2/4;display:flex;gap:8px;flex-wrap:wrap}
.stk{font:500 12px var(--fm);color:var(--ink)}
.order .row b{font-size:14px}
.qt{font-style:italic;font-size:12.5px;color:var(--mute)}
.cli{display:grid;grid-template-columns:38px minmax(0,1fr);gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.cli:last-child{border-bottom:0}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font:700 13px var(--fb);color:#13201a}
.rbar{height:5px;border-radius:3px;background:var(--panel2);overflow:hidden;margin-top:5px}
.rbar i{display:block;height:100%;background:var(--season)}
.prog{height:8px;border-radius:5px;background:var(--panel2);overflow:hidden}
.prog i{display:block;height:100%;background:var(--season)}

/* comptes */
.chart{width:100%;height:auto;display:block}
.ax{font:10px var(--fm);fill:var(--mute)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--mute)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.goal{display:flex;gap:10px;align-items:center;padding:5px 0;font-size:14px}
.goal .tk{flex:none;width:18px;height:18px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center}
.goal.done{color:var(--mute)}
.goal.done .tk{border-color:var(--good);background:var(--good)}
.goal .rw{margin-left:auto;font:400 12px var(--fm);color:var(--mute)}
.log{font-size:13px;color:var(--mute);padding:3px 0;display:flex;gap:8px}
.log .mono{flex:none;color:var(--ink);opacity:.7}
.log.good{color:var(--good)}.log.bad{color:var(--bad)}

/* barre d’onglets */
.tabs{display:grid;grid-template-columns:repeat(6,1fr);gap:2px;padding:6px 0 8px;border-top:1px solid var(--line);background:var(--bg)}
.tab{background:none;border:0;border-radius:10px;padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;font-weight:600;color:var(--mute);min-width:0}
.tab svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-selected=true]{color:var(--season);background:var(--panel)}
.tab.endday{background:var(--season);color:var(--on-season)}

/* messages, gains flottants, fenêtres */
.toasts{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 8px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:6px;justify-items:center;pointer-events:none;z-index:30}
.toast{max-width:520px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13px;box-shadow:0 6px 18px #0007;animation:tin .18s ease-out}
.toast.good{border-color:var(--good)}.toast.bad{border-color:var(--bad)}
@keyframes tin{from{opacity:0;transform:translateY(-6px)}}
.pops{position:fixed;right:max(16px,env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 46px);display:grid;gap:2px;justify-items:end;pointer-events:none;z-index:25}
.pop{font:500 15px var(--fm);text-shadow:0 1px 3px #000b;animation:pup 1s ease-out forwards}
@keyframes pup{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-24px)}}
@media (prefers-reduced-motion:reduce){.toast{animation:none}.pop{animation:none}}
.veil{position:fixed;inset:0;background:#0a110dd9;display:grid;place-items:center;z-index:40;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet{width:min(460px,100%);max-height:100%;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;display:grid;gap:11px}
.sheet h2{margin:0}
.sheet ul{margin:0;padding-left:18px;display:grid;gap:7px;font-size:14px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:var(--panel2);border-radius:10px;padding:8px 10px;display:grid;gap:2px}
.stat small{color:var(--mute);font-size:11.5px}
.stat b{font:500 16px var(--fm)}

/* nuit et aube */
.night{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:24px;text-align:center;opacity:0;color:#eaf0ff;overflow:hidden}
.night.show{opacity:1;transition:opacity .45s ease}
.night .sky{position:absolute;inset:0}
.night .sky.n{background:linear-gradient(#0b1226,#1b2a4a 70%,#2e3f66)}
.night .sky.d{opacity:0;transition:opacity 1.1s ease}
.night.dawn .sky.d{opacity:1}
.night .stars{position:absolute;inset:0;width:100%;height:100%;transition:opacity .9s}
.night.dawn .stars{opacity:0}
@keyframes tw{from{opacity:.2}to{opacity:1}}
.night .moon{position:absolute;left:66%;top:13%;width:56px;height:56px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fffbe8,#d6d0b2);box-shadow:0 0 40px #f2efdc66;transition:transform 1.3s ease,opacity .9s}
.night.dawn .moon{transform:translateY(170px);opacity:0}
.night .sun{position:absolute;left:50%;bottom:-80px;width:92px;height:92px;margin-left:-46px;border-radius:50%;background:#ffd36b;box-shadow:0 0 70px #ffd36bcc;transition:transform 1.5s ease}
.night.dawn .sun{transform:translateY(-200px)}
.ncard{position:relative;max-width:360px;display:grid;gap:9px;justify-items:center}
.nt{font:400 24px/1.15 var(--fd);text-wrap:balance}
.nq{font-style:italic;font-size:14px;text-wrap:balance}
.nl{font-size:13.5px}
.nh{font-size:12px;opacity:.7}
.night.dawn .ncard{color:#2a2116}
.toast.news{border-color:var(--sky)}
.log.news{color:var(--sky)}
.ticker{overflow:hidden;white-space:nowrap;border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:7px 0;margin-bottom:4px;font:500 12.5px var(--fm);color:var(--sky)}
.tk-in{display:inline-block;padding-left:100%;animation:tkr 70s linear infinite}
@keyframes tkr{to{transform:translateX(-100%)}}
@media (prefers-reduced-motion:reduce){.tk-in{animation:none;padding:0 10px;white-space:normal;display:block}.ticker{white-space:normal}}
.tkb{width:36px;height:36px;border-radius:9px;background:var(--panel2);display:grid;place-items:center;font:500 10.5px var(--fm)}
.mrow.st{grid-template-columns:36px minmax(0,1fr) auto}
.lnk{background:none;border:0;padding:0;font:700 14px var(--fb);color:var(--ink);text-align:left;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.selrow .lnk{color:var(--season)}
.big{font:500 30px/1 var(--fm)}
.subnav{display:flex;gap:6px;margin:4px 0 10px;overflow-x:auto}
.subnav .btn{flex:none}
.ctl{position:sticky;top:0;z-index:5;background:var(--bg);padding:4px 0 2px}
.pbar{position:sticky;bottom:0;z-index:5;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:7px 10px;font-size:12.5px;margin-top:8px;display:flex;gap:10px;align-items:center;justify-content:space-between}
.pbar>span{min-width:0}
.pbar .btn{flex:none}
.acts .btn{display:inline-flex;flex-direction:column;align-items:center;gap:1px}
.acts .btn small{font:400 10.5px var(--fm);opacity:.75}
.sub2{font-size:12px;color:var(--mute)}
.mc{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.wbar{display:flex;height:14px;border-radius:7px;overflow:hidden;gap:2px}
.wbar i{display:block}

@media (prefers-reduced-motion:reduce){.night.show,.night .sky.d,.night .moon,.night .sun,.night .stars{transition:none}.night .stars circle{animation:none!important}}

/* ---- système d’interface commun ---- */
.panel>h2,#farm-body>h2{font-size:17px;margin:22px 0 8px}
.panel>h2:first-child,#farm-body>h2:first-child{font-size:22px;margin-top:4px}
.stabs{display:flex;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:7;background:var(--bg);overflow-x:auto;scrollbar-width:none;margin:0 0 12px}
.stabs::-webkit-scrollbar{display:none}
.subnav{position:sticky;top:0;z-index:7;background:var(--bg);margin:0 0 12px;overflow:visible;display:block}
.subnav .stabs{position:static;margin:0}
.stab{flex:1 1 auto;position:relative;background:none;border:0;padding:11px 9px 10px;font:600 13.5px var(--fb);color:var(--mute);white-space:nowrap;display:flex;align-items:center;justify-content:center;gap:6px;min-height:44px}
.stab[aria-selected=true]{color:var(--ink)}
.stab[aria-selected=true]::after{content:"";position:absolute;left:8px;right:8px;bottom:-1px;height:3px;border-radius:3px 3px 0 0;background:var(--season)}
.bdg{font:600 10.5px var(--fm);background:var(--panel2);color:var(--ink);border-radius:99px;padding:1px 6px;font-style:normal;line-height:1.5}
.bdg.s2{background:var(--bad);color:#fff}.bdg.s1{background:var(--warn);color:#2a1800}
.ctl{top:44px}
.pills{display:flex;gap:6px;overflow-x:auto;padding:0 0 10px;scrollbar-width:none}
.pills::-webkit-scrollbar{display:none}
.pills.wrap{flex-wrap:wrap;overflow:visible}
.pill{flex:none;border:1px solid var(--line);background:transparent;color:var(--mute);border-radius:99px;padding:6px 13px;font:600 13px var(--fb);min-height:34px}
.pill[aria-pressed=true]{background:var(--panel2);border-color:var(--season);color:var(--ink)}
.pill:hover{border-color:var(--season)}
.tgl{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;background:none;border:0;border-top:1px solid var(--line);padding:9px 0;text-align:left;min-height:48px}
.tgl:first-child{border-top:0}
.tgl b{display:block;font-size:14px;font-weight:600}
.tgl small{display:block;color:var(--mute);font-size:12px;line-height:1.3;margin-top:1px}
.tgl i{flex:none;width:44px;height:26px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);position:relative;transition:background .15s}
.tgl i::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--mute);transition:transform .15s,background .15s}
.tgl[aria-checked=true] i{background:var(--season);border-color:transparent}
.tgl[aria-checked=true] i::after{transform:translateX(18px);background:var(--on-season)}
details.help{border-top:1px solid var(--line);padding-top:4px}
details.help summary{list-style:none;cursor:pointer;color:var(--mute);font-size:12.5px;display:flex;align-items:center;gap:7px;min-height:30px}
details.help summary::-webkit-details-marker{display:none}
details.help summary::before{content:"?";flex:none;width:17px;height:17px;border-radius:50%;border:1px solid var(--mute);display:grid;place-items:center;font:600 10px var(--fm)}
details.help[open] summary{color:var(--ink)}
details.help[open] summary::before{border-color:var(--ink)}
details.help p{margin:2px 0 4px}
.alertbar{display:flex;align-items:center;gap:8px;width:100%;margin:0 0 10px;padding:9px 11px;border:1px solid var(--line);border-left:4px solid var(--warn);background:var(--panel);border-radius:10px;font:inherit;font-size:13px;color:var(--ink);text-align:left}

.tab{position:relative}
.dot{position:absolute;top:3px;left:calc(50% + 6px);width:10px;height:10px;border-radius:50%;background:var(--warn);border:2px solid var(--bg)}

.toasts{top:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 80px)}
.toast{pointer-events:auto}
.veil{place-items:end center}
.sheet{border-radius:18px 18px 12px 12px;max-height:92%;animation:sheetin .22s ease-out}
.sheet::before{content:"";justify-self:center;width:38px;height:4px;border-radius:4px;background:var(--line);margin:-6px 0 0}
@keyframes sheetin{from{transform:translateY(28px);opacity:.3}}
@media (min-width:600px){.veil{place-items:center}.sheet{border-radius:14px}.sheet::before{display:none}}

.mrow,.arow,.deal,.cli{padding-top:11px;padding-bottom:11px}
.almanac{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.msub{flex-wrap:wrap;gap:3px 9px}.msub>span{white-space:nowrap}.msub svg{flex:none}
.order .row{align-items:baseline}

function buyNew(k,o){
  o=Object.assign({br:'vert',lv:1,mode:'cash',trade:false},o||{});
  const d=MACH[k];if(!d)return 'none';if(!S.b.hangar)return 'nob';
  if(!brandOk(o.br,k,o.lv)||!d.tiers[o.lv-1])return 'none';
  if(!dealState(k,o.br,o.lv).avail)return 'stock';
  const own=S.mach[k];
  if(own&&!o.trade)return 'have';
  if(!own&&Object.keys(S.mach).length>=hangCap())return 'hangfull';
  if(d.att&&!S.mach.tractor&&k!=='tractor')return 'notractor';
  const pr=offerPrice(k,o.br,o.lv),tv=own?tradeValue(k,o.br):0,settle=own?Math.round(leaseLeft(k)*.7):0;
  const net=pr-tv+settle;
  const down=o.mode==='lease'?Math.round(pr*.2):pr;
  if(S.cash+tv-settle<down)return 'cash';
  if(own){
    S.leases=S.leases.filter(x=>x.k!==k);S.cash+=tv-settle;S.cat.invest=(S.cat.invest||0)+(tv-settle);delete S.mach[k];
  }
  if(!pay(down))return 'cash';
  if(o.mode==='lease')S.leases.push({k,left:8,pay:Math.round(pr*1.16*.8/8)});
  installMach(k,{br:o.br,lv:o.lv,base:listPrice(k,o.br,o.lv),gar:BRANDS[o.br].gar,lease:o.mode==='lease',col:own?own.col:MCOL[k]});
  S.loy[o.br]=(S.loy[o.br]||0)+Math.round(pr/100);
  if(loyLvl(o.br)>=3)S.mach[k].gar+=2;
  return 'ok';
}

    if(S.t<c.due){keep.push(c);continue}
    const give=Math.min(S.stock[c.item]||0,c.qty),miss=c.qty-give;
    if(give)S.stock[c.item]-=give;
    S.cash+=c.dep;S.cat.invest=(S.cat.invest||0)+c.dep;
    earn('contrats',c.qty*c.fp);

      const pen=Math.round(miss*price(c.item)*1.1);spend('contrats',pen);

const HS=.05,SCOLS=60,SROWS=52,HR=.03,HW=Math.sqrt(3)*HR,HCOLS=58,HROWS=58,TX0=0,TY0=-.5,TX1=TX0+HW*(HCOLS+.5),TY1=TY0+HR*(2+1.5*(HROWS-1)),WCX=(TX0+TX1)/2,WCY=(TY0+TY1)/2;

function polyCentroid(p){
  let a=0,cx=0,cy=0;
  for(let i=0;i<p.length;i++){const A=p[i],B=p[(i+1)%p.length],c=A.x*B.y-B.x*A.y;a+=c;cx+=(A.x+B.x)*c;cy+=(A.y+B.y)*c}
  if(Math.abs(a)<1e-12)return {x:p[0].x,y:p[0].y,a:0};

function buildTerritory(seed,grid){

  const nb=(c,r,k)=>{

    else{const o=r&1;

function ageF(P,y){
  if(P.hay)return y<.25?0:1;
  if(y<P.first)return 0;
  if(y<P.first+1)return .45;
  if(y<P.first+2)return .8;

function perStage(f){const P=PER[f.per.k],y=perYears(f);if(P.hay)return 'permanente';return y<P.first?'jeune':y<P.first+2?'en montée':y<=P.peak?'plein rendement':y<=P.life?'en déclin':'épuisé'}

    case 'prune':return !f.per||PER[f.per.k].hay||(S.season!==3&&S.season!==0)||!!f.per.pruned;

  if(n>0&&res==='season')res='ok';
  if(n===0&&res==='ok'){for(const p of ['full','nomanure','reserve','cash','busy','notready','wet','ready','wild','rented','serre','season'])if(seenR.has(p)){res=p;break}}
  return {n,ha,res};
}

/* --- terres : achat, vente, division, fusion --- */
function landPrice(o){const q=(.6*o.hum+.4*o.str)/100;return Math.round(o.ha*650*SOIL[o.soil].pr*(.7+.6*q)*(TYPEF[o.t||'terre']||1)*terM().landP/10)*10}
function rentPrice(o){const q=(.6*o.hum+.4*o.str)/100;return Math.round(o.ha*24*SOIL[o.soil].pr*(.7+.6*q)*((o.t==='prairie')?.7:1))}
function fieldValue(f){
  if(f.rent)return 0;
  let v=Math.round(landPrice(f)*.8);
  if(f.per&&PER[f.per.k].cost&&!PER[f.per.k].hay){const P=PER[f.per.k];v+=Math.round(P.cost*f.ha*.4*Math.max(0,1-perYears(f)/P.life))}
  return v;
}
const ownedHa=()=>S.fields.reduce((a,f)=>a+(f.rent?0:f.ha),0);
function freeName(extra){
  const used=new Set(S.fields.map(f=>f.name).concat((S.land||[]).map(o=>o.name)).concat((extra||[]).map(o=>o.name)));
  return FNAMES.find(x=>!used.has(x))||('Champ '+(S.fid+(S.lid||0)+used.size));
}
function genLand(k){
  const out=[];
  for(let i=0;i<k;i++){
    const r=Math.random(),tm=terM();let t=r<.5?'terre':r<.68?'prairie':r<.84?'friche':'bois';
    if(tm.wild&&Math.random()<tm.wild)t='friche';
    const bag=[];for(const k in tm.land)for(let n=0;n<tm.land[k];n++)bag.push(k);
    const so=pick(bag),sl=SOIL[so];
    let hum=Math.round(sl.h0+rnd(-12,14)),str=Math.round(sl.s0+rnd(-12,12));
    if(t==='prairie'){hum=Math.max(hum,68+Math.round(rnd(0,12)));str=Math.max(str,62+Math.round(rnd(0,10)))}
    if(t==='friche'){hum=Math.round(rnd(12,30));str=Math.round(rnd(18,34))}
    if(t==='bois'){hum=Math.round(rnd(55,75));str=Math.round(rnd(50,62))}
    const o={id:S.lid++,name:freeName(out),ha:pick(t==='bois'?[1,1.5,2,3]:[1,1.5,2,2.5,3,4,5,6]),soil:so,t,lease:(t==='terre'||t==='prairie')&&Math.random()<.3,hum:clamp(hum,5,95),str:clamp(str,5,95)};
    if(S.cown&&!growCells('l'+o.id,Math.round(o.ha*2),null)){releaseCells('l'+o.id);continue}
    out.push(o);
  }
  return out;
}
function buyLand(id){
  const o=S.land.find(x=>x.id===id);if(!o)return 'none';
  if(S.fields.length>=MAXF||totalHa()+o.ha>MAXHA+.001)return 'maxland';
  const t=o.t||'terre';
  if(!o.lease&&!pay(landPrice(o)))return 'cash';
  if(o.lease&&S.cash<rentPrice(o))return 'cash';
  S.land=S.land.filter(x=>x!==o);
  const f=mkField(S.fid++,o.name,o.ha,o.soil,o.hum,o.str);
  for(let i=0;i<S.cown.length;i++)if(S.cown[i]==='l'+o.id)S.cown[i]='f'+f.id;
  f.t=t;
  if(o.lease)f.rent=rentPrice(o);
  if(t==='friche'||t==='bois')f.wild=t;
  if(t==='prairie')f.per={k:'prairie',age:YD,pruned:false,hk:-1};
  S.fields.push(f);ensureCells();
  return 'ok';
}
function sellField(id){
  const i=fIdx(id),f=S.fields[i];if(!f)return 'none';
  if(f.rent)return 'rented';
  if(S.fields.length<=1)return 'last';
  if(f.job||f.c||f.cv)return 'busy';
  const v=fieldValue(f);S.cash+=v;S.cat.invest=(S.cat.invest||0)+v;
  releaseCells('f'+f.id);S.fields.splice(i,1);return 'ok';
}
function returnField(id){
  const i=fIdx(id),f=S.fields[i];if(!f||!f.rent)return 'none';
  if(S.fields.length<=1)return 'last';
  if(f.job||f.c||f.cv)return 'busy';
  releaseCells('f'+f.id);S.fields.splice(i,1);return 'ok';
}
function splitField(id,ha){
  const f=fById(id);if(!f)return 'none';
  if(!idle(f))return 'busy';
  if(f.rent)return 'rented';
  if(S.fields.length>=MAXF)return 'maxland';
  ha=r5(ha);if(ha<MINHA-.001||f.ha-ha<MINHA-.001)return 'small';
  if(!pay(40))return 'cash';
  f.ha=r5(f.ha-ha);
  const n=mkField(S.fid++,freeName(),ha,f.soil,f.hum,f.str);
  n.wd=f.wd;n.last=f.last;n.u=f.u;n.hy=f.hy.slice();n.am=f.am;n.rent=f.rent?Math.round(f.rent*ha/(f.ha+ha)):0;if(f.rent)f.rent-=n.rent;
  S.fields.splice(fIdx(id)+1,0,n);cutCells(f.id,n.id,Math.round(ha*2));ensureCells();return 'ok';
}
function mergeCompat(x,y){
  if(x.job||y.job)return false;
  if(idle(x)&&idle(y))return true;
  if(x.c&&y.c&&x.c===y.c)return true;
  if(x.per&&y.per&&x.per.k===y.per.k)return true;
  return false;
}
function mergeFields(a,b){
  const x=fById(a),y=fById(b);if(!x||!y||x===y)return 'none';
  if(!mergeCompat(x,y))return 'busy';
  if(x.u!==y.u||!!x.rent!==!!y.rent)return 'mixed';
  if(x.ha+y.ha>MAXFHA+.001)return 'big';
  if(!adjacentF(a,b))return 'far';
  if(!pay(60))return 'cash';
  const t=x.ha+y.ha,wa=x.ha/t,wb=y.ha/t;
  x.hum=Math.round((x.hum*x.ha+y.hum*y.ha)/t);x.str=Math.round((x.str*x.ha+y.str*y.ha)/t);
  if(x.c){x.a=x.a*wa+y.a*wb;x.wet=x.wet*wa+y.wet*wb;x.dmg=(x.dmg||0)*wa+(y.dmg||0)*wb;x.over=Math.max(x.over||0,y.over||0)}
  if(x.per){x.per.age=Math.round(x.per.age*wa+y.per.age*wb);x.per.pruned=!!(x.per.pruned&&y.per.pruned);x.per.hk=Math.min(x.per.hk,y.per.hk);x.dmg=Math.max(x.dmg||0,y.dmg||0)}
  if(y.ha>x.ha)x.soil=y.soil;
  x.rent=(x.rent||0)+(y.rent||0);x.ha=r5(t);x.wd=Math.max(x.wd,y.wd);x.wp=0;if(x.last!==y.last)x.last=null;x.hy=x.hy.concat(y.hy).slice(0,4);
  for(let i=0;i<S.cown.length;i++)if(S.cown[i]==='f'+b)S.cown[i]='f'+a;
  S.fields.splice(fIdx(b),1);return 'ok';
}
function adjPairs(){
  const T=terr(),own=S.cown,seen=new Set(),out=[];
  for(let i=0;i<own.length;i++){const t=own[i];if(!t||t[0]!=='f')continue;
    for(const j of T.cells[i].nb){const u=own[j];if(!u||u[0]!=='f'||u===t)continue;const a=+t.slice(1),b=+u.slice(1),k=a<b?a+'-'+b:b+'-'+a;if(!seen.has(k)){seen.add(k);out.push([a,b])}}}
  return out;
}
function mergeOk(a,b){return !!a&&!!b&&mergeCompat(a,b)&&a.u===b.u&&!!a.rent===!!b.rent&&a.ha+b.ha<=MAXFHA+.001}
function mergeCandidates(){return adjPairs().filter(p=>mergeOk(fById(p[0]),fById(p[1])))}
function autoMerge(){
  let n=0,why='';
  for(let g=0;g<200;g++){
    const c=mergeCandidates();if(!c.length)break;
    c.sort((p,q)=>(fById(p[0]).ha+fById(p[1]).ha)-(fById(q[0]).ha+fById(q[1]).ha));
    const r=mergeFields(c[0][0],c[0][1]);
    if(r!=='ok'){why=r;break}
    n++;
  }
  return {n,why};
}

/* --- marché --- */
function sellOne(id){
  if(!(S.stock[id]>0))return 0;
  const p=Math.round(price(id)*(mOk('camion')?lvv('camion','s'):1));S.stock[id]--;earn('ventes',p);
  if(mOk('camion'))S.mach.camion.wear=Math.min(100,S.mach.camion.wear+.1*wearF('camion'));
  S.mk[id].m=clamp(S.mk[id].m*.985,.45,1.7);S.stats.sold++;
  return p;
}
function sellMany(id,n){let t=0,k=0;while(k<n&&S.stock[id]>0){t+=sellOne(id);k++}return {t,k}}

/* ===== marchés vivants ===== */
const RIVALS=['la ferme Dubois','le GAEC des Trois Chênes','la coopérative du Val','le domaine Marchand','les maraîchers de la plaine','la ferme des Lilas'];
const OUTS={
  loc:{n:'Marché local',tx:'Cours du jour, mais chaque vente le fait baisser pour tous.'},
  gro:{n:'Grossiste',tx:'Paie 10 % de moins mais absorbe de gros volumes sans écraser le marché local.'},
  eta:{n:'Étal à la ferme',tx:'Vente directe : paie mieux, mais le nombre de clients par jour est limité. Votre réputation l’augmente.'},
  exp:{n:'Négoce export',tx:'Paie une prime sur les denrées recherchées ce trimestre, en volume limité.'}
};
const OUTK=['loc','gro','eta','exp'];
function rgEff(s){return 1+(s.m-1)*Math.min(1,s.left/3)}
function rgF(id){
  const r=S&&S.rg;if(!r)return 1;
  let f=1;const g=G[id];
  if(r[id])f*=rgEff(r[id]);
  if(g&&r[g.cat])f*=rgEff(r[g.cat]);
  return clamp(f,.6,1.5);
}
function mnews(t,k,id){
  if(!S.mn)S.mn=[];
  S.mn.unshift({t,k:k||'',id:id||'',d:S.day,s:S.season,y:S.year});
  if(S.mn.length>14)S.mn.pop();
  say(t,k==='up'?'good':k==='down'?'bad':'news');
}
function relevantGoods(){
  const s=new Set();
  for(const id in S.stock)if(S.stock[id]>0&&G[id])s.add(id);
  for(const f of S.fields){if(f.c)s.add(f.c);if(f.per){const P=PER[f.per.k];if(P.good)s.add(P.good)}}
  for(const k of ANIMK)if(inB(k).length)for(const g of SPEC[k].goods)s.add(g);
  return [...s].filter(id=>G[id]);
}
function newShock(){
  const rel=relevantGoods(),all=Object.keys(G).filter(id=>G[id].cat!=='bois');
  const pool=rel.length&&Math.random()<.6?rel:all;
  const id=pick(pool);if(S.rg[id])return;
  const n=G[id].n.toLowerCase(),kind=pick(['surplus','surplus','penurie','boom','mode']);
  let m,left,t,k;
  if(kind==='surplus'){m=rnd(.76,.9);left=Math.floor(rnd(8,16));t=pick(RIVALS)+' écoule beaucoup de '+n+' : les cours reculent.';k='down'}
  else if(kind==='penurie'){m=rnd(1.14,1.3);left=Math.floor(rnd(8,15));t='Pénurie régionale de '+n+' : les cours montent.';k='up'}
  else if(kind==='boom'){m=rnd(1.1,1.22);left=Math.floor(rnd(10,20));t='Forte demande de '+n+' dans la région : les cours montent.';k='up'}
  else{m=rnd(.84,.92);left=Math.floor(rnd(10,20));t='La demande de '+n+' faiblit : les cours fléchissent.';k='down'}
  S.rg[id]={m:+m.toFixed(3),left,tot:left,kind,t};
  mnews(t,k,id);
}
function genExd(){
  const ids=Object.keys(G).filter(id=>['gra','leg','fru','art'].includes(G[id].cat));
  const rel=relevantGoods().filter(id=>ids.includes(id));
  const pickN=[];
  const pool=rel.concat(ids);
  while(pickN.length<3){const id=pick(pool);if(!pickN.includes(id))pickN.push(id)}
  S.exd={};
  for(const id of pickN)S.exd[id]={p:+rnd(1.1,1.28).toFixed(2)};
  mnews('Négoce export : forte demande de '+pickN.map(id=>G[id].n.toLowerCase()).join(', ')+' ce trimestre.','info');
}
function marketDay(){
  if(!S.rg)S.rg={};if(!S.exd)S.exd={};
  for(const k in S.rg){const s=S.rg[k];s.left--;if(s.left<=0)delete S.rg[k]}
  if(Object.keys(S.rg).length<4&&Math.random()<.14)newShock();
  if(S.day===1||!Object.keys(S.exd).length)genExd();
  S.oc={};
  for(const id in G){const m=S.mk[id];const g=m.g==null?1:m.g;m.g=g+(1-g)*.25}
}
const repu=()=>{const v=CLIENTS.map(c=>S.cl[c.id].rel);return v.reduce((a,b)=>a+b,0)/Math.max(1,v.length)/100};
function outInfo(o,id){
  let f=1,cap=Infinity,ok=true,why='';
  if(o==='gro')f=.9;
  if(o==='eta'){f=1.1+repu()*.1;cap=3+Math.round(repu()*9)}
  if(o==='exp'){const e=S.exd&&S.exd[id];if(!e){ok=false;why='Pas de demande'}else{f=e.p;cap=24}}
  const used=(S.oc&&S.oc[o+id])||0;
  return {f,cap,ok,why,left:cap===Infinity?Infinity:Math.max(0,cap-used)};
}
const baseNoMk=id=>G[id].base*seasonF(id)*eventF(id)*macroF(id)*dif().px;
function unitVia(o,id,mult){return Math.max(1,Math.round(baseNoMk(id)*outInfo(o,id).f*mult))}
function estVia(o,id,n){
  if(o==='loc')return est(id,n);
  const inf=outInfo(o,id);if(!inf.ok)return 0;
  n=Math.min(n,S.stock[id]||0,inf.left===Infinity?n:inf.left);
  let g=o==='gro'?(S.mk[id].g==null?1:S.mk[id].g):1,t=0;
  for(let k=0;k<n;k++){t+=Math.max(1,Math.round(baseNoMk(id)*inf.f*g));if(o==='gro')g=clamp(g*.997,.5,1.2)}
  return t;
}
function sellVia(o,id,n){
  if(o==='loc'||!OUTS[o])return sellMany(id,n);
  const inf=outInfo(o,id);
  if(!inf.ok)return {t:0,k:0,why:'noex'};
  n=Math.min(n,S.stock[id]||0,inf.left===Infinity?n:inf.left);
  if(n<=0)return {t:0,k:0,why:(S.stock[id]||0)>0?'cap':'none'};
  const m=S.mk[id];let t=0,k=0;
  for(;k<n;k++){
    const g=o==='gro'?(m.g==null?1:m.g):1;
    const p=Math.max(1,Math.round(baseNoMk(id)*inf.f*g));
    S.stock[id]--;earn('ventes',p);t+=p;S.stats.sold++;
    if(o==='gro')m.g=clamp(g*.997,.5,1.2);
  }
  S.oc[o+id]=(S.oc[o+id]||0)+k;
  return {t,k};
}
function priceAt(id,season,day){
  const s0=S.season,d0=S.day;S.season=season;S.day=day;
  let p;try{p=Math.max(1,Math.round(G[id].base*seasonF(id)*macroF(id)*dif().px))}finally{S.season=s0;S.day=d0}
  return p;
}
const nextSeasonPrice=id=>priceAt(id,(S.season+1)%4,1);

/* ===== statistiques pour le bilan ===== */
function fst(f,y){y=y||S.year;if(!f.sy)f.sy={};return f.sy[y]||(f.sy[y]={v:0,c:0})}
const fval=(f,v)=>{if(v>0)fst(f).v+=v};
const fcost=(f,v,y)=>{if(v>0)fst(f,y).c+=v};
function ast(sp,y){y=y||S.year;if(!S.as)S.as={};const Y=S.as[y]||(S.as[y]={});return Y[sp]||(Y[sp]={v:0,f:0,c:0,s:0,b:0})}
function wst(rid){
  if(!S.wk)S.wk={};const Y=S.wk[S.year]||(S.wk[S.year]={v:0,c:0,n:0,r:{}});
  if(!rid)return Y;
  return Y.r[rid]||(Y.r[rid]={v:0,c:0,n:0});
}
const PSP={oeuf:'poule',lait:'vache',lait_c:'chevre',laine:'mouton',miel:'ruche'};
function pruneStats(){
  const lim=S.year-3;
  for(const f of S.fields)if(f.sy)for(const y in f.sy)if(+y<lim)delete f.sy[y];
  for(const k of ['as','wk','yc'])if(S[k])for(const y in S[k])if(+y<lim)delete S[k][y];
}
function fieldMargin(f,y){const x=(f.sy&&f.sy[y||S.year])||{v:0,c:0};return {v:x.v,c:x.c,m:x.v-x.c,ha:x.v-x.c>0||x.v||x.c?(x.v-x.c)/f.ha:0}}
function herdMargin(sp,y){const a=(S.as&&S.as[y||S.year]&&S.as[y||S.year][sp])||{v:0,f:0,c:0,s:0,b:0};return Object.assign({m:a.v+a.s-a.f-a.c},a)}

/* ===== alertes ===== */
function advice(){
  const A=[];const add=(sev,t,go)=>A.push({sev,t,go:go||''});
  const left=SD-S.day+1,fp=feedPlan();
  if(fp.hay>0){
    const days=S.feed/fp.hay;
    if(!S.autoFeed&&days<4)add(days<2?2:1,'Foin pour '+Math.max(0,Math.floor(days))+' jour(s) seulement : achetez du fourrage ou activez l’achat auto.','herd');
  }
  const sick=S.herd.filter(a=>a.sk).length;
  if(sick)add(sick>=3?2:1,sick+' bête(s) malade(s) : soignez-les avant que ça se propage.','herd');
  for(const sp of ANIMK){
    const cap=capOf(sp);if(cap&&inB(sp).length>=cap&&sp!=='ruche')add(0,SPEC[sp].n+' : le bâtiment est plein, agrandissez-le pour continuer à élever.','herd');
  }
  const t=storage();
  if(t.dry>0&&t.du/t.dry>.92)add(1,'Hangar presque plein ('+Math.round(t.du/t.dry*100)+' %) : vendez ou agrandissez.','market');
  const ex=Object.keys(t.expo||{});
  if(ex.length)add(2,'Faute de froid, des denrées risquent de pourrir : '+ex.map(k=>G[k].n.toLowerCase()).join(', ')+'.','market');
  let ready=0,over=0,lowH=0;
  for(const f of S.fields){
    if(f.c&&!f.job&&f.a>=CROPS[f.c].g){ready+=f.ha;if((f.over||0)>0)over+=f.ha}
    if(!f.c&&!f.per&&!f.wild&&f.hum<22&&!f.cv)lowH++;
  }
  if(over>0)add(2,fmtHa(over)+' ha mûrs depuis plusieurs jours : le rendement baisse chaque jour.','map');
  else if(ready>0)add(0,fmtHa(ready)+' ha prêts à récolter.','map');
  if(lowH)add(0,lowH+' champ(s) au sol appauvri : un engrais vert ou du fumier s’impose.','map');
  for(const o of S.orders){
    const have=S.stock[o.item]||0;
    if(o.left<=1){
      if(have>=o.qty)add(1,'Commande à livrer aujourd’hui ou demain : '+o.qty+' × '+G[o.item].n.toLowerCase()+'.','orders');
      else add(1,'Une commande de '+G[o.item].n.toLowerCase()+' expire : il manque '+(o.qty-have)+'.','orders');
    }
  }
  if(left<=3)for(const c of S.sup){const have=S.stock[c.item]||0;if(have<c.qty)add(2,'Contrat de livraison en fin de saison : il manque '+(c.qty-have)+' × '+G[c.item].n.toLowerCase()+'.','orders')}
  /* charges de fin de saison */
  let fixed=S.fields.reduce((a,f)=>a+(f.rent||0),0);
  if(S.ins.clim)fixed+=insPrem('clim');if(S.ins.mach&&Object.keys(S.mach).length)fixed+=insPrem('mach');if(S.ins.bet&&S.herd.length)fixed+=insPrem('bet');
  for(const l of S.leases)fixed+=l.pay;
  fixed+=Math.round(S.debt*S.rate/100)+Math.round(ownedHa()*12);
  fixed+=S.workers*WAGE*dif().wage*left;
  if(fixed>0&&S.cash<fixed)add(2,'Trésorerie inférieure aux charges de fin de saison (≈ '+eur(fixed)+').','books');
  else if(fixed>0&&S.cash<fixed*1.6)add(1,'Charges de fin de saison à prévoir : ≈ '+eur(fixed)+'.','books');
  let tips=0;
  for(const id in S.stock){
    const n=S.stock[id];if(n<5||!G[id]||tips>=2)continue;
    const p=price(id);
    if(p>=G[id].base*1.22){add(0,G[id].n+' : cours élevé ('+eur(p)+'), bon moment pour vendre.','market');tips++}
    else if(!FRESH[id]&&n>=8&&nextSeasonPrice(id)>=p*1.18){add(0,G[id].n+' : le cours devrait monter la saison prochaine, gardez-le au sec.','market');tips++}
  }
  A.sort((a,b)=>b.sev-a.sev);
  return A;
}
function orderCandidates(){
  const c=[];
  for(const id in CROPS)if(CROPS[id].s.includes(S.season))c.push(id);
  for(const f of S.fields)if(f.per){const P=PER[f.per.k];if(P.good&&P.s.includes(S.season)&&perYears(f)>=P.first)c.push(P.good)}
  if(S.stock.bois>0)c.push('bois');
  for(const k of ANIMK)if(S.an[k]>0)for(const g of SPEC[k].goods)c.push(g);
  if(S.slots.length){
    if(S.an.vache>0){c.push('fromage');c.push('beurre')}
    if(S.an.chevre>0)c.push('fromage_c');
    if(S.an.porc>0)c.push('saucisson');
    if(S.an.ruche>0)c.push('epices');
    if(S.season===0||S.stock.fraise>0)c.push('confiture');
    if(S.season===2||S.stock.ble>0)c.push('pain');
    if(S.stock.raisin>0)c.push('vin');
    
    if(S.an.mouton>0)c.push('pull');
  }
  return c;
}
function genOrder(){
  const c=orderCandidates();if(!c.length)return;
  const opts=CLIENTS.filter(cl=>cl.likes.some(x=>c.includes(x)));
  if(!opts.length)return;
  const cl=pick(opts),id=pick(cl.likes.filter(x=>c.includes(x))),b=G[id].base;
  const q=clamp(Math.round(260/b*rnd(.7,1.3)),2,14);
  const rel=S.cl[cl.id].rel;
  S.orders.push({id:S.oid++,item:id,qty:q,reward:Math.round(q*b*rnd(1.3,1.65)*(1+rel/400)),left:Math.floor(rnd(5,10)),cl:cl.id});
}
function deliver(oid){
  const o=S.orders.find(x=>x.id===oid);
  if(!o||(S.stock[o.item]||0)<o.qty)return false;
  if(mOk('camion')){o.reward=Math.round(o.reward*lvv('camion','o'));S.mach.camion.wear=Math.min(100,S.mach.camion.wear+1*wearF('camion'))}
  S.stock[o.item]-=o.qty;earn('commandes',o.reward);S.stats.delivered++;
  S.orders=S.orders.filter(x=>x!==o);
  if(o.cl)addRel(o.cl,6+(o.left>=3?2:0));
  return o;
}

/* --- fêtes de saison --- */
function festToday(){return S.day===FEST_DAY?FEST[S.season]:null}
function festKey(){return S.year+'-'+S.season}
function festOpen(){return !!festToday()&&S.festDone!==festKey()}
function festEligible(){
  const f=festToday();if(!f)return 0;
  let n=0;for(const id in S.stock)if(S.stock[id]>0&&f.cats.includes(G[id].cat))n+=S.stock[id];
  return n;
}
function festGive(){
  const f=festToday();if(!f||S.festDone===festKey())return 0;
  let got=0;
  const ids=Object.keys(S.stock).filter(id=>S.stock[id]>0&&f.cats.includes(G[id].cat)).sort((a,b)=>G[a].base-G[b].base);
  for(const id of ids){
    while(S.stock[id]>0&&S.festGot<f.need){
      const p=Math.round(price(id)*1.3);
      S.stock[id]--;S.festGot++;got++;earn('commandes',p);
    }
  }
  if(S.festGot>=f.need){
    S.festDone=festKey();earn('primes',150);
    for(const c of CLIENTS)addRel(c.id,4);
    say(f.n+' : objectif atteint, +150 € et la sympathie du village.','good');
  }
  return got;
}

/* --- aléas à choix --- */
function alertHa(a){
  let ha=0;
  for(const f of S.fields){
    const prod=fruitP(f);
    if(a.id==='gel'){if((f.c&&!hardy(f.c)&&f.u!=='serre')||prod)ha+=f.ha}
    else if(f.c||prod)ha+=f.ha;
  }
  return ha;
}
function alertCost(){
  const a=S.alert;if(!a)return 0;
  if(a.id==='drought')return 120;
  return Math.round(alertHa(a)*(a.id==='gel'?16:12)*(a.id==='pests'&&mOk('pulve')?.5:1));
}
function resolveAlert(choice){
  const a=S.alert;if(!a||a.res)return 'none';
  if(choice==='protect'||choice==='treat'||choice==='cistern'){
    if(!pay(alertCost(),'aleas'))return 'cash';
    a.res=choice;
    if(choice==='cistern'){S.cistern=3;for(const f of S.fields)f.wet=1}
  }else a.res='risk';
  return 'ok';
}
function applyAlert(){
  const a=S.alert;if(!a)return;
  const k=S.ins.clim?.5:1;let n=0,ha=0;
  if(a.id==='gel'){
    if(a.res==='protect')say('Les voiles ont sauvé vos cultures du gel.','good');
    else{
      for(const f of S.fields){
        if(((f.c&&!hardy(f.c)&&f.u!=='serre')||fruitP(f))&&Math.random()<.55){f.dmg=Math.min(.7,(f.dmg||0)+.35*k);n++;ha+=f.ha}
      }
      say(n?'Le gel a abîmé '+n+' champ(s) : rendement en baisse.':'Le gel n’a rien abîmé cette fois.',n?'bad':'');
    }
  }else if(a.id==='pests'){
    if(a.res==='treat')say('Le traitement a repoussé les '+a.sub+'.','good');
    else{
      for(const f of S.fields){
        if((f.c||fruitP(f))&&Math.random()<(f.u==='serre'?.15:.5)){f.dmg=Math.min(.7,(f.dmg||0)+.25*k);n++;ha+=f.ha}
      }
      say(n?'Les '+a.sub+' ont attaqué '+n+' champ(s) : rendement en baisse.':'Les '+a.sub+' ont fait peu de dégâts.',n?'bad':'');
    }
  }
  if(S.ins.clim&&ha>0){const p=Math.round(ha*55);earn('assurances',p);say('Votre assurance climatique vous verse '+eur(p)+'.','good')}
  S.alert=null;
}
function rollAlert(){
  if(S.alert||S.drought>0)return;
  const planted=S.fields.filter(f=>f.c||fruitP(f));
  if(!planted.length||Math.random()>.16*dif().ev)return;
  const opts=[];
  if(planted.some(f=>f.per||(f.c&&!hardy(f.c)))&&((S.season===0&&S.day>=9)||(S.season===2&&S.day>=10)))opts.push('gel');
  if((S.season===1||S.season===2)&&S.day>=3)opts.push('pests');
  if(S.season===1)opts.push('drought');
  if(!opts.length)return;
  const id=pick(opts);
  if(id==='drought'){
    S.drought=3;if(S.weather==='rain')S.weather='sun';
    if(S.ins.clim){const pha=S.fields.reduce((x,f)=>x+((f.c||fruitP(f))?f.ha:0),0),pp=Math.round(pha*14);if(pp>0){earn('assurances',pp);say('Sécheresse : votre assurance vous verse '+eur(pp)+'.','good')}}
    if(S.b.irrig){say('Sécheresse annoncée : votre goutte-à-goutte protège la ferme.','good');return}
  }
  S.alert={id,res:null,sub:id==='pests'?(S.season===1?'pucerons':'limaces'):''};
}

/* --- investissements --- */
function buyIrrig(){
  if(S.b.irrig)return 'have';if(!pay(IRRIG))return 'cash';
  S.b.irrig=true;for(const f of S.fields)f.wet=1;return 'ok';
}
function buyCold(){const n=(S.coldL||0)+1;if(n>=COLDM.length)return 'max';if(!pay(COLDC[n]))return 'cash';S.coldL=n;return 'ok'}
function buyCap(){const n=S.capL+1;if(n>=CAPS.length)return 'max';if(!pay(CAPC[n]))return 'cash';S.capL=n;S.cap=CAPS[n];return 'ok'}
function buyEn(){const n=S.eL+1;if(n>=ENR.length)return 'max';if(!pay(ENC[n]))return 'cash';S.eL=n;S.maxE=ENR[n];S.energy+=ENR[n]-ENR[n-1];return 'ok'}
function buyB(k){if(S.b[k])return 'have';if(!pay(BLD[k].cost))return 'cash';S.b[k]=true;if(HCAP[k]){if(!S.bl)S.bl={};S.bl[k]=1}return 'ok'}
function buyAtelier(){if(S.slots.length)return 'have';if(!pay(ATELIER))return 'cash';S.slots=[null,null];return 'ok'}
function buySlot(){const n=S.slots.length;if(n<2||n>=4)return 'max';if(!pay(SLOTC[n]))return 'cash';S.slots.push(null);return 'ok'}
/* ===== élevage : animaux individuels ===== */
const herd=()=>S.herd;
const brOf=a=>BR[a.sp][a.br]||BR[a.sp][Object.keys(BR[a.sp])[0]];
const animById=id=>S.herd.find(a=>a.id===id);
const inB=sp=>S.herd.filter(a=>a.sp===sp);
const lvlOf=b=>(S.bl&&S.bl[b])||(S.b[b]?1:0);
const capOf=sp=>{const b=SPEC[sp].b,l=lvlOf(b);return l?HCAP[b][l-1]:0};
function recount(){for(const k of ANIMK)S.an[k]=inB(k).length}
const isAdult=a=>a.age>=SPEC[a.sp].adult;
function animAge(a){const P=SPEC[a.sp];if(a.sp==='ruche')return 1;if(a.age<P.adult)return 0;if(a.age<=P.prime)return 1;if(a.age<=P.life)return 1-.5*(a.age-P.prime)/(P.life-P.prime);return .3}
function valueOf(a){
  const P=SPEC[a.sp],B=brOf(a);let k;
  if(a.sp==='ruche')k=1;
  else if(a.age<P.adult)k=.3+.7*a.age/P.adult;
  else if(a.age<=P.prime)k=1;
  else k=Math.max(.3,1-.7*(a.age-P.prime)/(P.life-P.prime));
  if(a.sx==='M'&&a.sp!=='ruche')k*=.8;
  return P.price*B.v*k*(.6+.4*a.hp/100)*(.75+.25*a.gn)*(a.pg?1.08:1)*(a.sk?.6:1);
}
const sellPrice=a=>Math.round(valueOf(a)*.85*S.lm);
const herdValue=()=>S.herd.reduce((t,a)=>t+valueOf(a),0);
function meatUnits(a){
  const P=SPEC[a.sp];if(!P.meat)return 0;
  const w=clamp(a.age/Math.max(1,P.adult),.1,1.1);
  return Math.max(0,Math.round(P.meat.u*w*(.6+.4*a.hp/100)*brOf(a).m*10)/10);
}
function nameFor(sp){
  const L=NAMES[sp],used=new Set(S.herd.filter(a=>a.sp===sp).map(a=>a.nm));
  for(const n of L)if(!used.has(n))return n;
  let i=2;while(true){for(const n of L){const m=n+' '+i;if(!used.has(m))return m}i++}
}
function mkAnimal(sp,br,sx,age,gn,hp){
  const P=SPEC[sp];
  const a={id:S.hid++,sp,br,nm:nameFor(sp),sx,age,hp:hp==null?90:hp,gn:gn||1,pg:null,lt:-1,wk:Math.floor(Math.random()*(P.every||1)),sk:0,acc:0,rs:0};
  return a;
}
function roomFor(sp){return capOf(sp)-inB(sp).length}
function addAnimal(a){S.herd.push(a);recount()}
function catPrice(sp,br,sx){const P=SPEC[sp];return Math.round(P.price*BR[sp][br].v*1.28*(sx==='M'?.8:1))}
function buyCat(sp,br,sx){
  const P=SPEC[sp];if(!S.b[P.b])return 'nob';if(roomFor(sp)<=0)return 'max';
  const c=catPrice(sp,br,sx);if(!pay(c))return 'cash';
  const a=mkAnimal(sp,br,sx,P.adult,1,92);
  ast(sp).b+=c;addAnimal(a);return 'ok';
}
function buyAnimal(k){return buyCat(k,Object.keys(BR[k])[k==='vache'?1:0],'F')}
function upBld(b){
  const l=lvlOf(b);if(!S.b[b])return 'nob';if(l>=HCAP[b].length)return 'max';
  if(!pay(HUP[b][l]))return 'cash';S.bl[b]=l+1;return 'ok';
}
function sellAnimal(id){
  const a=animById(id);if(!a)return 'none';
  const p=sellPrice(a);earn('elevage',p);ast(a.sp).s+=p;S.herd.splice(S.herd.indexOf(a),1);recount();return 'ok';
}
function slaughter(id){
  const a=animById(id);if(!a)return 'none';
  const P=SPEC[a.sp];if(!P.meat)return 'none';
  if(a.age<P.adult*.5)return 'young';
  const u=meatUnits(a),n=Math.max(1,Math.round(u));
  if(free(P.meat.g)<n)return 'full';
  addStock(P.meat.g,n);LASTSL={n,g:P.meat.g};ast(a.sp).v+=n*price(P.meat.g);
  S.herd.splice(S.herd.indexOf(a),1);recount();return 'ok';
}
let LASTSL=null;
const careCost=a=>Math.round(CARE[a.sp]*(S.vet?.5:1));
function treat(id){
  const a=animById(id);if(!a)return 'none';if(!a.sk)return 'healthy';
  if(!pay(careCost(a),'veto'))return 'cash';
  ast(a.sp).c+=careCost(a);a.sk=0;a.hp=Math.min(100,a.hp+8);return 'ok';
}
function treatAll(sp){
  const sick=S.herd.filter(a=>a.sp===sp&&a.sk);if(!sick.length)return 'healthy';
  let c=0;for(const a of sick)c+=careCost(a);
  if(!pay(c,'veto'))return 'cash';
  for(const a of sick)ast(a.sp).c+=careCost(a);
  for(const a of sick){a.sk=0;a.hp=Math.min(100,a.hp+8)}
  return 'ok';
}
function sireOf(sp){
  let best=null;
  for(const m of S.herd)if(m.sp===sp&&m.sx==='M'&&isAdult(m)&&!m.sk&&m.hp>=50&&animAge(m)>.3)if(!best||m.gn>best.gn)best=m;
  return best;
}
const breedCost=(sp,mode)=>sireOf(sp)?0:Math.round(SPEC[sp].ai*(mode==='pre'?2.6:1));
function breed(id,mode,quiet){
  const a=animById(id);if(!a)return 'none';
  const P=SPEC[a.sp];
  if(a.sx!=='F'||a.sp==='ruche')return 'male';
  if(!isAdult(a)||a.age>P.life)return 'young';
  if(a.pg)return 'gest';if(a.rs>0)return 'rest';if(a.sk||a.hp<40)return 'sick';
  const sire=sireOf(a.sp),c=breedCost(a.sp,mode);
  if(c>0&&!pay(c,'veto'))return 'cash';
  if(c>0)ast(a.sp).c+=c;
  a.pg={left:P.gest,gn:sire?sire.gn:(mode==='pre'?1.18:1),br:sire&&Math.random()<.5?sire.br:a.br};
  return 'ok';
}
function breedAll(sp,mode){
  let n=0,why='';
  for(const a of inB(sp)){
    if(a.sx!=='F'||a.pg||a.rs>0||!isAdult(a)||a.sk||a.hp<60||a.age>SPEC[sp].prime*1.15)continue;
    const pend=inB(sp).filter(x=>x.pg).length;
    if(inB(sp).length+pend*SPEC[sp].litter[1]>capOf(sp)+2)break;
    const r=breed(a.id,mode);if(r==='ok')n++;else if(r==='cash'){why='cash';break}
  }
  return {n,why};
}
function giveBirth(a){
  const P=SPEC[a.sp],pg=a.pg;a.pg=null;a.rs=P.rest;
  const n=P.litter[0]+Math.floor(Math.random()*(P.litter[1]-P.litter[0]+1)+(a.hp>85&&P.litter[1]>2&&Math.random()<.3?1:0));
  let kept=0,sold=0,died=0;
  for(let i=0;i<n;i++){
    if(Math.random()<.035*(1+(100-a.hp)/40)){died++;continue}
    if(inB(a.sp).length>=capOf(a.sp)){sold++;earn('elevage',Math.round(P.price*.2*S.lm));continue}
    const k=mkAnimal(a.sp,pg.br||a.br,Math.random()<.5?'F':'M',0,clamp((a.gn+pg.gn)/2+rnd(-.06,.06),.7,1.4),85);
    S.herd.push(k);kept++;
  }
  if(P.lact){a.lt=0}
  a.hp=Math.max(30,a.hp-6);
  recount();
  let m=a.nm+' ('+P.one+') met bas : '+kept+' petit(s)';
  if(sold)m+=', '+sold+' vendu(s) faute de place';if(died)m+=', '+died+' mort(s)-né(s)';
  say(m+'.',died&&!kept?'bad':'good');
}
/* nourriture : herbe, foin, grain */
const pastureHa=()=>S.fields.reduce((t,f)=>t+(f.per&&f.per.k==='prairie'?f.ha:0),0);
function needOf(a){
  const P=SPEC[a.sp],B=brOf(a);
  if(a.sp==='ruche')return S.season===3?P.feed*3:P.feed;
  let k=P.feed*B.f;
  if(a.age<P.adult)k*=.4+.6*a.age/Math.max(1,P.adult);
  if(a.lt>=0&&P.lact&&a.lt<P.lact)k*=1.25;
  if(a.pg)k*=1.1;
  return k;
}
function feedPlan(){
  let nb=0,bee=0;
  for(const a of S.herd){const n=needOf(a);if(a.sp==='ruche')bee+=n;else nb+=n}
  const past=Math.min(nb,pastureHa()*5*PASTF[S.season]),hay=nb-past+bee;
  return {nb,bee,total:nb+bee,past,hay};
}
function herdTick(){
  if(!S.herd.length){return}
  const sea=S.season;
  /* temps */
  for(const a of S.herd){a.age++;if(a.rs>0)a.rs--;if(a.lt>=0)a.lt++;if(a.pg)a.pg.left--;if(a.sp==='mouton')a.wk++}
  /* nourriture */
  const fp=feedPlan();let fr=1;
  if(fp.total>0){
    if(S.feed<fp.hay&&S.autoFeed){
      const n=Math.min(Math.ceil(fp.hay-S.feed),Math.floor(Math.max(0,S.cash)/FEED_P));
      if(n>0){spend('fourrage',n*FEED_P);S.feed+=n}
    }
    const hay=Math.min(S.feed,fp.hay);S.feed=Math.max(0,S.feed-hay);
    fr=(fp.past+hay)/fp.total;
    if(fp.hay>0){const ns={};for(const a of S.herd)ns[a.sp]=(ns[a.sp]||0)+needOf(a);for(const sp in ns)ast(sp).f+=ns[sp]/fp.total*fp.hay*FEED_P}
    if(fr<.98)say('Fourrage insuffisant : les bêtes reçoivent '+Math.round(fr*100)+' % de leurs besoins.','bad');
  }
  let boost=1;
  if(S.ration==='riche'&&fp.nb>0){
    const g=fp.nb*.2;let t=0;
    for(const id of ['ble','mais','feverole','patate']){const take=Math.min(S.stock[id]||0,g-t);if(take>0){S.stock[id]-=take;t+=take}if(t>=g-1e-6)break}
    boost=1+.12*(t/g);
  }
  /* santé */
  const dead=[],sickNew={};
  for(const sp of ANIMK){
    const L=inB(sp);if(!L.length)continue;
    const vac=!!S.vacc[sp];
    const avg=L.reduce((t,a)=>t+a.hp,0)/L.length,hard=L.reduce((t,a)=>t+brOf(a).h,0)/L.length;
    const crowd=Math.max(0,L.length/Math.max(1,capOf(sp))-.75)*4;
    const sick=L.filter(a=>a.sk);
    if(!sick.length){
      const p=.0022*(1+crowd)*(vac?.15:1)*(S.vet?.75:1)*(avg<65?1.8:1)*(sea===3?1.2:1)/hard;
      if(Math.random()<p){
        const k=Math.max(1,Math.ceil(L.length*.25));
        const pool=L.slice().sort(()=>Math.random()-.5).slice(0,k);
        for(const a of pool)a.sk=7;
        sickNew[sp]=k;
      }
    }else{
      for(const h of L)if(!h.sk&&Math.random()<.06*sick.length*(vac?.2:1)/brOf(h).h)h.sk=7;
    }
  }
  for(const sp in sickNew)say('Épidémie chez vos '+SPEC[sp].n.toLowerCase()+' : '+sickNew[sp]+' bête(s) malade(s). Soignez-les au plus vite.','bad');
  for(const a of S.herd){
    const B=brOf(a),P=SPEC[a.sp];
    let d=fr>=.95?1.2:fr>=.7?(fr-.8)*6:-(.8-fr)*14;
    if(boost>1&&d>0)d+=.5;
    if(a.sk){d-=5/B.h;a.sk--;if(a.sk<=0&&a.hp>0)a.sk=0}
    if(a.age>P.life)d-=2.5;
    a.hp=clamp(a.hp+d,0,100);
    if(a.hp<=0||(a.age>P.life*1.05&&Math.random()<.06))dead.push(a);
  }
  if(dead.length){
    let val=0;for(const a of dead)val+=valueOf(a);
    const names=dead.map(a=>a.nm).join(', ');
    S.herd=S.herd.filter(a=>!dead.includes(a));
    say(dead.length+' bête(s) morte(s) : '+names+'.','bad');
    if(S.ins.bet&&val>0){const p=Math.round(val*.6);earn('assurances',p);say('Votre assurance bétail vous verse '+eur(p)+'.','good')}
  }
  /* naissances */
  for(const a of S.herd.slice())if(a.pg&&a.pg.left<=0)giveBirth(a);
  /* production */
  const out={};
  for(const a of S.herd){
    const P=SPEC[a.sp],B=brOf(a);
    if(a.sk||a.hp<25)continue;
    const hpF=clamp((a.hp-20)/70,.2,1.1);
    if(a.sp==='ruche'){
      if(S.day===SD&&(sea===1||sea===2)){
        const orch=S.fields.reduce((t,f)=>t+(f.per&&!PER[f.per.k].hay?f.ha:0),0);
        const w=Math.round(P.qty*a.gn*B.p*hpF*(.7+Math.min(.6,orch*.08))*fr*(sea===1?1:.8));
        if(w>0)out.miel=(out.miel||0)+w;
      }
      continue;
    }
    if(!isAdult(a))continue;
    const pf=animAge(a)*a.gn*B.p*hpF*fr*boost;
    if(a.sp==='poule'&&a.sx==='F'){a.acc+=P.qty*pf*EGGS[sea];const w=Math.floor(a.acc);a.acc-=w;if(w>0)out.oeuf=(out.oeuf||0)+w}
    else if((a.sp==='vache'||a.sp==='chevre')&&a.sx==='F'&&a.lt>=0){
      if(a.lt<P.lact){a.acc+=P.qty*pf*(1.25-.7*a.lt/P.lact);const w=Math.floor(a.acc);a.acc-=w;if(w>0)out[P.prod]=(out[P.prod]||0)+w}
      else a.lt=-1;
    }else if(a.sp==='mouton'&&a.wk>=P.every){a.wk=0;const w=Math.max(0,Math.round(P.qty*pf*(a.sx==='M'?1.2:1)));if(w>0)out.laine=(out.laine||0)+w}
  }
  let lost=0;
  for(const id in out){
    const got=addStock(id,out[id]);lost+=out[id]-got;if(PSP[id]&&got>0)ast(PSP[id]).v+=got*price(id);
    if(got>0)say(got+' '+G[id].n.toLowerCase()+' récolté(s) à l’aube.');
  }
  if(lost>0)say('Stockage plein : '+lost+' produit(s) perdu(s).','bad');
  /* fumier */
  let man=0;for(const a of S.herd)man+=SPEC[a.sp].man*(a.age<SPEC[a.sp].adult?.5:1);
  S.manure=Math.min(150,S.manure+man);
  /* politiques automatiques */
  for(const sp of ANIMK){
    const pol=S.pol[sp]||{};if(sp==='ruche')continue;
    if(pol.br){
      const pend=inB(sp).filter(x=>x.pg).length;
      for(const a of inB(sp)){
        if(a.sx!=='F'||a.pg||a.rs>0||!isAdult(a)||a.sk||a.hp<60||a.age>SPEC[sp].prime*1.15)continue;
        if(inB(sp).length+pend*SPEC[sp].litter[1]>=capOf(sp))break;
        if(breedCost(sp,'std')>0&&S.cash<250)break;
        breed(a.id,'std');
      }
    }
    if(pol.cm){
      const L=inB(sp),P=SPEC[sp],keep=sireOf(sp);
      let females=L.filter(a=>a.sx==='F'&&isAdult(a)).length;
      for(const a of L){
        if(!P.meat)continue;
        const ripe=a.age>=P.adult*(sp==='poule'?1.2:.95),old=a.sx==='F'&&a.age>P.prime+.7*(P.life-P.prime);

          if(slaughter(a.id)!=='ok'){if(a.age>=P.adult)sellAnimal(a.id)}
        }
      }
    }
  }

    if(f.job&&f.job.k!=='harv'&&f.job.k!=='prune'){const r=work(i,JOBR[f.job.k],f.job.arg);if(r==='ok')cont+=LASTW.st}
  }

function morning(){
  S.energy=S.maxE;

    let w=S.weather==='rain'?1:0;
    if(S.b.irrig||S.cistern>0)w=1;
    f.wet=Math.max(w,f.kw||0);f.kw=0;
  }
  workersMorning();
  if(mOk('drone')){
    let budget=lvv('drone','v'),done=0;
    for(const f of S.fields){
      if(budget<=0)break;
      if(f.c&&f.wet<1&&f.a<CROPS[f.c].g){const take=Math.min(budget,f.ha*(1-f.wet));f.wet=Math.min(1,f.wet+take/f.ha);budget-=take;done+=take}
    }
    S.mach.drone.wear=Math.min(100,S.mach.drone.wear+1.2);
    if(done>0)say('Le drone a arrosé '+fmtHa(done)+' ha.');

function assets(){
  let land=0,per=0,mach=0;
  for(const f of S.fields){if(!f.rent)land+=Math.round(landPrice(f)*.8);if(f.per&&!PER[f.per.k].hay)per+=PER[f.per.k].cost*f.ha*.5}

function loanCap(kind){
  const a=assets(),out=S.loans.filter(l=>l.kind===kind).reduce((x,l)=>x+l.p,0);
  const base=kind==='equip'?a.mach+a.per+3000:a.land;
  return Math.max(0,Math.floor((base*.6-out)/100)*100);
}
const loanRate=kind=>+Math.max(1,kind==='equip'?S.rate*.9+.3:S.rate*.7+.2).toFixed(2);
function loanPay(kind,amt){const r=loanRate(kind)/100,n=LOAN[kind].seasons;return Math.round(amt*r/(1-Math.pow(1+r,-n)))}
function takeLoan(kind,amt){
  if(S.loans.length>=5)return 'max';

  S.loans.push({id:S.loanId++,kind,p:amt,r:loanRate(kind),pay:loanPay(kind,amt),left:LOAN[kind].seasons});
  S.cash+=amt;spend('frais',Math.round(amt*.01));S.stats.loans=(S.stats.loans||0)+1;return 'ok';
}

function endDay(){
  if(S.over)return;
  NIGHT=[];
  healJobs(true);
  if(S.day===SD){
    const pk=S.year*4+S.season;let lostFruit=0;
    for(const f of S.fields)if(f.per){
      const P=PER[f.per.k];
      if(P.s.includes(S.season)&&perYears(f)>=P.first&&f.per.hk!==pk){lostFruit++;f.per.hk=pk;f.dmg=0;if(f.job&&f.job.k==='harv')f.job=null}
    }
    if(lostFruit)say('Récolte perdue sur '+lostFruit+' champ(s) pérenne(s) ou prairie(s) non récolté(s).','bad');
  }
  S.t++;
  applyAlert();
  const wg=[.14,.12,.09,.03][S.season]+(S.weather==='rain'?.07:0);
  for(const f of S.fields){
    if(f.c){
      const g=CROPS[f.c].g;
      if(f.a<g){
        f.a=Math.min(g,f.a+f.wet);
        if(S.drought>0&&f.wet<.5&&f.a>0)f.a=Math.max(0,f.a-.5*(1-f.wet));
      }else f.over=(f.over||0)+1;
    }
    if(f.cv)f.cv.a=Math.min(12,f.cv.a+(S.season===3?.4:1));
    if(f.per)f.per.age++;
    f.kw=f.c?f.wet*retOf(f)*(S.drought>0?.5:1):0;
    f.wet=0;
    f.hum=Math.max(0,f.hum-.01*SOIL[f.soil].min);
    if(!f.wild&&(f.wd||0)<3&&Math.random()<wg*(f.u==='serre'?.4:1))f.wd=(f.wd||0)+1;
  }
  if(S.drought>0)S.drought--;
  if(S.cistern>0)S.cistern--;
  animalsTick();atelierTick();machNight();
  if(S.workers)spend('salaires',Math.round(S.workers*WAGE*dif().wage));
  S.hist.push({rev:S.today.rev,exp:S.today.exp,inv:S.today.inv});
  if(S.hist.length>60)S.hist.shift();
  S.today={rev:0,exp:0,inv:0};
  S.orders.forEach(o=>o.left--);
  const gone=S.orders.filter(o=>o.left<0);

    S.orders=S.orders.filter(o=>o.left>=0);

  }
  const prev=S.season;let sEnd=false;
  S.day++;S.festGot=0;
  if(S.day>SD){S.day=1;S.season=(S.season+1)%4;if(S.season===0)S.year++;sEnd=true}
  if(sEnd){
    let lost=0,late=0;
    for(const f of S.fields){
      if(f.c&&f.u!=='serre'&&!CROPS[f.c].s.includes(S.season)){
        if(f.a>=CROPS[f.c].g)late++;
        else{f.c=null;f.a=0;f.over=0;f.dmg=0;f.nh=0;lost++}
      }
      if(f.job&&f.job.k==='sow'&&f.u!=='serre'&&!CROPS[f.job.arg].s.includes(S.season)){f.job=null;lost++}
    }
    if(lost)say(lost+' champ(s) perdu(s) avec le changement de saison.','bad');
    if(late)say(late+' champ(s) mûr(s) attendent encore la récolte : le rendement baisse chaque jour.','bad');
  }

  }else if(Math.random()<.12){
    const k=pick(Object.keys(EV));S.event={id:k,left:EV[k].days};
    say(EV[k].n+' : '+EV[k].d,'good');
  }
  if(S.day===FEST_DAY){
    if(!S.event)S.event={id:'fete',left:1};
    say('Aujourd’hui : '+FEST[S.season].n+'. Passez au stand du marché.','good');
  }
  for(const id in G){const m=S.mk[id];m.m=clamp(m.m+(1-m.m)*.2+rnd(-.05,.05),.45,1.7)}
  marketDay();
  rotNight();

  rollAlert();

  checkGoals();
  S.nwh.push(Math.round(netWorth()));if(S.nwh.length>60)S.nwh.shift();

    if(ha.sk){g.fillStyle='#e0594b';g.beginPath();g.arc(x,y-sz*1.35,Math.max(2.5,sz*.13),0,6.3);g.fill()}
    st.hits.push({type:'animal',id:a.id,k:a.k,x,y:y-sz*.5,r:sz*.8+W*.015});
  }
  /* effets */
  const now=T;
  for(let i=fxP.length-1;i>=0;i--){
    const q=fxP[i],a=(now-q.t0)/1000;
    if(now-q.t0>q.life){fxP.splice(i,1);continue}
    g.globalAlpha=Math.max(0,1-(now-q.t0)/q.life);g.fillStyle=q.col;g.beginPath();g.arc(q.x+q.vx*a,q.y+q.vy*a+.5*260*a*a,q.r,0,6.3);g.fill();
  }
  g.globalAlpha=1;
  g.font='700 '+Math.round(FT*.26)+'px "DM Mono",monospace';g.textAlign='center';g.lineWidth=3;
  for(let i=fxT.length-1;i>=0;i--){
    const q=fxT[i],a=(now-q.t0)/1000;
    if(a>1){fxT.splice(i,1);continue}
    g.globalAlpha=Math.max(0,1-a*a);g.strokeStyle='rgba(0,0,0,.6)';g.fillStyle=q.col;
    const yy=q.y-a*FT*.9;g.strokeText(q.txt,q.x,yy);g.fillText(q.txt,q.x,yy);
  }
  g.globalAlpha=1;g.textAlign='left';
  if(!o.calm&&!RM)wxDraw(g,st.wx,W,H,T,dt);
}

function seedList(){
  const all=Object.keys(CROPS),inn=all.filter(k=>CROPS[k].s.includes(S.season));

}

const fmtE=n=>(Math.round(n*10)/10).toString().replace('.',',');
function fieldCounts(){
  const c={thirsty:0,ready:0,empty:0,weedy:0,prune:0};
  for(const f of S.fields){
    if(f.wild)continue;
    if(f.c){if(f.a>=CROPS[f.c].g){if(!f.job||f.job.k==='harv')c.ready+=f.ha}else if(!f.job){const w=f.ha*(1-f.wet);if(w>=.05)c.thirsty+=w}}
    else if(f.per){if(perReady(f)&&(!f.job||f.job.k==='harv'))c.ready+=f.ha;if(!PER[f.per.k].hay&&(S.season===3||S.season===0)&&!f.per.pruned&&(!f.job||f.job.k==='prune'))c.prune+=f.ha}
    else if(f.job&&f.job.k==='sow')c.empty+=f.ha-f.job.done;
    else if(!f.cv&&!f.job)c.empty+=f.ha;
    if(f.wd>0&&(!f.job||f.job.k==='weed'))c.weedy+=f.ha;
  }
  return c;
}
const WDL=['aucune','légères (−12 %)','moyennes (−24 %)','fortes (−36 %)'];
function rotNote(f,seed){
  const fam=FAM[seed];
  if(f.last&&f.last===fam)return 'Même famille que la dernière culture ('+FAMN[fam]+') : −20 %.';
  if(f.last==='leg'&&fam!=='leg')return 'Après des légumineuses ou un engrais vert : +15 %.';

const qual=v=>v>=75?'excellente':v>=55?'bonne':v>=35?'moyenne':v>=20?'faible':'très faible';

function effort(f,kind,arg){
  const r=rate(kind,arg,f);let rem=f.ha;
  if(f.job&&JOBK[kind]===f.job.k)rem=f.ha-f.job.done;
  if(kind==='water')rem=f.ha*(1-f.wet);
  if(kind==='weed')rem=f.ha-(f.wp||0);
  const e=r.e*rem,m=r.m*rem;

  const pr=offerPrice(k,br,lv),list=listPrice(k,br,lv),tv=own?tradeValue(k,br):0,ng=S.nego[negKey(k,br,lv)];
  const settle=own?Math.round(leaseLeft(k)*.7):0;
  const full=!own&&nm_()>=hangCap(),need=d.att&&!S.mach.tractor&&k!=='tractor';
  const net=pr-tv+settle,can=S.cash>=net,canL=!own&&S.cash>=Math.round(pr*.2);
  let h=`<div class="deal ${stt.avail?'':'out'}"><div class="row"><b>${t.n}</b><span class="mono gold">${eur(pr)}</span></div>`;
  h+=`<div>`;

  if(!stt.avail)return h+'<div class="muted">En rupture ce trimestre.</div></div>';

  const dis=full||need;

function known(id){
  if((S.stock[id]||0)>0)return true;
  if(PERG[id])return S.fields.some(f=>f.per&&f.per.k===PERG[id]);
  if(CROPS[id])return CROPS[id].s.includes(S.season);
  for(const k of ANIMK)if(SPEC[k].goods.includes(id))return inB(k).length>0;
  return S.slots.length>0;
}
function spark(a){
  if(a.length<2)return '';
  const mn=Math.min(...a),mx=Math.max(...a),r=mx-mn||1;
  const pts=a.map((v,i)=>(i/(a.length-1)*60).toFixed(1)+','+(18-(v-mn)/r*16).toFixed(1)).join(' ');
  const up=a[a.length-1]>=a[0];
  return `<svg width="64" height="20" viewBox="-2 0 64 20" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="${up?'var(--good)':'var(--bad)'}" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/></svg>`;
}
function mtags(id){
  let t='';
  if(S.rg[id]||S.rg[G[id].cat]){const e=(rgF(id)-1)*100;if(Math.abs(e)>=3)t+=` <small class="${e>=0?'pos':'neg'}">${e>=0?'▲':'▼'} région</small>`}

  return t;
}

function lineSvg(a,col){
  if(a.length<2)return '';
  const W=360,H=120,L=6,R=46,T=8,B=14,iw=W-L-R,ih=H-T-B;
  const mn=Math.min(...a),mx=Math.max(...a),r=(mx-mn)||1;
  const X=i=>L+i/(a.length-1)*iw,Y=v=>T+ih-(v-mn)/r*ih;
  const pts=a.map((v,i)=>X(i).toFixed(1)+','+Y(v).toFixed(1)).join(' ');
  const c=col||(a[a.length-1]>=a[0]?'var(--good)':'var(--bad)'),last=a[a.length-1];
  const f=v=>Math.abs(v)>=1000?Math.round(v).toLocaleString('fr-FR'):v.toFixed(1);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Évolution dans le temps"><line x1="${L}" x2="${W-R}" y1="${Y(mn)}" y2="${Y(mn)}" stroke="var(--line)"/><line x1="${L}" x2="${W-R}" y1="${Y(mx)}" y2="${Y(mx)}" stroke="var(--line)"/><text class="ax" x="${W-R+4}" y="${Y(mx)+3}">${f(mx)}</text><text class="ax" x="${W-R+4}" y="${Y(mn)+3}">${f(mn)}</text><polyline points="${pts}" fill="none" stroke="${c}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${X(a.length-1).toFixed(1)}" cy="${Y(last).toFixed(1)}" r="3.5" fill="${c}"/><text class="ax" x="${L}" y="${H-2}">il y a ${a.length-1} j</text><text class="ax" x="${W-R}" y="${H-2}" text-anchor="end">aujourd’hui</text></svg>`;
}
const signP=v=>(v>=0?'+':'−')+Math.abs(v).toFixed(2)+' %';

  h+='</div>';
  return h;
}

const niceStep=m=>[10,20,50,100,200,500,1000,2000,5000,10000].find(s=>m/s<=4)||20000;

  if(H.length<2)return '<p class="muted">Le graphique apparaît après deux nuits.</p>';
  const mx=Math.max(50,...H.map(x=>Math.max(x.rev,x.exp))),step=niceStep(mx),top=Math.ceil(mx/step)*step;
  const W=360,Ht=150,L=42,B=18,T=8,iw=W-L-6,ih=Ht-B-T,bw=iw/H.length;
  let s=`<svg class="chart" viewBox="0 0 ${W} ${Ht}" role="img" aria-label="Recettes et dépenses par jour">`;
  for(let v=0;v<=top;v+=step){const y=T+ih-v/top*ih;s+=`<line x1="${L}" x2="${W-6}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-width="1"/><text class="ax" x="${L-6}" y="${y+3}" text-anchor="end">${v}</text>`}
  H.forEach((d,i)=>{
    const x=L+i*bw+bw*.1,w=bw*.4,hr=d.rev/top*ih,he=d.exp/top*ih;
    s+=`<rect x="${x.toFixed(1)}" y="${(T+ih-hr).toFixed(1)}" width="${w.toFixed(1)}" height="${hr.toFixed(1)}" fill="var(--good)" rx="1"/><rect x="${(x+w).toFixed(1)}" y="${(T+ih-he).toFixed(1)}" width="${w.toFixed(1)}" height="${he.toFixed(1)}" fill="var(--bad)" rx="1"/>`;
  });
  s+=`<text class="ax" x="${L}" y="${Ht-4}">il y a ${H.length} j</text><text class="ax" x="${W-6}" y="${Ht-4}" text-anchor="end">hier</text></svg>`;
  return s;
}

function hbars(rows,fmt){

const sgn=v=>(v>=0?'+':'−')+eur(Math.abs(v));
function barSvg(vals,labs){
  const W=360,H=130,L=6,R=6,T=10,B=22,iw=W-L-R,ih=H-T-B;
  const mx=Math.max(1,...vals.map(Math.abs)),zero=T+ih/2,n=vals.length,bw=iw/Math.max(1,n);
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Résultat par saison"><line x1="${L}" x2="${W-R}" y1="${zero}" y2="${zero}" stroke="var(--line)"/>`;
  vals.forEach((v,i)=>{
    const hg=Math.max(1,Math.abs(v)/mx*(ih/2-2)),x=L+i*bw+bw*.18,w=bw*.64,y=v>=0?zero-hg:zero;
    s+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${w.toFixed(1)}" height="${hg.toFixed(1)}" rx="2" fill="${v>=0?'var(--good)':'var(--bad)'}"/>`;
    if(labs[i])s+=`<text class="ax" x="${(x+w/2).toFixed(1)}" y="${H-6}" text-anchor="middle">${labs[i]}</text>`;
  });
  return s+'</svg>';
}

function drawNGMap(){
  const cv=$('#ngmap');if(!cv||!ui.ng)return;
  const W=cv.clientWidth,H=cv.clientHeight;if(!W||!H)return;
  const dpr=Math.min(2,window.devicePixelRatio||1);cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
  const g=cv.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);
  const keep=S,keepT=TERR;
  try{
    S=buildState(ui.ng);postLoad();
    const T=terr(),own=S.cown,rx=.85,ry=.7,X=x=>(x-(WCX-rx))/(2*rx)*W,Y=y=>(y-(WCY-ry))/(2*ry)*H;
    g.fillStyle='#16211b';g.fillRect(0,0,W,H);
    T.cells.forEach((c,i)=>{
      const o=own[i];if(Math.abs(c.x-WCX)>rx+.06||Math.abs(c.y-WCY)>ry+.06)return;
      g.beginPath();c.poly.forEach((p,k)=>k?g.lineTo(X(p.x),Y(p.y)):g.moveTo(X(p.x),Y(p.y)));g.closePath();
      let col=c.v?'#27432c':'#46663f';
      if(o&&o[0]==='f'){const f=S.fields.find(f=>'f'+f.id===o),a=SOIL[f.soil].col;col='rgb('+a[0]+','+a[1]+','+a[2]+')'}
      else if(o&&o[0]==='l')col='#c9a43a';
      g.fillStyle=col;g.fill();g.strokeStyle='rgba(10,17,13,.55)';g.lineWidth=1;g.stroke();
    });
  }catch(e){}
  S=keep;TERR=keepT;
}

  sow:()=>batchRun('sow'),water:()=>batchRun('water'),harvest:()=>batchRun('harvest'),
  bsel:d=>{ui.bsel=d.id;sfx('tap');after()},
  sbuy:d=>{const r=buyStock(d.id,+d.n);if(r==='ok'){toast('Achat : '+d.n+' × '+stk(d.id).tk+'.','good');sfx('coin')}else{toast(MSG[r]||'Impossible.','bad');sfx('err')}after()},
  ssell:d=>{const r=sellStock(d.id,+d.n);if(r==='ok'){toast('Vente : '+Math.min(+d.n,999)+' × '+stk(d.id).tk+'.','good');sfx('coin')}after()},
  ctsel:d=>{ui.ct.item=d.id;sfx('tap');after()},
  ctqty:d=>{ui.ct.qty=+d.n;sfx('tap');after()},
  ctopen:()=>{const r=openContract(ui.ct.item,ui.ct.qty);if(r==='ok'){toast('Contrat signé.','good');sfx('coin')}else{toast(r==='max'?'Trois contrats au maximum en même temps.':MSG[r],'bad');sfx('err')}after()},
  livin:d=>{const n=+d.n;if(S.cash<n){toast(MSG.cash,'bad');sfx('err')}else{S.cash-=n;S.bo.liv+=n;sfx('coin')}after()},
  livout:d=>{const n=Math.min(+d.n,S.bo.liv);if(n>0){S.bo.liv-=n;S.cash+=n;sfx('coin')}after()},
  night:()=>nightSequence(),
  sell1:d=>{const p=sellOne(d.id);if(p){toast('+'+eur(p),'good');sfx('coin')}after()},
  sellall:d=>{const r=sellMany(d.id,S.stock[d.id]||0);if(r.k){toast(r.k+' vendu(s) pour '+eur(r.t),'good');sfx('coin')}after()},
  deliver:d=>{
    const o=deliver(+d.id);
    if(o){const cl=CLIENTS.find(x=>x.id===o.cl);toast('Commande livrée'+(cl?' à '+cl.n:'')+' : +'+eur(o.reward),'good');sfx('coin')}
    after();
  },
  fest:()=>{const n=festGive();if(n){toast(n+' produit(s) apporté(s) au stand.','good');sfx('coin')}else toast('Rien à apporter.');after()},
  irrig:()=>res(buyIrrig(),'Goutte-à-goutte installé.'),
  cap:()=>res(buyCap(),'Hangar de stockage agrandi.','build'),
  coldb:()=>res(buyCold(),'Chambre froide installée.','build'),
  buy1:d=>{const r=buyGood(d.id,+d.n||1);if(r.k){toast(r.k+' acheté(s) pour '+eur(r.t)+'.','good');sfx('coin')}else{toast(r.why==='room'?'Plus de place au stockage.':'Pas assez d’argent.','bad');sfx('err')}after()},
  allmk:()=>{ui.allMk=!ui.allMk;sfx('tap');render()},
  cheat:d=>{const n=+d.n;S.cash+=n;S.cheat=(S.cheat||0)+n;sfx('coin');toast('+'+eur(n)+' ajoutés (mode test).','good');after()},
  en:()=>res(buyEn(),'Endurance améliorée.'),
  hire:()=>res(hire(),'Ouvrier embauché.','tap'),
  fire:()=>{fire();sfx('tap');after()},
  bld:d=>res(buyB(d.id),'Bâtiment construit.'),
  animal:d=>res(buyAnimal(d.id),'Bête achetée.','tap'),
  feed:d=>res(buyFeed(+d.n),'Fourrage acheté.','coin'),
  autofeed:()=>{S.autoFeed=!S.autoFeed;sfx('tap');after()},
  atelier:()=>res(buyAtelier(),'Atelier construit.'),
  slot:()=>res(buySlot(),'Poste ajouté.'),
  rec:d=>res(startRec(+d.slot,d.id),'Production lancée.','plant'),
  borrow:()=>res(borrow(500),'500 € empruntés.','coin'),
  repay:d=>res(repay(+d.n),'Crédit remboursé.','coin'),
  snd:()=>{S.snd=S.snd?0:1;if(S.snd){AU.gesture=true;const c=audioInit();if(c&&c.state==='suspended')c.resume();AU.key='';ambience();sfx('tap')}else{AU.key='';ambience()}after()},
  anim:()=>{S.anim=S.anim?0:1;sfx('tap');after()},
  rename:d=>showRename('an',+d.id),
  sp:d=>{ui.sp=d.id;ui.open=0;sfx('tap');render()},
  aopen:d=>{ui.open=ui.open===+d.id?0:+d.id;sfx('tap');render()},
  abuy:d=>res(PL(buyCat(d.sp,d.br,d.sx)),'Bête achetée.','tap'),
  bup:d=>res(upBld(d.b),'Bâtiment agrandi.'),
  pol:d=>{const q=S.pol[d.sp]=S.pol[d.sp]||{br:false,cm:false};q[d.k]=!q[d.k];sfx('tap');after()},
  vacc:d=>{S.vacc[d.sp]=!S.vacc[d.sp];sfx('tap');after()},
  vet:()=>{S.vet=!S.vet;sfx('tap');after()},
  ration:()=>{S.ration=S.ration==='riche'?'std':'riche';sfx('tap');after()},
  breed:d=>res(breed(+d.id,d.m),'Reproduction lancée.','plant'),
  breedall:d=>{const r=breedAll(d.sp,'std');if(r.n){toast(r.n+' femelle(s) mise(s) à la reproduction.','good');sfx('plant');after()}else res(r.why||'none')},
  treat:d=>res(treat(+d.id),'Soigné.','tap'),
  treatall:d=>res(treatAll(d.sp),'Bêtes soignées.','tap'),
  asell:d=>res(sellAnimal(+d.id),'Bête vendue.','coin'),
  slaughter:d=>{const r=slaughter(+d.id);res(r,r==='ok'&&LASTSL?'Abattage : '+LASTSL.n+' × '+G[LASTSL.g].n.toLowerCase()+' en stock.':'','tap')},
  fair:d=>res(PL(buyFair(+d.id)),'Bête achetée à la foire.','tap'),
  namesave:d=>{
    const v=($('#nm').value||'').trim().slice(0,24);
    if(v){if(d.k==='farm')S.farm=v;else if(d.k==='mach')renameMach(d.i,v);else if(d.k==='an'){const a=animById(+d.i);if(a)a.nm=v}}
    hideVeil();sfx('tap');after();
  },
  closeveil:()=>hideVeil(),
  alert:d=>{
    const r=resolveAlert(d.c);
    if(r==='cash'){toast('Pas assez d’argent pour cette option.','bad');sfx('err');return}
    sfx(d.c==='risk'?'tap':'coin');after();nextOverlay();
  },
  intro:()=>{S.intro=1;hideVeil();sfx('tap');after();nextOverlay()},
  summary:()=>{S.summary=null;sfx('tap');after();nextOverlay()},
  year:()=>{S.yearCard=null;sfx('tap');after();nextOverlay()},
  restart:()=>{showNewGame(false)},
  ngset:d=>{ui.ng[d.g]=d.v;sfx('tap');ngRefresh()},
  ngseed:()=>{ui.ng.seed=Math.floor(Math.random()*900000)+1000;sfx('tap');ngRefresh()},
  ngstart:()=>{
    const c=ui.ng;c.farm=(c.farm||'').trim()||'Ferme du Haut-Champ';
    newGame(c);SC.man=null;S.intro=0;shownCash=S.cash;lastCash=S.cash;ui.sel=-1;ui.selL=0;ui.merge=false;ui.cust='';ui.dk='tractor';ui.tab='farm';ui.fsub='map';
    try{localStorage.removeItem(SAVE_KEY)}catch(e){}
    hideVeil();sfx('tap');after();showIntro();
  },
  newgame:()=>{sfx('tap');showNewGame(true)}
};

/* ---- démarrage ---- */
let started=false;
function start(data){
  if(started)return;started=true;
  let s=null,fresh=false;
  try{if(data&&data.state&&(data.state.v===1||data.state.v===2))s=data.state}catch(e){}
  if(!s){try{const raw=localStorage.getItem(SAVE_KEY);if(raw){const o=JSON.parse(raw);if(o&&(o.v===1||o.v===2))s=o}}catch(e){}}
  if(s){S=hydrate(s);postLoad()}else{newGame();fresh=true}
  shownCash=S.cash;lastCash=S.cash;
  onSay=e=>{if(!quiet&&(e.k==='good'||e.k==='bad'))toast(e.m,e.k,true);if(e.m.indexOf('Jalon')===0)sfx('jalon')};
  try{const h=window.claude&&window.claude.hot;if(h&&h.snapshot)h.snapshot(()=>({state:S}))}catch(e){}
  document.body.addEventListener('click',e=>{
    const t=e.target.closest('[data-tab]');
    if(t){ui.tab=t.dataset.tab;sfx('tap');render();$('#main').scrollTop=0;return}
    const b=e.target.closest('[data-act]');
    if(!b||b.disabled)return;
    const f=ACT[b.dataset.act];if(f)f(b.dataset);
  });
  $('#night').addEventListener('click',()=>{if(dawnReady)finishNight()});
  $('#veil').addEventListener('input',e=>{if(e.target&&e.target.id==='ngname'&&ui.ng)ui.ng.farm=e.target.value});
  $('#veil').addEventListener('keydown',e=>{
    if(e.key==='Enter'&&e.target&&e.target.id==='nm'){const b=$('#veil [data-act="namesave"]');if(b)b.click()}
  });
  initMap();render();
  if(!RM)raf=requestAnimationFrame(loop);
  setTimeout(birdLoop,4000);
  if(fresh)showNewGame(false);else if(!S.intro)showIntro();else nextOverlay();
}
try{
  const h=window.claude&&window.claude.hot;
  if(h&&h.ready)h.ready(start);else start(h&&h.data?h.data:{});
}catch(e){start({})}
</script>

</body></html>

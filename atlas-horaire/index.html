<style>
/* Layout: panneaux empilés. L'heure en chiffres mono est l'élément fort, le reste reste sobre. */
:root{
  --bg:#EDF0F3;
  --surface:#FFFFFF;
  --surface-2:#F3F5F8;
  --ink:#13202C;
  --ink-2:#4A5967;
  --line:#D6DCE3;
  --accent:#1B4FD6;
  --accent-ink:#FFFFFF;
  --accent-soft:#E4EBFC;
  --ok:#12794A;
  --ok-soft:#DCF2E7;
  --warn:#8F5200;
  --warn-soft:#FAEACB;
  --off:#5C6975;
  --off-soft:#E6EAEE;
  --f-body:"Schibsted Grotesk",system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei","Noto Sans SC",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C1218;
    --surface:#141C25;
    --surface-2:#1A242F;
    --ink:#E7EDF3;
    --ink-2:#A0AEBC;
    --line:#27333F;
    --accent:#7EA2FF;
    --accent-ink:#0C1218;
    --accent-soft:#1B2A4A;
    --ok:#5BD39A;
    --ok-soft:#12301F;
    --warn:#F0B45A;
    --warn-soft:#3A2A0E;
    --off:#93A1AF;
    --off-soft:#222C36;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C1218;
  --surface:#141C25;
  --surface-2:#1A242F;
  --ink:#E7EDF3;
  --ink-2:#A0AEBC;
  --line:#27333F;
  --accent:#7EA2FF;
  --accent-ink:#0C1218;
  --accent-soft:#1B2A4A;
  --ok:#5BD39A;
  --ok-soft:#12301F;
  --warn:#F0B45A;
  --warn-soft:#3A2A0E;
  --off:#93A1AF;
  --off-soft:#222C36;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg);color:var(--ink);
  font-family:var(--f-body);font-size:15px;line-height:1.5;
  padding-inline:clamp(16px,4vw,40px);
  padding-block:28px 56px;
}
.wrap{max-width:1120px;margin-inline:auto;display:grid;gap:28px}
h1,h2,h3,p{margin:0}
h1{font-size:clamp(1.8rem,4.5vw,2.5rem);line-height:1.1;font-weight:700;letter-spacing:-.02em;text-wrap:balance}
h2{font-size:1.15rem;font-weight:650;letter-spacing:-.01em;text-wrap:balance}
h3{font-size:.8rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.muted{color:var(--ink-2)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header.top{display:grid;gap:8px}
header.top p{color:var(--ink-2);max-width:60ch}

.controls{
  display:grid;gap:14px 16px;
  grid-template-columns:repeat(auto-fit,minmax(11rem,1fr));
  background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px;
}
.field{display:grid;gap:6px;min-width:0}
.field>span,.field>legend{font-size:.72rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.pair{display:flex;align-items:center;gap:8px}
select,input[type="date"],input[type="time"]{
  font:inherit;color:var(--ink);background:var(--surface-2);
  border:1px solid var(--line);border-radius:6px;height:40px;padding-inline:10px;min-width:0;width:100%;
}
button{font:inherit;cursor:pointer}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.panel-head{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:baseline;justify-content:space-between;padding:16px 18px 12px}
.panel-head p{font-size:.85rem;color:var(--ink-2)}
.panel-body{padding:0 18px 16px}

.board{list-style:none;margin:0;padding:0}
.row{
  display:grid;gap:8px 20px;align-items:center;
  grid-template-columns:minmax(0,1.15fr) minmax(0,1fr) minmax(0,1.05fr) minmax(0,1.2fr);
  grid-template-areas:"who time gap state";
  padding:14px 18px;border-top:1px solid var(--line);
}
.row.is-ref{background:var(--accent-soft)}
.who{grid-area:who;display:flex;align-items:center;gap:12px;min-width:0}
.code{
  font-family:var(--f-mono);font-weight:600;font-size:.78rem;letter-spacing:.06em;
  border:1px solid var(--line);background:var(--surface-2);border-radius:4px;padding:3px 6px;flex:none;
}
.cn{font-weight:650}
.city{font-size:.85rem;color:var(--ink-2)}
.time{grid-area:time}
.clk{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-weight:500;font-size:clamp(1.7rem,3.4vw,2.15rem);line-height:1.1;letter-spacing:-.02em}
.clk .sec{font-size:.55em;color:var(--ink-2);letter-spacing:0}
.day{font-size:.85rem;color:var(--ink-2);margin-top:2px}
.gap{grid-area:gap;display:grid;gap:2px}
.gap b{font-family:var(--f-mono);font-weight:600;font-size:1.05rem}
.gap span{font-size:.8rem;color:var(--ink-2)}
.state{grid-area:state;display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;min-width:0}
.state small{font-size:.8rem;color:var(--ink-2)}

.pill{
  display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:999px;
  font-size:.78rem;font-weight:600;white-space:nowrap;border:1px solid transparent;
}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.ok{color:var(--ok);background:var(--ok-soft)}
.pill.warn{color:var(--warn);background:var(--warn-soft)}
.pill.off{color:var(--off);background:var(--off-soft)}
.pill.est{color:var(--ink-2);background:transparent;border-color:var(--line)}
.pill.est::before{display:none}

.tl{display:grid;gap:2px}
.tl-row{display:grid;grid-template-columns:10rem minmax(0,1fr);gap:12px;align-items:center;padding:5px 0}
.tl-row label{display:flex;align-items:center;gap:8px;font-weight:550;min-width:0;cursor:pointer}
.tl-row input{accent-color:var(--accent);width:16px;height:16px;flex:none}
.tl-row .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{position:relative;height:26px;background:var(--surface-2);border:1px solid var(--line);border-radius:4px;overflow:hidden}
.seg{position:absolute;top:0;bottom:0;background:var(--accent);opacity:.8}
.common{
  position:absolute;top:0;bottom:0;
  background:color-mix(in srgb,var(--ok) 30%,transparent);
  border-inline:2px solid var(--ok);
}
.nowline{position:absolute;top:0;bottom:0;width:2px;background:var(--ink);margin-left:-1px}
.axis{position:relative;height:18px;margin-left:calc(10rem + 12px)}
.axis span{position:absolute;top:0;transform:translateX(-50%);font-family:var(--f-mono);font-size:.72rem;color:var(--ink-2)}
.axis span:first-child{transform:none}
.axis span:last-child{transform:translateX(-100%)}
.result{margin-top:12px;border:1px solid var(--line);border-radius:8px;padding:12px 14px;background:var(--surface-2);display:grid;gap:6px}
.result.good{border-color:var(--ok)}
.result strong{font-weight:650}
.result ul{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.result li{display:flex;flex-wrap:wrap;gap:2px 10px;font-size:.9rem}
.result li b{font-family:var(--f-mono);font-weight:600}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.8rem;color:var(--ink-2);margin-top:10px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:2px;vertical-align:-1px;margin-inline-end:6px}

.conv-controls{display:flex;flex-wrap:wrap;gap:12px;align-items:end;padding:0 18px 14px}
.conv-controls .field{width:11rem;max-width:100%}
.btn{height:40px;padding-inline:16px;border-radius:6px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);font-weight:600}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.crow{
  display:grid;gap:6px 20px;align-items:center;padding:11px 18px;border-top:1px solid var(--line);
  grid-template-columns:minmax(0,1.2fr) minmax(0,.9fr) minmax(0,.9fr) minmax(0,1.1fr);
}
.crow .t{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:1.25rem;font-weight:500}

.chips{display:flex;flex-wrap:wrap;gap:8px;padding:0 18px 14px}
.chip{
  display:inline-flex;align-items:center;gap:8px;height:34px;padding-inline:12px;border-radius:999px;
  border:1px solid var(--line);background:var(--surface-2);color:var(--ink-2);font-weight:550;font-size:.88rem;
}
.chip .code{padding:1px 5px;font-size:.7rem}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.hol-tools{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:end;justify-content:space-between;padding:0 18px 4px}
.hol-tools .field{width:12rem;max-width:100%}
.month{padding:14px 18px 4px;border-top:1px solid var(--line)}
.hol{list-style:none;margin:0;padding:0}
.hi{
  display:grid;gap:4px 16px;align-items:center;padding:11px 18px;
  grid-template-columns:5.2rem minmax(0,1fr) auto;
}
.hi+.hi{border-top:1px dashed var(--line)}
.dt{display:grid;line-height:1.15}
.dt b{font-family:var(--f-mono);font-size:1.15rem;font-weight:600}
.dt span{font-size:.78rem;color:var(--ink-2)}
.hn{font-weight:600;min-width:0}
.hn small{display:block;font-weight:400;color:var(--ink-2);font-size:.82rem}
.hr{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;align-items:center}
.cc{font-family:var(--f-mono);font-size:.75rem;font-weight:600;letter-spacing:.05em;border:1px solid var(--line);border-radius:4px;padding:2px 6px;background:var(--surface-2)}
.rel{font-size:.85rem;color:var(--ink-2);white-space:nowrap}
.rel.now{color:var(--ok);font-weight:600}
.empty{padding:18px;color:var(--ink-2)}

.dst{list-style:none;margin:0;padding:0}
.dst li{display:grid;gap:4px;padding:12px 18px;border-top:1px solid var(--line)}
.dst b{font-weight:650}
.dst .mono{font-size:.9rem}
.dst .fx{font-size:.85rem;color:var(--ink-2)}

.foot{font-size:.82rem;color:var(--ink-2);max-width:80ch}

@media (max-width:760px){
  .row{
    grid-template-columns:minmax(0,1fr) auto;
    grid-template-areas:"who time" "gap state";
    align-items:start;
  }
  .time{text-align:right}
  .tl-row{grid-template-columns:6.5rem minmax(0,1fr);gap:8px}
  .axis{margin-left:calc(6.5rem + 8px)}
  .crow{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"a b" "c d"}
  .crow>:nth-child(1){grid-area:a}
  .crow>:nth-child(2){grid-area:b;text-align:right}
  .crow>:nth-child(3){grid-area:c}
  .crow>:nth-child(4){grid-area:d;text-align:right}
  .hi{grid-template-columns:4.4rem minmax(0,1fr)}
  .hr{grid-column:2;justify-content:flex-start}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="wrap">

    </div>
    <div id="cv-list"></div>
  </section>

  <section class="panel" aria-labelledby="h-hol">
    <div class="panel-head">
      <h2 id="h-hol" data-i="hHol"></h2>
      <p id="hol-note"></p>
    </div>
    <div class="chips" id="chips" role="group"></div>
    <div class="hol-tools">
      <label class="field"><span data-i="fPeriod"></span>
        <select id="hz">
          <option value="30" data-i="p30"></option>
          <option value="90" data-i="p90"></option>
          <option value="0" data-i="pAll"></option>
        </select>
      </label>
    </div>
    <div id="hol" style="margin-top:12px"></div>
  </section>

  <section class="panel" aria-labelledby="h-dst">
    <div class="panel-head">
      <h2 id="h-dst" data-i="hDst"></h2>
      <p data-i="dstIntro"></p>
    </div>
    <ul class="dst" id="dst"></ul>
  </section>

  <p class="foot" data-i="foot"></p>
</div>

function T(k){
  var s=S[k][LI[lang]];
  for(var i=1;i<arguments.length;i++)s=s.split("{"+(i-1)+"}").join(arguments[i]);
  return s;
}
function pick(arr){return arr[LI[lang]]}
function cname(c){return pick(NAMES[c.id])}
function cityOf(c){
  if(c.id!=="us")return pick(CITY[c.id]);
  for(var i=0;i<US_ZONES.length;i++)if(US_ZONES[i].tz===state.us)return pick(US_ZONES[i].city);

}

var KEY="atlas-horaire-v1";
function save(){try{localStorage.setItem(KEY,JSON.stringify({ref:state.ref,us:state.us,open:state.open,close:state.close,sel:Array.from(state.sel),hf:Array.from(state.hf),hz:state.hz}))}catch(e){}}
function load(){
  try{
    var j=JSON.parse(localStorage.getItem(KEY)||"null"); if(!j)return;
    var ids=C.map(function(c){return c.id});
    if(ids.indexOf(j.ref)>-1)state.ref=j.ref;
    if(US_ZONES.some(function(z){return z.tz===j.us}))state.us=j.us;
    if(j.open>=7&&j.open<=11)state.open=j.open;
    if(j.close>=16&&j.close<=20)state.close=j.close;
    if(Array.isArray(j.sel))state.sel=new Set(j.sel.filter(function(x){return ids.indexOf(x)>-1}));
    if(Array.isArray(j.hf)&&j.hf.length)state.hf=new Set(j.hf.filter(function(x){return ids.indexOf(x)>-1}));
    if([0,30,90].indexOf(j.hz)>-1)state.hz=j.hz;
  }catch(e){}
}

var dtfCache={};
function dtf(tz){
  if(!dtfCache[tz])dtfCache[tz]=new Intl.DateTimeFormat("en-GB",{timeZone:tz,hourCycle:"h23",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",second:"2-digit"});
  return dtfCache[tz];
}
function parts(tz,ms){var o={},a=dtf(tz).formatToParts(ms);for(var i=0;i<a.length;i++)o[a[i].type]=a[i].value;return o}
function offsetMin(tz,ms){
  var p=parts(tz,ms);
  var asUtc=Date.UTC(+p.year,+p.month-1,+p.day,+p.hour,+p.minute,+p.second);
  return Math.round((asUtc-Math.floor(ms/1000)*1000)/60000);
}
function localDate(tz,ms){var p=parts(tz,ms);return p.year+"-"+p.month+"-"+p.day}
function zonedToUtc(y,mo,d,h,mi,tz){
  var guess=Date.UTC(y,mo-1,d,h,mi);
  var o1=offsetMin(tz,guess), utc=guess-o1*60000, o2=offsetMin(tz,utc);
  if(o2!==o1)utc=guess-o2*60000;
  return utc;
}
function u(s){var a=s.split("-");return Date.UTC(+a[0],+a[1]-1,+a[2])}
function tzOf(c){return c.id==="us"?state.us:c.tz}
function refC(){return C.filter(function(c){return c.id===state.ref})[0]}
function refTz(){return tzOf(refC())}
function hmm(m){m=((m%1440)+1440)%1440;return pad(Math.floor(m/60))+":"+pad(m%60)}
function fmtGap(min){
  if(min===0)return "0 h";
  var s=min>0?"+":"−",a=Math.abs(min),h=Math.floor(a/60),m=a%60;
  return s+h+" h"+(m?" "+pad(m):"");
}
function fmtUTC(min){var a=Math.abs(min);return "UTC"+(min<0?"−":"+")+pad(Math.floor(a/60))+":"+pad(a%60)}
function isDst(tz,ms){
  var y=new Date(ms).getUTCFullYear();
  var a=offsetMin(tz,Date.UTC(y,0,1)),b=offsetMin(tz,Date.UTC(y,6,1)),n=offsetMin(tz,ms);
  return a!==b&&n>Math.min(a,b);
}

/* Formats de dates dépendant de la langue */
var dayFmt={},utcDayLong,utcMonth,utcMonShort,utcWd,utcRange;
function initFmt(){
  dayFmt={};
  utcDayLong=new Intl.DateTimeFormat(LOC,{timeZone:"UTC",weekday:"short",day:"numeric",month:"long"});
  utcMonth=new Intl.DateTimeFormat(LOC,{timeZone:"UTC",month:"long",year:"numeric"});
  utcMonShort=new Intl.DateTimeFormat(LOC,{timeZone:"UTC",month:"short"});
  utcWd=new Intl.DateTimeFormat(LOC,{timeZone:"UTC",weekday:"short"});
  utcRange=new Intl.DateTimeFormat(LOC,{timeZone:"UTC",day:"numeric",month:"short"});
}
function fmtDay(tz,ms){
  if(!dayFmt[tz])dayFmt[tz]=new Intl.DateTimeFormat(LOC,{timeZone:tz,weekday:"short",day:"numeric",month:"short"});
  return dayFmt[tz].format(ms);
}

function statusOf(c,ms){
  var tz=tzOf(c),p=parts(tz,ms),date=p.year+"-"+p.month+"-"+p.day;
  var dow=new Date(Date.UTC(+p.year,+p.month-1,+p.day)).getUTCDay();
  var min=+p.hour*60+ +p.minute,o=state.open*60,cl=state.close*60;
  var hol=(HOL[c.id]||[]).filter(function(h){return (h.t||"nat")==="nat"&&date>=h.s&&date<=(h.e||h.s)})[0];
  if(hol)return {k:"warn",l:T("stHol"),d:hname(hol)};
  if(dow===0||dow===6)return {k:"off",l:T("stWknd"),d:T("dResumeMon")};
  if(min>=o&&min<cl)return {k:"ok",l:T("stOpen"),d:T("dUntil",hmm(cl))};
  if(min<o)return {k:"off",l:T("stClosed"),d:T("dOpensAt",hmm(o))};
  return {k:"off",l:T("stClosed"),d:dow===5?T("dOpensMon"):T("dOpensTom")};
}

/* Tableau */
function sortedRows(now){
  var rOff=offsetMin(refTz(),now);
  return C.map(function(c){var tz=tzOf(c);return {c:c,tz:tz,off:offsetMin(tz,now),gap:offsetMin(tz,now)-rOff}})
   .sort(function(a,b){return a.off-b.off||cname(a.c).localeCompare(cname(b.c),LOC)});
}
function renderBoard(){
  var now=Date.now();
  var rows=sortedRows(now);
  $("#board").innerHTML=rows.map(function(r){
    var c=r.c,p=parts(r.tz,now),st=statusOf(c,now),isRef=c.id===state.ref;
    var sub=fmtUTC(r.off)+(isDst(r.tz,now)?" · "+T("dstOn"):"");
    var gapHtml=isRef?'<b>'+T("refTag")+'</b><span>'+sub+'</span>':'<b>'+fmtGap(r.gap)+'</b><span>'+sub+'</span>';
    return '<li class="row'+(isRef?" is-ref":"")+'">'
      +'<div class="who"><span class="code">'+c.code+'</span><div><div class="cn">'+cname(c)+'</div><div class="city">'+cityOf(c)+'</div></div></div>'
      +'<div class="time"><div class="clk">'+p.hour+":"+p.minute+'<span class="sec">:'+p.second+'</span></div><div class="day">'+fmtDay(r.tz,now)+'</div></div>'
      +'<div class="gap">'+gapHtml+'</div>'
      +'<div class="state"><span class="pill '+st.k+'">'+st.l+'</span>'+(st.d?'<small>'+st.d+'</small>':'')+'</div>'
      +'</li>';
  }).join("");
}

/* Fenêtres de bureau */
function windowSegs(delta){
  var start=(((state.open*60-delta)%1440)+1440)%1440,len=(state.close-state.open)*60,segs=[];
  if(start+len<=1440)segs.push([start,start+len]);
  else{segs.push([start,1440]);segs.push([0,start+len-1440])}
  return segs;
}
function commonRanges(now){
  var rOff=offsetMin(refTz(),now),bits=[],i,m;
  var cs=C.filter(function(c){return state.sel.has(c.id)}).map(function(c){return offsetMin(tzOf(c),now)-rOff});
  if(!cs.length)return [];
  for(m=0;m<1440;m++){
    var ok=true;
    for(i=0;i<cs.length;i++){var lm=(((m+cs[i])%1440)+1440)%1440;if(lm<state.open*60||lm>=state.close*60){ok=false;break}}
    bits.push(ok);
  }
  var out=[],s=-1;
  for(m=0;m<=1440;m++){
    if(m<1440&&bits[m]){if(s<0)s=m}
    else if(s>=0){out.push([s,m]);s=-1}
  }
  return out;
}
var tlSig="";
function sigNow(now){return sortedRows(now).map(function(r){return r.off}).join(",")+"|"+state.open+state.close+Array.from(state.sel).sort().join("")}
function renderTimeline(){
  var now=Date.now(),rows=sortedRows(now),rOff=offsetMin(refTz(),now),common=commonRanges(now);
  var rp=parts(refTz(),now),refMin=+rp.hour*60+ +rp.minute+ +rp.second/60;
  tlSig=sigNow(now);
  $("#tl").innerHTML=rows.map(function(r){
    var c=r.c,delta=r.off-rOff;
    var segs=windowSegs(delta).map(function(s){return '<div class="seg" style="left:'+(s[0]/14.4)+'%;width:'+((s[1]-s[0])/14.4)+'%"></div>'}).join("");
    var cm=common.map(function(s){return '<div class="common" style="left:'+(s[0]/14.4)+'%;width:'+((s[1]-s[0])/14.4)+'%"></div>'}).join("");
    return '<div class="tl-row"><label><input type="checkbox" data-id="'+c.id+'"'+(state.sel.has(c.id)?" checked":"")+'><span class="nm">'+cname(c)+'</span></label>'
      +'<div class="bar" role="img" aria-label="'+T("tlAria",cname(c),state.open,state.close)+'">'+segs+cm+'<div class="nowline" data-now style="left:'+(refMin/14.4)+'%"></div></div></div>';
  }).join("");
  var ticks="";for(var h=0;h<=24;h+=3)ticks+='<span style="left:'+(h/24*100)+'%">'+pad(h)+'h</span>';
  $("#axis").innerHTML=ticks;
  $("#tl-note").textContent=T("tlNote",cname(refC()));
  renderOverlap(common,rOff,now);
}
function renderOverlap(common,rOff,now){
  var el=$("#overlap"),sel=C.filter(function(c){return state.sel.has(c.id)});
  if(sel.length<2){el.className="result";el.innerHTML="<span>"+T("ovPick")+"</span>";return}
  if(!common.length){el.className="result";el.innerHTML="<strong>"+T("ovNoneT")+"</strong><span class=\"muted\">"+T("ovNoneB",state.open,state.close)+"</span>";return}
  el.className="result good";
  var html="<strong>"+T("ovGood")+"</strong><ul>"+common.map(function(r){
    return "<li>"+sel.map(function(c){var d=offsetMin(tzOf(c),now)-rOff;return cname(c)+" <b>"+hmm(r[0]+d)+"–"+hmm(r[1]+d)+"</b>"}).join(" · ")+"</li>";
  }).join("")+"</ul>";
  html+='<span class="muted" style="font-size:.82rem">'+T("ovFoot")+'</span>';
  el.innerHTML=html;
}
function moveNow(){
  var rp=parts(refTz(),Date.now()),m=+rp.hour*60+ +rp.minute+ +rp.second/60;
  var els=document.querySelectorAll("[data-now]");
  for(var i=0;i<els.length;i++)els[i].style.left=(m/14.4)+"%";
}

/* Convertisseur */
function renderConv(){
  var dv=$("#cv-date").value,tv=$("#cv-time").value,box=$("#cv-list");
  $("#conv-note").textContent=T("convNote",cname(refC()),cityOf(refC()));
  if(!dv||!tv){box.innerHTML='<p class="empty">'+T("convEmpty")+'</p>';return}
  var d=dv.split("-").map(Number),t=tv.split(":").map(Number);
  var utc=zonedToUtc(d[0],d[1],d[2],t[0],t[1],refTz());
  box.innerHTML=sortedRows(utc).map(function(r){
    var c=r.c,p=parts(r.tz,utc),st=statusOf(c,utc),dd=Math.round((u(p.year+"-"+p.month+"-"+p.day)-u(dv))/DAY);
    var shift=dd===0?T("sameDay"):dd>0?T("nextDay"):T("prevDay");
    return '<div class="crow"><div><div class="cn">'+cname(c)+'</div><div class="city">'+cityOf(c)+'</div></div>'
      +'<div><div class="t">'+p.hour+":"+p.minute+'</div></div>'
      +'<div class="muted">'+fmtDay(r.tz,utc)+" · "+shift+'</div>'
      +'<div class="state"><span class="pill '+st.k+'">'+st.l+'</span>'+(st.d&&st.k==="warn"?"<small>"+st.d+"</small>":"")+'</div></div>';
  }).join("");
}
function setConvNow(){
  var now=Date.now(),p=parts(refTz(),now),m=Math.ceil((+p.hour*60+ +p.minute)/15)*15;
  var dateStr=p.year+"-"+p.month+"-"+p.day;
  if(m>=1440){m-=1440;dateStr=new Date(u(dateStr)+DAY).toISOString().slice(0,10)}
  $("#cv-date").value=dateStr;$("#cv-time").value=hmm(m);
}

/* Jours fériés */
function renderChips(){
  var g=$("#chips");g.setAttribute("aria-label",T("filterAria"));
  g.innerHTML=C.slice().sort(function(a,b){return cname(a).localeCompare(cname(b),LOC)}).map(function(c){
    return '<button type="button" class="chip" data-id="'+c.id+'" aria-pressed="'+state.hf.has(c.id)+'"><span class="code">'+c.code+'</span>'+cname(c)+'</button>';
  }).join("");
}
function rangeLabel(s,e){
  if(!e||e===s)return null;
  var a=u(s),b=u(e);
  try{return utcRange.formatRange(a,b)}catch(x){return utcRange.format(a)+" – "+utcRange.format(b)}
}
function renderHol(){
  var now=Date.now(),today=localDate(refTz(),now),t0=u(today);
  $("#hol-note").textContent=T("holNote",cname(refC()));
  var list=[];
  C.forEach(function(c){
    if(!state.hf.has(c.id))return;
    HOL[c.id].forEach(function(h){
      var s=u(h.s),e=u(h.e||h.s);
      if(e<t0)return;
      var dd=Math.round((s-t0)/DAY);
      if(state.hz&&dd>state.hz)return;
      list.push({c:c,h:h,s:s,e:e,dd:dd});
    });
  });
  list.sort(function(a,b){return a.s-b.s||cname(a.c).localeCompare(cname(b.c),LOC)});
  var box=$("#hol");
  if(!list.length){box.innerHTML='<p class="empty">'+T("holNone")+'</p>';return}
  var html="",cur="";
  list.forEach(function(x){
    var mk=utcMonth.format(Math.max(x.s,t0));
    if(mk!==cur){if(cur)html+="</ul>";cur=mk;html+='<h3 class="month">'+mk+'</h3><ul class="hol">'}
    var rl=rangeLabel(x.h.s,x.h.e);
    var rel=(x.s<=t0&&t0<=x.e)?'<span class="rel now">'+T("relNow")+'</span>':x.dd===1?'<span class="rel">'+T("relTom")+'</span>':'<span class="rel">'+T("relIn",x.dd)+'</span>';
    var pills="";
    if(x.h.t==="reg")pills+='<span class="pill est">'+T("pReg")+'</span>';
    if(x.h.t==="opt")pills+='<span class="pill est">'+T("pOpt")+'</span>';
    if(x.h.est)pills+='<span class="pill est">'+T("pEst")+'</span>';
    var big=rl?(new Date(x.s).getUTCDate()+"–"+new Date(x.e).getUTCDate()):String(new Date(x.s).getUTCDate());
    var sub=rl?utcMonShort.format(x.e):utcWd.format(x.s)+" "+utcMonShort.format(x.s);
    var note=hnote(x.h),small=(rl?rl+(note?" · ":""):"")+note;
    html+='<li class="hi"><div class="dt"><b>'+big+'</b><span>'+sub+'</span></div>'
      +'<div class="hn">'+hname(x.h)+(small?'<small>'+small+'</small>':"")+'</div>'
      +'<div class="hr">'+pills+'<span class="cc">'+x.c.code+'</span>'+rel+'</div></li>';
  });
  html+="</ul>";
  box.innerHTML=html;
}

/* Changements d'heure */
function renderDst(){
  var now=Date.now(),end=now+300*DAY,map={},ref=refTz(),keys=[];
  C.forEach(function(c){
    var tz=tzOf(c),prev=offsetMin(tz,now);
    for(var t=now+DAY;t<=end;t+=DAY){
      var o=offsetMin(tz,t);
      if(o!==prev){
        var lo=t-DAY,hi=t;
        while(hi-lo>1000){var mid=Math.floor((lo+hi)/2);if(offsetMin(tz,mid)===prev)lo=mid;else hi=mid}
        var inst=Math.round(hi/60000)*60000;
        if(!map[inst]){map[inst]=[];keys.push(inst)}
        map[inst].push({c:c,from:prev,to:o});
        prev=o;
      }
    }
  });
  keys.sort(function(a,b){return a-b});
  var el=$("#dst");
  if(!keys.length){el.innerHTML='<li class="muted">'+T("dstNone")+'</li>';return}
  el.innerHTML=keys.map(function(k){
    var g=map[k],f=g[0],oldWall=k+f.from*60000,newWall=k+f.to*60000;
    var diff=(f.to-f.from)/60,word=diff>0?T("dstFwd",diff):T("dstBack",Math.abs(diff));
    var rb=offsetMin(ref,k-1000),ra=offsetMin(ref,k);
    var fx=g.map(function(x){
      if(x.c.id===state.ref)return cname(x.c)+" "+T("dstRef")+" : "+fmtUTC(x.from)+" → "+fmtUTC(x.to);
      return cname(x.c)+" : "+T("dstGap")+" "+fmtGap(x.from-rb)+" → "+fmtGap(x.to-ra);
    }).join(" · ");
    return "<li><div><b>"+g.map(function(x){return cname(x.c)}).join(", ")+"</b> <span class=\"muted\">"+word+"</span></div>"
      +'<div class="mono">'+utcDayLong.format(oldWall)+" · "+hmm(Math.floor((oldWall%DAY)/60000))+" → "+hmm(Math.floor((newWall%DAY)/60000))+"</div>"
      +'<div class="fx">'+fx+"</div></li>";
  }).join("");
}

/* Langue et interface */
function setLang(){
  lang=LANGOF[state.ref];LOC=LOCOF[state.ref];
  document.documentElement.lang=lang;
  initFmt();
  var els=document.querySelectorAll("[data-i]");
  for(var i=0;i<els.length;i++)els[i].textContent=T(els[i].getAttribute("data-i"));
  $("#controls").setAttribute("aria-label",T("settings"));
  fillSelects();renderChips();
}
function fillSelects(){
  $("#ref").innerHTML=C.slice().sort(function(a,b){return cname(a).localeCompare(cname(b),LOC)}).map(function(c){return '<option value="'+c.id+'">'+cname(c)+" — "+pick(CITY[c.id])+"</option>"}).join("");
  $("#us").innerHTML=US_ZONES.map(function(z){return '<option value="'+z.tz+'">'+pick(z.zone)+" — "+pick(z.city)+"</option>"}).join("");
  var o="",i;for(i=7;i<=11;i++)o+='<option value="'+i+'">'+T("hFmt",i)+"</option>";$("#open").innerHTML=o;
  o="";for(i=16;i<=20;i++)o+='<option value="'+i+'">'+T("hFmt",i)+"</option>";$("#close").innerHTML=o;
  $("#ref").value=state.ref;$("#us").value=state.us;$("#open").value=state.open;$("#close").value=state.close;$("#hz").value=String(state.hz);
}
function renderAll(){
  $("#board-note").textContent=T("boardNote",cname(refC()),cityOf(refC()));
  renderBoard();renderTimeline();renderConv();renderHol();renderDst();
}

load();
setLang();setConvNow();renderAll();

$("#ref").addEventListener("change",function(e){state.ref=e.target.value;save();setLang();renderAll()});
$("#us").addEventListener("change",function(e){state.us=e.target.value;save();renderAll()});
$("#open").addEventListener("change",function(e){state.open=+e.target.value;if(state.close<=state.open)state.close=state.open+1;$("#close").value=state.close;save();renderAll()});
$("#close").addEventListener("change",function(e){state.close=+e.target.value;if(state.open>=state.close){state.open=state.close-1;$("#open").value=state.open}save();renderAll()});
$("#tl").addEventListener("change",function(e){
  var id=e.target.getAttribute("data-id");if(!id)return;
  if(e.target.checked)state.sel.add(id);else state.sel.delete(id);
  save();renderTimeline();
  var cb=document.querySelector('#tl input[data-id="'+id+'"]');if(cb)cb.focus();
});
$("#cv-date").addEventListener("input",renderConv);
$("#cv-time").addEventListener("input",renderConv);
$("#cv-now").addEventListener("click",function(){setConvNow();renderConv()});
$("#chips").addEventListener("click",function(e){
  var b=e.target.closest(".chip");if(!b)return;
  var id=b.getAttribute("data-id");
  if(state.hf.has(id)&&state.hf.size>1)state.hf.delete(id);else state.hf.add(id);
  save();renderChips();renderHol();
  var nb=document.querySelector('#chips .chip[data-id="'+id+'"]');if(nb)nb.focus();
});
$("#hz").addEventListener("change",function(e){state.hz=+e.target.value;save();renderHol()});

var lastMin=-1,lastDate="";
setInterval(function(){
  renderBoard();moveNow();
  var now=Date.now(),m=Math.floor(now/60000);
  if(m!==lastMin){
    lastMin=m;
    if(sigNow(now)!==tlSig)renderTimeline();
    var d=localDate(refTz(),now);
    if(d!==lastDate){lastDate=d;renderHol()}
  }
},1000);
})();
</script>

</body></html>
